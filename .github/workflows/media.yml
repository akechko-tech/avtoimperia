name: Медиа
# Кинохроника (Wikimedia Commons), живые инструменты (FluidR3_GM), фото-материалы (Poly Haven), голос диктора (Silero).
# Работает только в ветке media: задания — tools/media/jobs.txt, результат коммитится в папку media той же ветки.
on:
  push:
    branches: [media]
    paths: ['tools/media/**', '.github/workflows/media.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Программы
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm > /dev/null
          python3 -m pip install --quiet --user --break-system-packages pillow numpy || python3 -m pip install --quiet pillow numpy
      - name: Нейросетевой голос (только для задания voice)
        run: |
          if grep -qxE 'voice|voice_probe|voice5' tools/media/jobs.txt; then
            python3 -m pip install --quiet --user --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu || python3 -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
            python3 -m pip install --quiet --user --break-system-packages omegaconf || python3 -m pip install --quiet omegaconf
          fi
      - name: Задания
        run: python3 tools/media/run.py
      - name: Сохранить в ветку media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media
          git commit -m "Медиа: $(grep -v '^#' tools/media/jobs.txt | tr '\n' ' ')" || echo "без изменений"
          for k in 1 2 3; do git pull --rebase origin media && git push origin HEAD:media && break; sleep 5; done
