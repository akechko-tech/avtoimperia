name: Сборка APK
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'tools/fetch_textures.py', '.github/workflows/textures.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Pillow для сжатия фото
        run: python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet pillow || echo 'без Pillow'
      - name: Скачать исторические фото
        run: python3 tools/fetch_images.py || echo 'без фото'
      - name: Фото-текстуры гонок (из веб-версии)
        run: mkdir -p app/src/main/assets/tex && cp docs/tex/tex.js app/src/main/assets/tex/tex.js
      - name: Живые инструменты, кинохроника и голос диктора (из веб-версии)
        # инструменты — одним скриптом (со страницы file:// fetch не работает), кинохроника — целиком; голос — только указатель (сам звук — с сайта, без сети — голос телефона)
        run: |
          mkdir -p app/src/main/assets/samples app/src/main/assets/film app/src/main/assets/voice
          if [ -d docs/samples ]; then cp docs/samples/index.js docs/samples/pack.js app/src/main/assets/samples/ 2>/dev/null || true; fi
          if [ -d docs/film ]; then cp -r docs/film/. app/src/main/assets/film/; fi
          if [ -f docs/img/extra.js ]; then mkdir -p app/src/main/assets/img/x && cp docs/img/extra.js app/src/main/assets/img/ && cp -r docs/img/x/. app/src/main/assets/img/x/; fi
          if [ -f docs/voice/index.js ]; then cp docs/voice/index.js app/src/main/assets/voice/; fi
          # реальные трассы (рельеф, карта) — скриптами, подгружаются перед гонкой
          if [ -d docs/terrain ]; then mkdir -p app/src/main/assets/terrain && cp docs/terrain/*.js app/src/main/assets/terrain/; fi
          # свои мелодии игры в оркестровке (марш «Автоимперия» и др.) — вшиты, играют и без сети
          mkdir -p app/src/main/assets/music && cp docs/music/own_*.m4a app/src/main/assets/music/ 2>/dev/null || true
      - name: Собрать APK
        run: gradle assembleRelease --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk avtoimperia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: avtoimperia-apk
          path: avtoimperia.apk
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Автоимперия — последняя версия
          body: |
            Скачайте avtoimperia.apk и установите на Android.
            Сборка №${{ github.run_number }} от коммита ${{ github.sha }}.
          files: avtoimperia.apk
          make_latest: true
