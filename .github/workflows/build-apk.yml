name: Сборка APK
# main — выпуск (релиз latest). Ветка trial — пробная сборка из рабочей ветки: git push origin wip-X:trial.
# Пробная ставится рядом с основной игрой (свой значок, свои сохранения) и публикуется в релиз proba.
on:
  push:
    branches: [main, trial]
    paths-ignore: ['docs/**', 'tools/fetch_textures.py', '.github/workflows/textures.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TRIAL: ${{ github.ref_name != 'main' }}
      TRIAL_VER: '0.51'
      APK: ${{ github.ref_name == 'main' && 'avtoimperia.apk' || 'avtoimperia-proba.apk' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Pillow для сжатия фото
        run: python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet pillow || echo 'без Pillow'
      - name: Скачать исторические фото
        run: python3 tools/fetch_images.py || echo 'без фото'
      - name: Фото-текстуры гонок (из веб-версии)
        run: mkdir -p app/src/main/assets/tex && cp docs/tex/tex.js app/src/main/assets/tex/tex.js
      - name: Живые инструменты, кинохроника и голос диктора (из веб-версии)
        # инструменты — одним скриптом (со страницы file:// fetch не работает), кинохроника — целиком; голос — только указатель (сам звук — с сайта, без сети — голос телефона)
        run: |
          mkdir -p app/src/main/assets/samples app/src/main/assets/film app/src/main/assets/voice
          if [ -d docs/samples ]; then cp docs/samples/index.js docs/samples/pack.js app/src/main/assets/samples/ 2>/dev/null || true; fi
          if [ -d docs/film ]; then cp -r docs/film/. app/src/main/assets/film/; fi
          if [ -f docs/img/extra.js ]; then mkdir -p app/src/main/assets/img/x && cp docs/img/extra.js app/src/main/assets/img/ && cp -r docs/img/x/. app/src/main/assets/img/x/; fi
          if [ -f docs/voice/index.js ]; then cp docs/voice/index.js app/src/main/assets/voice/; fi
          # 0.34: голос механика (легенда трассы, крики) — вшит одним файлом, работает без сети
          if [ -f docs/voice/nav.js ]; then cp docs/voice/nav.js app/src/main/assets/voice/; fi
          # реальные трассы (рельеф, карта) — скриптами, подгружаются перед гонкой
          if [ -d docs/terrain ]; then mkdir -p app/src/main/assets/terrain && cp docs/terrain/*.js app/src/main/assets/terrain/; fi
          # свои мелодии игры в оркестровке (марш «Автоимперия» и др.) — вшиты, играют и без сети
          mkdir -p app/src/main/assets/music && cp docs/music/own_*.m4a docs/music/fan_*.m4a app/src/main/assets/music/ 2>/dev/null || cp docs/music/own_*.m4a app/src/main/assets/music/ 2>/dev/null || true
      - name: Пометить пробную сборку (отдельное приложение, версия в меню)
        if: env.TRIAL == 'true'
        run: |
          sed -i "s/const GAME_VER='[^']*'/const GAME_VER='${TRIAL_VER} · проба №${GITHUB_RUN_NUMBER}'/" app/src/main/assets/index.html
          sed -i 's/applicationId "ru.avtoimperia.game"/applicationId "ru.avtoimperia.game.proba"/' app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${TRIAL_VER}-proba${GITHUB_RUN_NUMBER}\"/" app/build.gradle
          sed -i 's/android:label="Автоимперия"/android:label="Автоимперия · проба"/' app/src/main/AndroidManifest.xml
          grep -q "проба №" app/src/main/assets/index.html
          grep -q 'ru.avtoimperia.game.proba' app/build.gradle
          grep -q 'Автоимперия · проба' app/src/main/AndroidManifest.xml
      - name: Собрать APK
        run: gradle assembleRelease --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: avtoimperia-apk
          path: ${{ env.APK }}
      - name: Опубликовать пробную сборку
        if: env.TRIAL == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: proba
          target_commitish: ${{ github.sha }}
          name: Автоимперия — пробная сборка ${{ env.TRIAL_VER }}
          body: |
            Пробная сборка из рабочей ветки: не выпуск, баланс не окончательный.
            Ставится рядом с основной игрой — отдельный значок «Автоимперия · проба» и свои сохранения.
            Сборка №${{ github.run_number }} от коммита ${{ github.sha }}.
          files: avtoimperia-proba.apk
          prerelease: true
          make_latest: false
      - name: Опубликовать релиз
        if: env.TRIAL != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Автоимперия — последняя версия
          body: |
            Скачайте avtoimperia.apk и установите на Android.
            Сборка №${{ github.run_number }} от коммита ${{ github.sha }}.
          files: avtoimperia.apk
          make_latest: true
