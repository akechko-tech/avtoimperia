name: Сборка APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Pillow для сжатия фото
        run: python3 -m pip install --quiet --user --break-system-packages pillow || python3 -m pip install --quiet pillow || echo 'без Pillow'
      - name: Скачать исторические фото
        run: python3 tools/fetch_images.py || echo 'без фото'
      - name: Собрать APK
        run: gradle assembleRelease --no-daemon
      - name: Переименовать
        run: cp app/build/outputs/apk/release/app-release.apk avtoimperia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: avtoimperia-apk
          path: avtoimperia.apk
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Автоимперия — последняя версия
          body: |
            Скачайте avtoimperia.apk и установите на Android.
            Сборка №${{ github.run_number }} от коммита ${{ github.sha }}.
          files: avtoimperia.apk
          make_latest: true
