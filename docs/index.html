<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Автоимперия">
<meta name="theme-color" content="#0d2136">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}html{-webkit-text-size-adjust:100%}body{overscroll-behavior:none}</style>
</head><body>
<title>Автоимперия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@900&family=UnifrakturMaguntia&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0d2136; --panel:#122d4a; --panel2:#0f2740; --line:#2a5178; --line-soft:#1d3d5e;
  --text:#e6eef7; --muted:#8ea8c3; --brass:#d9ab52; --brass-ink:#1c1406;
  --good:#74d39a; --bad:#ff8474; --warn:#f0c75e;
  --paper:#ece2c8; --ink:#221c14;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Old Standard TT",Georgia,"Times New Roman",serif;
}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;background-color:var(--bg);
  background-image:linear-gradient(rgba(142,168,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(142,168,195,.06) 1px,transparent 1px);
  background-size:24px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 226px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 82%,rgba(13,33,54,0));margin-inline:-16px;padding:12px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.co{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.date{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;display:inline-block}
.date span{color:var(--brass)}
.date.flip{animation:flip .45s ease-out}
@keyframes flip{0%{transform:perspective(300px) rotateX(-80deg);opacity:.2}100%{transform:none;opacity:1}}
.cash{text-align:right}
.cash b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.cash b.neg{color:var(--bad)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;color:var(--muted);cursor:pointer;flex:none;padding:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:10px}
.hr{height:1px;background:var(--line-soft);margin-block:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel2);padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:600}
p{margin:0}
.small{font-size:13px}
.btn{background:transparent;border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:5px 9px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.step button{background:var(--panel2);border:0;width:38px;height:36px;font-size:18px;cursor:pointer}
.step span{min-width:84px;text-align:center;font-family:var(--mono);font-size:15px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.bar{height:8px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line-soft)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .5s ease}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.meta div{font-size:12px;color:var(--muted)}
.meta b{display:block;font-family:var(--mono);font-weight:500;font-size:15px;color:var(--text)}
.spec{font-size:13px;color:var(--muted);margin-top:4px}
.spark{width:100%;height:64px;display:block;margin-top:8px}
.spark .zero{stroke:var(--bad);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke}
.empty-chart{font-size:13px;color:var(--muted);padding:18px 0;text-align:center;border:1px dashed var(--line-soft);border-radius:4px;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=text]{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px;font:inherit;color:var(--text)}
.scene{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a1a2b}
.scene svg{display:block;width:100%;height:auto}
.carbox{background:linear-gradient(180deg,rgba(142,168,195,.05),rgba(142,168,195,.12));border:1px solid var(--line-soft);border-radius:5px;margin-top:10px;overflow:hidden}
.carbox svg{display:block;width:100%;height:auto;max-height:130px}
.car .spin{animation:spin .7s linear infinite;animation-play-state:paused}
.car.anim .spin{animation-play-state:running}
.car.anim .body{animation:bob .35s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-.8px)}}
.carbox.enter svg{animation:enter .7s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{transform:translateX(-60%)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 3.2s linear infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.75}100%{transform:translate(14px,-30px) scale(2);opacity:0}}
.roadcar{animation:drive 9s linear infinite}
.cloud{animation:cloud 42s linear infinite}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(380px)}}
@keyframes drive{from{transform:translateX(-50px)}to{transform:translateX(420px)}}
.roadcar .w{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,26,43,.97);border-top:1px solid var(--line);padding:8px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.bar-nav .in{max-width:560px;margin:0 auto}
.next{display:flex;align-items:stretch;gap:8px}
.next .btn.primary{flex:1;padding:13px;font-size:16px}
.next .btn.q{padding:0 12px;min-width:46px}
.next .btn.q.on{border-color:var(--brass);color:var(--brass)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px}
.tab{background:none;border:0;padding:6px 0;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab.on{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(176px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--panel);border:1px solid var(--brass);border-radius:99px;padding:8px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,12,22,.75);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:13px;cursor:pointer;text-align:left}
.chip small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--brass);background:rgba(217,171,82,.14)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brass)}
.country{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.country .chip{padding:10px}
.pion{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer}
.pion.on{border-color:var(--brass);background:rgba(217,171,82,.12)}
.pion svg{width:64px;height:80px;display:block}
.pion h3{font-size:16px}
.pion .yrs{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pion p{font-size:13px;color:var(--muted);margin-top:4px}
.bon{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bon span{font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--line-soft)}
.bon .p{color:var(--good);border-color:rgba(116,211,154,.4)} .bon .m{color:var(--bad);border-color:rgba(255,132,116,.4)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.log li time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.log li.good p{color:var(--good)} .log li.bad p{color:var(--bad)} .log li.hist p{color:var(--brass)}
.tech{display:grid;grid-template-columns:48px 1fr auto;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.tech.off{color:var(--muted);opacity:.6}
.tech .num{color:var(--muted)}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
table.pl td{padding:4px 0}
table.pl td:last-child,table.pl th:last-child{text-align:right}
table.pl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.pl th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding-bottom:6px}
table.pl th.n{text-align:right}
table.pl tr.tot td{border-top:1px solid var(--line-soft);padding-top:8px;font-weight:600}
.comp{display:grid;grid-template-columns:44px 1fr 80px 40px;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.comp .dot{width:12px;height:12px;border-radius:50%;margin-left:16px}
.comp small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.comp.you{color:var(--brass);font-weight:600}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ach div{border:1px solid var(--line-soft);border-radius:5px;padding:8px 10px;font-size:12px;color:var(--muted)}
.ach div b{display:block;font-size:13px;color:var(--muted)}
.ach div.got{border-color:var(--brass)}
.ach div.got b{color:var(--brass)}
.race-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.race-item:last-child{border-bottom:0}
.race-item .mo{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist{font-family:var(--serif);font-size:15px;line-height:1.5;color:#d9d2c0;border-left:2px solid var(--brass);padding-left:12px;margin-top:10px}

/* photos */
.ph-oval{width:64px;height:80px;border-radius:50%;overflow:hidden;border:3px solid var(--brass);box-sizing:border-box;background:#5a5048}
.ph-oval img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) contrast(1.05)}
.thumb{width:44px;height:32px;border-radius:3px;object-fit:cover;display:block;filter:sepia(.25)}
.photo{position:relative;margin-top:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line-soft)}
.photo img{display:block;width:100%;max-height:220px;object-fit:cover;filter:sepia(.3) contrast(1.05)}
.credit{display:block;font-size:10px;font-family:var(--mono);color:var(--muted);text-decoration:none;padding:3px 6px}
.photo .credit{position:absolute;right:0;bottom:0;background:rgba(0,0,0,.55);color:#ddd}
.p-fig img{display:block;width:100%;max-height:260px;object-fit:cover;filter:grayscale(1) sepia(.4) contrast(1.25)}
.p-fig .credit{color:var(--ink);text-align:right;background:transparent}
/* newspaper */
.paperwrap{position:fixed;inset:0;z-index:15;background:rgba(3,8,14,.82);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto}
.paper{background:var(--paper);color:var(--ink);width:100%;max-width:520px;max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 18px 16px;font-family:var(--serif);box-shadow:0 20px 60px rgba(0,0,0,.6);
  background-image:radial-gradient(rgba(120,90,40,.08) 1px,transparent 1.2px),radial-gradient(rgba(60,40,10,.06) 1px,transparent 1.4px),linear-gradient(90deg,rgba(0,0,0,.05),transparent 8%,transparent 92%,rgba(0,0,0,.06));
  background-size:7px 7px,11px 11px,100% 100%}
.paper.spin{animation:paperIn .9s cubic-bezier(.2,.7,.2,1)}
@keyframes paperIn{0%{transform:rotate(-540deg) scale(.05);opacity:0}70%{opacity:1}100%{transform:none}}
.p-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:4px}
.p-mast{font-family:"Playfair Display",var(--serif);font-weight:900;font-size:clamp(28px,8vw,44px);text-align:center;line-height:1.05;margin:8px 0 6px;letter-spacing:.01em}
.p-mast.frak{font-family:"UnifrakturMaguntia",var(--serif);font-weight:400}
.p-rule{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);height:3px;margin-bottom:8px}
.p-kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-weight:700}
.p-head{font-family:"Playfair Display",var(--serif);font-weight:900;font-size:clamp(24px,6.5vw,34px);line-height:1.08;text-align:center;margin:6px 0;text-wrap:balance}
.p-deck{font-style:italic;text-align:center;font-size:15px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.p-fig{margin:10px 0 4px;border:1px solid var(--ink);background:#e4d8b8}
.p-fig svg{display:block;width:100%;height:auto;filter:grayscale(1) sepia(.35) contrast(1.35)}
.p-cap{font-size:11px;font-style:italic;text-align:center;margin-bottom:8px}
.p-cols{columns:2 190px;column-gap:16px;column-rule:1px solid rgba(34,28,20,.4);font-size:14.5px;line-height:1.45;text-align:justify;hyphens:auto}
.p-cols p{margin:0 0 8px}
.p-cols p.lead::first-letter{float:left;font-family:"Playfair Display",var(--serif);font-weight:900;font-size:44px;line-height:.85;padding:4px 6px 0 0}
.p-side{border-top:1px solid var(--ink);margin-top:8px;padding-top:6px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-side b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.p-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.p-btn{font-family:var(--sans);background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.p-btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}

/* race screen */
#raceScreen{position:fixed;inset:0;z-index:20;background:#070f18;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
#raceScreen[hidden]{display:none!important}
.player{display:flex;align-items:center;gap:4px;margin-bottom:6px;min-width:0;font-size:12px;color:var(--muted)}
.plb{flex:none;background:transparent;border:1px solid var(--line,#2a3a4a);color:var(--brass);border-radius:8px;height:28px;min-width:32px;padding:0 7px;font-size:12px;font-family:inherit}
.plTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px;font-style:italic}
.r-hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.r-hud b{display:block;color:var(--text);font-size:16px;font-weight:500}
.r-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.r-bars .bar{margin-top:3px;height:6px}
#rcv{flex:1;width:100%;min-height:0;display:block;touch-action:none;background:#8fb8da}
#rMap{position:absolute;right:8px;top:8px;width:96px;height:96px;pointer-events:none;opacity:.9}
#rReset{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
#rTilt.on{border-color:var(--brass);color:var(--brass)}
.r-msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-weight:800;font-size:46px;color:var(--brass);text-shadow:0 3px 12px rgba(0,0,0,.7);pointer-events:none}
.r-ctrl{display:grid;grid-template-columns:1fr 1fr 12px 1fr 1.3fr;gap:8px;padding:10px 12px;touch-action:none;user-select:none;-webkit-user-select:none}
.r-ctrl button{height:84px;border-radius:12px;border:2px solid var(--line);background:rgba(142,168,195,.08);font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);touch-action:none;cursor:pointer}
.r-ctrl button.down{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.r-ctrl .gas{border-color:var(--brass);color:var(--brass)}
.r-ctrl .brk{border-color:#8a4a44;color:var(--bad)}
.r-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}
.r-top .label{color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r-top .btns{flex-wrap:nowrap;flex:none}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.r-hud b{font-size:15px}
@media (prefers-reduced-motion:reduce){.cloud,.car .spin,.smoke,.roadcar,.roadcar .w,.car.anim .body,.date.flip,.carbox.enter svg,.paper.spin{animation:none!important}}
@media (max-width:380px){.meta{grid-template-columns:repeat(2,1fr)}.date{font-size:28px}.r-ctrl button{height:72px}}
/* v0.8: главное меню, технологии, дилеры, наследие */
#menuScreen{position:fixed;inset:0;z-index:9;overflow:auto;background:radial-gradient(120% 80% at 50% 0%,#1d3a5c 0%,var(--bg) 60%);padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.menu-in{max-width:520px;margin:0 auto;padding-top:14px}
.menu-art{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45)}
.menu-title{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.04em;text-transform:uppercase;text-align:center;margin:18px 0 0;color:var(--brass);text-shadow:0 2px 0 #3b2a10}
.menu-sub{text-align:center;color:var(--muted);margin:2px 0 16px;font-family:var(--mono);font-size:12px;letter-spacing:.08em}
.menu-btns .btn{min-height:48px;font-size:16px}
.menu-btns .btn small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:2px}
.menu-foot{text-align:center;margin-top:18px}
.tech-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.tech-row:last-child{border-bottom:0}
.tech-row h3{font-size:15px}
.net-row{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.net-row:last-child{border-bottom:0}
.leg-row{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.leg-row .bar{height:8px}
.leg-row b{text-align:right}
table.pl tr.you td{color:var(--brass);font-weight:600}
table.pl td small{display:block;color:var(--muted);font-size:11px;font-weight:400;line-height:1.3}
.chip[disabled]{opacity:.45}

/* v0.8: гоночный штаб, табло, заявка на гонку, сезоны */
.r-board{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:2px;pointer-events:none;font-family:var(--mono);font-size:11px;max-width:52%}
.r-board div{display:grid;grid-template-columns:16px auto 1fr auto;gap:5px;align-items:baseline;background:rgba(5,12,22,.62);padding:3px 7px;border-radius:4px;color:#e8e2d2;white-space:nowrap}
.r-board div span{color:var(--muted)}
.r-board div small{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.r-board div em{font-style:normal;color:var(--muted)}
.r-board div.you{background:rgba(120,90,20,.55)}
.r-board div.me{outline:1px solid var(--brass)}
.r-msg.small{font-size:26px}
.r-mgr{padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
.mgr-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.mgr-top span{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mgr-btns button{height:44px;border-radius:9px;border:1px solid var(--line);background:rgba(142,168,195,.08);color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.mgr-btns button.on{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.entries{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.entry{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.entry .grow{flex:1;min-width:0}
.entry .grow b{display:block;font-size:14px}
.entry .grow small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.entry .col{display:flex;flex-direction:column;gap:6px}
.entry.open{display:block;border-color:var(--brass)}
.entry.open>.row b{font-size:15px}
.rs-car{flex:none;width:66px;height:58px;background:radial-gradient(80% 60% at 50% 70%,rgba(217,171,82,.18),transparent)}
.rs-top{display:flex;gap:10px;align-items:center;margin-top:8px}
.rs-top .rs-car{width:96px;height:84px}
.stat-grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;min-width:0}
.stat-grid div span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat-grid div b{font-size:13px;font-weight:600}
.stat-grid b.warn{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:rgba(217,171,82,.14);color:var(--brass)}
.star{color:var(--brass);font-size:13px}
.champ{border-top:1px solid var(--line-soft);margin-top:12px;padding-top:12px}
.champ:first-of-type{border-top:0;padding-top:4px}
.c-races{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.c-races span{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line-soft);color:var(--text)}
.c-races span.good{border-color:var(--good);color:var(--good)}
.c-races span.bad{color:var(--bad)}
.c-races span.muted{color:var(--muted)}
.trophies{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trophies span{font-size:13px;padding:4px 8px;border-radius:5px;background:rgba(217,171,82,.12);border:1px solid rgba(217,171,82,.35)}
table.res td small{display:block}
@media (max-width:380px){.stat-grid{grid-template-columns:1fr}.rs-top .rs-car{width:80px;height:70px}.mgr-btns button{font-size:13px}}
table.res td:first-child,table.res th:first-child{width:26px;text-align:left;color:var(--muted);padding-right:6px}
.champ table.pl td:first-child,.sheet table.pl td.n:first-child{width:24px;text-align:left;color:var(--muted);padding-right:6px}
</style>

/* ================= MODEL ================= */
let G=null,tab='plant',draft=null,auto=null;
const T=s=>(s.y-1895)+s.m/12;
const mi=s=>(s.y-1895)*12+s.m;
const yf=s=>s.y+s.m/12;
const dstr=s=>MONTHS[s.m]+' '+s.y;
const unlocked=(arr,s)=>arr.filter(x=>x.y<=s.y);
const isTruck=md=>!!byId(BODIES,md.b).truck;
const segOf=md=>isTruck(md)?'truck':md.t==='t0'?'people':md.t==='t1'?'middle':'lux';
function DIF(){return DIFFS[(G&&G.diff)||'normal'];}
const upgL=id=>(G&&G.rd&&G.rd.upg[id])||0;
function unlockedP(arr,s){return arr.filter(x=>x.y<=s.y||(s.rd&&s.rd.early.includes(x.id)));}
function rdPoints(s){return s.rd.lvl*bn('rd');}
function rdUpCost(s){return Math.round(4000*s.rd.lvl*cpi(s)*(1+0.05*T(s))/100)*100;}
function rdUpkeep(s){return Math.round(60*Math.pow(s.rd.lvl,1.35)*cpi(s)*(1+0.03*T(s)));}
function rdProjects(s){
  const list=[];
  [[ENGINES,'Двигатель'],[CHASSIS,'Рама'],[BODIES,'Кузов'],[TYRES,'Шины']].forEach(([arr,kind])=>{
    unlockedP(arr,s).forEach(x=>{const l=upgL(x.id);if(l<3)list.push({kind:'upg',id:x.id,cat:kind,name:x.name,lvl:l+1,need:6*(l+1)+Math.round(x.q/8)});});
    const nx=arr.filter(x=>x.y>s.y&&!s.rd.early.includes(x.id)).sort((a,b)=>a.y-b.y)[0];
    if(nx&&nx.y-s.y<=s.rd.lvl+1)list.push({kind:'early',id:nx.id,cat:kind,name:nx.name,need:10+6*(nx.y-s.y),yrs:nx.y-s.y});
  });
  return list;
}
function PB(){return (G&&PIONEERS[G.pioneer]||PIONEERS.custom).b;}
function bn(k,d=1){const b=PB();return b[k]!==undefined?b[k]:d;}
function segBonus(g){const b=PB();return b.seg&&b.seg[g]||1;}
/* ---------- prices, wages, parts ---------- */
function cpi(s){return tabAt(CPI,yf(s));}
function wageBase(s,c){return tabAt(WAGE[c||s.country],yf(s));}
const WAGE_POL={low:{name:'Ниже рынка',k:0.85,prod:0.9,strike:0.045,turn:'высокая'},market:{name:'По рынку',k:1,prod:1,strike:0.02,turn:'обычная'},good:{name:'Выше рынка',k:1.25,prod:1.07,strike:0.008,turn:'низкая'},five:{name:'«Пять долларов в день»',k:2.2,prod:1.28,strike:0.002,turn:'почти нет',y:1914}};
function wageNow(s){return wageBase(s)*WAGE_POL[s.wagePol||'market'].k*(s.shifts>1?1.08:1);}
// В США поставщики рано перешли на поток: с 1903 года детали там заметно дешевле
function partCountry(s){const c=s.country;return c==='us'?(s.y<1903?1:s.y<1910?0.8:0.72):c==='uk'||c==='it'?1.05:1;}
function partCost(x,s){return x.c*cpi(s)*Math.max(0.4,1-0.04*Math.max(0,yf(s)-x.y))*partCountry(s);}
function bestQ(arr,y,f){const a=arr.filter(x=>x.y<=y&&(!f||f(x)));return a.length?Math.max(...a.map(x=>x.q)):0;}
function eraBest(s,truck){let b=bestQ(BODIES,s.y,x=>!!x.truck===!!truck);if(!b)b=bestQ(BODIES,s.y,x=>!x.truck);return bestQ(ENGINES,s.y)+bestQ(CHASSIS,s.y)+bestQ(TYRES,s.y)+b+12;}
const parts=md=>({e:byId(ENGINES,md.e),c:byId(CHASSIS,md.c),b:byId(BODIES,md.b),t:byId(TRIMS,md.t),w:byId(TYRES,md.w||'w2')});
function chassisMax(c){return c.max*bn('chassisTol')*(1+0.15*upgL(c.id));}
function engineHp(e){return e.hp*(1+0.1*upgL(e.id));}
function overpower(md){const p=parts(md);return p.e.hp>chassisMax(p.c);}
function modelQ(md){const p=parts(md);const u=x=>x.q*(1+0.12*upgL(x.id));const q=u(p.e)+u(p.c)+u(p.b)+u(p.w)+p.t.q;return (overpower(md)?q*0.6:q)*bn('quality');}
function modelR(md,s){return Math.min(1.15,modelQ(md)/eraBest(s,isTruck(md)));}
function baseCost(md,s){const p=parts(md);return partCost(p.e,s)+partCost(p.c,s)+partCost(p.b,s)+partCost(p.w,s)+p.t.c*cpi(s);}
function learn(md){return Math.max(0.8,Math.pow(1+(md.made||0)/200,-0.045));}
// Скидка поставщиков за объём: единичные машины дороже, партии в десятки тысяч — дешевле
function volFactor(v){return clamp(1.3-0.13*Math.log10(1+Math.max(0,v)),0.6,1.3);}
function matCost(md,s){const p=parts(md),tc=s.tech||{};let c=baseCost(md,s);
  if(tc.foundry)c-=partCost(p.e,s)*0.18;if(tc.press&&!isTruck(md))c-=partCost(p.b,s)*0.15;
  return Math.max(10,c*volFactor(md.vol||md.lastMade||1)*learn(md)*bn('matCost')*(s.supplyNow||1));}
function complexity(md){const p=parts(md);return p.e.cx*p.c.cx*p.b.cx*p.t.cx;}

function pushEvent(ev,paper){
  const text=typeof ev.text==='function'?ev.text(G):ev.text;
  if(ev.fx)ev.fx(G);
  addLog(`${ev.title}. ${text}`,'hist');
  G.pending.push({title:ev.title,deck:ev.deck||'',text,img:ev.img||'',kicker:ev.kicker||'',paper:!!paper,choices:ev.choices||[['Читать дальше','ok']]});
}
function inCountries(spec,c){if(!spec)return true;if(spec[0]==='!')return !spec.slice(1).split(',').includes(c);return spec.split(',').includes(c);}

  if(mi(s)>6&&!s.pending.length&&Math.random()<0.055){const pool=RANDOM.filter(r=>!r.cond||r.cond(s)),wt=r=>r.w*(r.good?1:DIF().bad),tot=pool.reduce((a,r)=>a+wt(r),0);let x=Math.random()*tot;for(const r of pool){x-=wt(r);if(x<=0){pushEvent(r,false);break;}}}
}
function yearlyCompetitors(s){

    const nm=(cp.models||[]).find(x=>x[0]===s.y);if(nm&&s.y>1895&&compVol(cp,s)>0)addLog(`«${compName(cp,s)}» представила ${nm[1]}.`,'bad');
  });

function resolve(key){
  const s=G;
  if(key==='raise'){s.wagePol=s.wagePol==='low'?'market':s.wagePol==='market'?'good':s.wagePol;addLog(`Зарплата поднята: ${WAGE_POL[s.wagePol].name.toLowerCase()}. Забастовки не будет.`);}
  if(key==='wait')s.strikeNext=true;
  if(key==='mil'){s.military=true;addLog('Военный контракт подписан.');}
  if(key==='restart'){s.pending=[];openNewGame();return;}
  if(key==='final'){s.pending.shift();finalResults(s,true);save();render();return;}
  s.pending.shift();save();render();
}

function driverFee(d,s){return Math.round(600*cpi(s)*(1+T(s)*0.08)*(0.4+d.sk*d.sk*1.8)*bn('drvFee')/50)*50;}
function driverSalary(d,s){return Math.round(45*cpi(s)*(1+T(s)*0.05)*(0.4+d.sk*1.4)*bn('drvFee')/5)*5;}
function driverRaceFee(d,s){return Math.round(driverFee(d,s)*0.35/10)*10;}
function driverPayroll(s){return (s.drivers||[]).reduce((a,id)=>{const d=DRIVERS.find(x=>x.id===id);return a+(d?driverSalary(d,s):0);},0);}
function availDrivers(s){const ex=PIONEERS[s.pioneer].drv;return DRIVERS.filter(d=>d.from<=s.y&&d.to>=s.y&&!(s.drivers||[]).includes(d.id)&&d.id!==ex);}
function raceEligible(r,s){return r.c==='intl'||!COUNTRIES[r.c]||r.c===s.country||dealerCount(s,r.c)>0;}
function raceWarBlocked(r,s){const c=COUNTRIES[r.c]?r.c:'fr';return r.c==='intl'?isWar(s.y,s.m,s.country)&&s.country!=='us':isWar(r.y,r.m,c);}
function raceOpen(r,s){return r.y===s.y&&(s.m===r.m||s.m===r.m-1);}
function racePrize(r){const mul={sprint:0.4,road:1.2,circuit:1,endurance:1.2,hill:0.5,rally:1.1,oval:1.1}[r.t]*(r.c==='intl'?1.3:1)*(r.major?1.6:1);return Math.round(3500*tabAt(CPI,r.y)*(1+(r.y-1895)*0.04)*mul/100)*100;}
function raceFee(r){return Math.round(racePrize(r)*0.08/10)*10;}

    if(d>0){r.hire=d*8*cpi(s);s.cash-=r.hire;}s.workers=Math.max(3,s.workers+d);}
  const kLab=needH>0?Math.min(1,s.workers*hpw/needH):1,k=Math.min(kCap,kLab);

  if(milCap>0){const mc=act.reduce((a,m)=>a+matCost(m,s),0)/act.length,mu=Math.floor(milCap*k);r.mat+=mu*mc;r.mil=mu*mc*1.35;r.milN=mu;r.made+=mu;}

    sold=Math.min(sold,md.stock);md.stock-=sold;const unmet=Math.max(0,reqT-sold);md.backlog=Math.min(unmet*0.5,md.fc*0.8);r.lostCap+=unmet-md.backlog;

  for(const c in COUNTRIES){const L=s.comps[c]||[];L.forEach(x=>x.last=0);let size=0,you=0;const sg={};
    SEGK.forEach(g=>{const m=D.mk[c].segs[g];size+=m.total||0;sg[g]={size:m.total||0,you:0,pot:m.pot||0};m.comps.forEach(o=>{if(L[o.i])L[o.i].last+=o.sales;});});

function endOfYear(s){
  s.m=0;s.y++;
  if((s.yearSold||0)>(s.peak.year||0))s.peak.year=s.yearSold;s.peakLast=s.yearSold||0;s.yearSold=0;

  yearlyCompetitors(s);
  s.drivers=s.drivers.filter(id=>{const d=DRIVERS.find(x=>x.id===id);if(!d||d.to<s.y){if(d)addLog(`${d.n} завершил гоночную карьеру и покинул команду.`);return false;}return true;});
  legacyYear(s);

function recordFirst(s,key,name,histY,who){if(!s.firsts)s.firsts={};if(s.firsts[key]||s.y>=histY)return;

function legacyParts(o){

function playerLegacy(s){

  const abroad=Object.keys(s.peak.share||{}).filter(c=>c!==s.country&&s.peak.share[c]>=0.05).length;
  const techs=Object.values(s.tech||{}).reduce((a,b)=>a+b,0);

const LEG_NAMES={scale:'Масштаб',market:'Рынок',innov:'Инновации',sport:'Спорт',capital:'Капитал',brand:'Бренд'};
function legacyTable(s){
  const me=playerLegacy(s);const rows=HIST_CO.map(h=>({n:h.n,c:h.c,p29:h.p29,val:h.val,note:h.note,L:histLegacy(h)}));
  rows.push({n:s.company,c:s.country,you:1,p29:s.peak.year||0,val:companyValue(s),L:me});

function legacyTitle(t){
  const me=t.me,cats=['scale','market','innov','sport','capital','brand'],norm={scale:400,market:200,innov:200,sport:300,capital:250,brand:160};
  const top=cats.slice().sort((a,b)=>me[b]/norm[b]-me[a]/norm[a])[0];
  if(t.place===1)return ['Величайшая автоимперия эпохи','Ни одна реальная компания 1929 года не оставила такого следа.'];
  if(top==='scale'&&me.scale>=330)return ['Новый Форд','Ваши машины ездят по всему миру — автомобиль стал вещью для всех.'];
  if(top==='sport'&&me.sport>=200)return ['Бугатти своего времени','Имя компании знают по победам на трассах.'];
  if(top==='brand'&&me.brand>=110)return ['Роллс-Ройс эпохи','Ваша марка — синоним надёжности и роскоши.'];
  if(top==='innov'&&me.innov>=120)return ['Изобретатели эпохи','Вы придумали то, чем потом пользовались все.'];
  if(top==='capital'&&me.capital>=160)return ['Финансовая империя','Как General Motors: сила компании — в деньгах и управлении.'];
  if(t.place<=5)return ['Великая компания','Одна из пяти самых заметных автомобильных компаний эпохи.'];
  if(t.place<=12)return ['Заметная марка','Историки автомобиля знают вашу компанию.'];
  return ['Одна из сотен марок','Из сотен марок 1900-х до 1929 года дожили единицы. Ваша — среди них.'];
}

// Подготовка к гонке: серийная машина, облегчённая (без тента, крыльев и задних сидений), заводской гоночный кузов
const PREP=[{id:0,name:'Серийная',desc:'как в продаже',cost:0},{id:1,name:'Облегчённая',desc:'без тента, крыльев и фонарей',cost:0.2},{id:2,name:'Заводской гоночный кузов',desc:'узкий кузов, форсированный мотор',cost:0.55}];
function mechanicEra(y){return y<1925;}
function racingCd(y){return y<1906?0.85:y<1914?0.75:y<1922?0.65:0.55;}
function carStats(md,prep,y){
  const p=parts(md);prep=prep||0;y=y||(G?G.y:1895);
  let bodyKg=p.b.kg,cd=p.b.cd,cg=p.b.cg,hpK=1,relK=1;
  if(p.t.id==='t2')bodyKg+=40;else if(p.t.id==='t1')bodyKg+=15;
  if(prep===1){bodyKg*=0.72;cd*=0.88;hpK=1.05;relK=0.98;cg-=0.03;}
  if(prep===2){bodyKg=70+(y<1905?40:0);cd=racingCd(y);cg=0.6;hpK=1.25;relK=0.93;}
  const hp=engineHp(p.e)*hpK,crew=75+(mechanicEra(y)?70:0);
  const m=p.e.kg+p.c.kg*(1-0.05*upgL(p.c.id))+bodyKg+p.w.kg+crew+40;
  const P=hp*745.7*0.82,kd=0.5*1.2*cd,crr=p.w.id==='w1'?0.03:0.016,g=9.81;
  let v=20;for(let i=0;i<30;i++){const f=kd*v*v*v+crr*m*g*v-P,df=3*kd*v*v+crr*m*g;v=Math.max(3,v-f/df);}
  let t=0,vv=0.5,t30=999;const muT=0.75*(p.w.grip||1);while(vv<16.7&&t<120){const a=Math.min(muT*g*0.56,(P/Math.max(vv,3.5)-kd*vv*vv-crr*m*g)/m);if(a<=0.02){t=999;break;}vv+=a*0.05;t+=0.05;if(vv>=8.33&&t30===999)t30=t;}
  const grip=(p.w.grip||1)*(1+0.08*upgL(p.w.id));
  const rel=clamp(p.e.rel*(1+0.02*upgL(p.e.id))*(0.85+0.15*Math.min(1,modelQ(md)/eraBest({y},false)))*relK*(overpower(md)?0.75:1),0.3,0.99);
  return {hp,kg:Math.round(m),P,kd,crr,vmax:v,acc:t,acc30:t30,cd,cg,brk:p.c.brk,grip,rel,wb:p.c.wb+(p.e.hp>40?0.3:0),wire:!!p.c.wire,mech:mechanicEra(y),hpKg:hp/m*1000};
}
function accText(st){return st.acc<999?`0–60 за ${st.acc.toFixed(1).replace('.',',')} с`:st.acc30<999?`0–30 за ${st.acc30.toFixed(1).replace('.',',')} с`:'разгон медленный';}

const IMG={};let imgTried=false;
function allTitles(){const t=new Set();Object.values(PIONEERS).forEach(p=>p.wiki&&t.add(p.wiki));Object.values(COMPS).flat().forEach(c=>c.models.forEach(m=>m[2]&&t.add(m[2])));

async function loadImages(){
  if(imgTried)return;imgTried=true;
  try{const c=JSON.parse(localStorage.getItem('avt-img')||'null');if(c&&c.v===1&&Date.now()-c.t<7*864e5){Object.assign(IMG,c.map);return;}}catch(e){}
  try{
    const titles=allTitles(),map={};
    for(let i=0;i<titles.length;i+=40){
      const chunk=titles.slice(i,i+40);
      const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=480&titles='+encodeURIComponent(chunk.join('|'));
      const j=await fetch(url).then(r=>r.json());const q=j.query||{};const alias={};
      (q.normalized||[]).forEach(n=>alias[n.to]=(alias[n.to]||[]).concat(n.from));
      (q.redirects||[]).forEach(n=>{alias[n.to]=(alias[n.to]||[]).concat(n.from,...(alias[n.from]||[]));});
      Object.values(q.pages||{}).forEach(pg=>{
        if(!pg.thumbnail||!pg.pageimage)return;
        if(!/\/wikipedia\/commons\//.test(pg.thumbnail.source))return;
        if(/logo|map|layout|circuit|coat_of_arms|flag|emblem|\.svg$/i.test(pg.pageimage))return;
        const v={src:pg.thumbnail.source,file:pg.pageimage};map[pg.title]=v;(alias[pg.title]||[]).forEach(a=>map[a]=v);
      });
    }
    Object.assign(IMG,map);
    try{localStorage.setItem('avt-img',JSON.stringify({v:1,t:Date.now(),map}));}catch(e){}
    if(G)render();
  }catch(e){}
}

const RACE_ACT={};
let RS=null;   // заявка на гонку: {key, entries:[{drv,car,prep,tyre,gear}], open, mode, more}
const MAX_ENTRIES=3;
function raceCarsFor(s){return s.models.filter(m=>m.status==='prod');}
function raceRank(md,rc){const st=carStats(md,2,rc.y);return st.vmax*(0.55+0.45*st.rel)/(1+st.acc/60);}
function prepAllowed(p,s,rc){return p<2||(s.rdept||0)>=1;}
function defaultEntry(s,rc,taken){
  const cars=raceCarsFor(s).sort((a,b)=>raceRank(b,rc)-raceRank(a,rc)),free=['me',...(s.drivers||[])].filter(d=>!taken.includes(d)),cfg=trackCfg(rc);
  // свободных своих пилотов нет — предложить лучшего свободного гонщика на одну гонку
  if(!free.length){const d=availDrivers(s).filter(x=>!taken.includes(x.id)).sort((a,b)=>b.sk-a.sk)[0];if(d)free.push(d.id);}
  return {drv:free[0]||null,car:cars[0]?cars[0].id:null,prep:(s.rdept||0)>=1&&!['rally','endurance'].includes(rc.t)?2:1,tyre:rc.km>600&&!cfg.pits?'hard':'soft',gear:['oval','sprint'].includes(rc.t)?1:rc.t==='hill'?-1:0};
}
function drvObj(id){return id&&id!=='me'?DRIVERS.find(d=>d.id===id):null;}
function entryCost(rc,e,s){const d=drvObj(e.drv),hire=d&&!(s.drivers||[]).includes(d.id)?driverRaceFee(d,s):0,fee=raceFee(rc),prep=prepCost(rc,e.prep,s);return {fee,prep,hire,total:fee+prep+hire};}
function setupTotal(rc,s){return RS.entries.reduce((a,e)=>{const c=entryCost(rc,e,s);a.fee+=c.fee;a.prep+=c.prep;a.hire+=c.hire;a.total+=c.total;return a;},{fee:0,prep:0,hire:0,total:0});}
// Оценка шанса доехать до финиша: та же модель отказов, что и в гонке
function finishChance(st,rc,s){const dnf=dnfTarget(rc.y,rc.t),rel=clamp(st.rel*(RDEPT[s.rdept||0].rel||1),0.3,0.995);return clamp(Math.pow(1-dnf,Math.pow((1-rel)/fieldRelRef(rc,s),1.6)*1.1),0.05,0.99);}
function tyreLife(md,rc,e){const p=parts(md),cfg=trackCfg(rc),tr=TERR[cfg.terr]||TERR.dirt;return Math.round(p.w.life*(tr.tyre||1)*(1+0.12*upgL(p.w.id))/(e.tyre==='soft'?1.35:0.8));}
function brakeName(b){return b<0.5?'ленточные, слабые':b<0.6?'колодочные на задние колёса':b<0.8?'усиленные':'гидравлика на все колёса';}
function openRaceSetup(key){
  const s=G,rc=RACES.find(r=>r.key===key);if(!rc||R)return;
  if(!raceCarsFor(s).length){toast('Нет машин в производстве');return;}
  if(!RS||RS.key!==key)RS={key,entries:[defaultEntry(s,rc,[])],open:0,mode:'drive',more:false};
  renderRaceSetup();
}

function trackCfg(rc){

  if(rc.t==='circuit')Object.assign(c,{closed:true,laps:2,len:1500,curvy:0.6,pits:true});
  if(rc.t==='endurance')Object.assign(c,{closed:true,laps:3,len:1400,curvy:0.45,pits:true,night:rc.id==='lemans'||rc.id==='spa24',town:false});
  if(rc.t==='hill')Object.assign(c,{len:1400,curvy:1,hilly:0.2,uphill:true,terr:'mount',town:false,crowd:0.2,width:7});
  if(rc.t==='rally')Object.assign(c,{len:2600,curvy:0.55,hilly:0.6,stages:['snow','mud','dirt'],crowd:0.06});
  if(rc.t==='oval')Object.assign(c,{closed:true,laps:3,len:1250,oval:true,pits:true,town:false,crowd:0.6,width:14,terr:rc.y<1920?'concrete':'asphalt'});
  if(rc.t==='sprint')Object.assign(c,{len:1100,sprint:true,town:false,crowd:0.5,terr:'beach',width:16});
  if(rc.track==='indy')c.terr='brick';
  if(rc.track==='board'){c.terr='board';c.banked=true;}
  if(rc.track==='brooklands'){c.terr='concrete';c.banked=true;}
  if(rc.track==='monza')Object.assign(c,{curvy:0.35,len:1800});
  if(rc.track==='nurb')Object.assign(c,{curvy:0.95,hilly:0.9,len:1900,host:'de'});
  if(rc.track==='monaco')Object.assign(c,{curvy:1,hilly:0.25,town:true,crowd:0.7,len:1100,width:8,terr:'asphalt',host:'mc'});
  if(rc.track==='lemans')Object.assign(c,{curvy:0.35,len:1700});
  if(rc.track==='targa')Object.assign(c,{curvy:1,hilly:0.9,terr:'mount',host:'it'});

/* ---------- track generation ---------- */
function buildTrack(rc,vref){
  const cfg=trackCfg(rc);if(vref){const dur={road:110,circuit:120,endurance:170,hill:65,rally:130,oval:100,sprint:40}[rc.t]||110,total=dur*vref*0.62;cfg.len=clamp(cfg.closed?total/cfg.laps:total+200,cfg.closed?650:500,cfg.closed?2600:3600);if(cfg.sprint)cfg.len=clamp(vref*42,500,1600);cfg.dur=dur;}
  const rnd=mulberry32(hashStr(rc.key)),STEP=4;let pts=[];
  if(cfg.closed){
    const fine=[];const M=3000;
    if(cfg.oval){const Rr=cfg.len*0.11,Ls=(cfg.len-2*Math.PI*Rr)/2;
      for(let i=0;i<M;i++){const u=i/M*cfg.len;let x,z;
        if(u<Ls){x=Rr;z=-Ls/2+u;}else if(u<Ls+Math.PI*Rr){const a=(u-Ls)/Rr;x=Rr*Math.cos(a);z=Ls/2+Rr*Math.sin(a);}
        else if(u<2*Ls+Math.PI*Rr){x=-Rr;z=Ls/2-(u-Ls-Math.PI*Rr);}else{const a=(u-2*Ls-Math.PI*Rr)/Rr;x=-Rr*Math.cos(a);z=-Ls/2-Rr*Math.sin(a);}
        fine.push([x,0,z]);}}
    else{const R0=cfg.len/(2*Math.PI),H=[];let sum=0;for(let k=2;k<=5;k++){const a=rnd()*0.13*cfg.curvy*(k<4?1:0.6);sum+=a;H.push([k,a,rnd()*6.28]);}
      const sc=sum>0.38?0.38/sum:1,Hy=[[1,rnd()*6.28],[2,rnd()*6.28],[3,rnd()*6.28]];
      for(let i=0;i<M;i++){const th=i/M*Math.PI*2;let r=1;H.forEach(([k,a,ph])=>r+=a*sc*Math.cos(k*th+ph));r*=R0;
        let y=0;Hy.forEach(([k,ph],j)=>y+=Math.sin(k*th+ph)*cfg.hilly*(9-j*2.5));fine.push([Math.cos(th)*r,y,Math.sin(th)*r]);}}
    const cum=[0];for(let i=1;i<=M;i++){const a=fine[i-1],b=fine[i%M];cum.push(cum[i-1]+Math.hypot(b[0]-a[0],b[2]-a[2]));}
    const L=cum[M],n=Math.floor(L/STEP);let j=0;
    for(let i=0;i<n;i++){const d=i*L/n;while(cum[j+1]<d)j++;const t=(d-cum[j])/(cum[j+1]-cum[j]||1),a=fine[j],b=fine[(j+1)%M];pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);}
  }else{
    let x=0,y=0,z=0,h=0,slope=0;const push=()=>pts.push([x,y,z]);push();
    const straight=len=>{for(let d=0;d<len;d+=STEP){x+=Math.sin(h)*STEP;z+=Math.cos(h)*STEP;y+=slope*STEP;push();}};
    const arc=(R,ang)=>{const n=Math.max(2,Math.round(Math.abs(ang)*R/STEP)),da=ang/n;for(let i=0;i<n;i++){h+=da;x+=Math.sin(h)*STEP;z+=Math.cos(h)*STEP;y+=slope*STEP;push();}};
    straight(120);
    while(pts.length*STEP<cfg.len-160){
      slope=cfg.uphill?0.06+rnd()*0.05:(rnd()*2-1)*0.05*cfg.hilly;
      if(cfg.sprint){straight(200);continue;}
      const r=rnd(),dir=rnd()<0.5?-1:1;
      if(r<0.35-cfg.curvy*0.2)straight(40+rnd()*160);
      else if(r<0.35+cfg.curvy*0.25){arc(12+rnd()*18,dir*(1.6+rnd()*1.3));straight(20+rnd()*30);}
      else arc(40+rnd()*160,dir*(0.4+rnd()*1.1));
      if(Math.abs(h)>1.75){arc(60,-Math.sign(h)*0.9);}
    }
    slope=cfg.uphill?0.03:0;straight(200);
  }
  const n=pts.length,closed=cfg.closed,T=[],N=[],K=[];
  for(let i=0;i<n;i++){const a=pts[closed?(i-1+n)%n:Math.max(0,i-1)],b=pts[closed?(i+1)%n:Math.min(n-1,i+1)];let tx=b[0]-a[0],tz=b[2]-a[2];const l=Math.hypot(tx,tz)||1;T.push([tx/l,tz/l]);N.push([-tz/l,tx/l]);}
  for(let i=0;i<n;i++){const a=T[closed?(i-1+n)%n:Math.max(0,i-1)],b=T[closed?(i+1)%n:Math.min(n-1,i+1)];const cr=a[0]*b[1]-a[1]*b[0],dt=a[0]*b[0]+a[1]*b[1];K.push(Math.atan2(cr,dt)/(2*STEP));}
  const W=cfg.width,terrAt=i=>cfg.stages?cfg.stages[Math.min(2,Math.floor(i/n*3))]:cfg.terr;
  const trk={pts,T,N,K,n,step:STEP,closed,len:n*STEP,W,cfg,terrAt,col:[],grid:{},rc,spr:[],bar:[]};
  trk.startIdx=closed?0:30;trk.finishIdx=closed?0:n-40;
  trk.raceLen=closed?cfg.laps*trk.len:(trk.finishIdx-trk.startIdx)*STEP;
  trk.cgrid={};for(let i=0;i<n;i+=2){const k=Math.floor(pts[i][0]/30)+','+Math.floor(pts[i][2]/30);(trk.cgrid[k]=trk.cgrid[k]||[]).push(i);}
  placeScenery(trk,rnd);
  return trk;
}
function nearTrack(trk,x,z,rad,skip){const cx=Math.floor(x/30),cz=Math.floor(z/30);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const L=trk.cgrid[(cx+a)+','+(cz+b)];if(!L)continue;for(const i of L){if(skip!==undefined&&Math.abs(i-skip)<8)continue;const p=trk.pts[i];if((p[0]-x)**2+(p[2]-z)**2<rad*rad)return true;}}return false;}
function addCollider(trk,x,z,r,kind,i){const o={x,z,r,kind};trk.col.push(o);if(!trk.segCol)trk.segCol=[];const n=trk.n;for(let k=-3;k<=3;k++){const j=trk.closed?((i+k)%n+n)%n:i+k;if(j<0||j>=n)continue;(trk.segCol[j]=trk.segCol[j]||[]).push(o);}}
// Декорации вдоль трассы: t — тип спрайта, off — смещение от оси (м, + влево), v — вариант
function placeScenery(trk,rnd){
  const {n,W,cfg,pts,N}=trk,set=SCEN_SETS[cfg.host],spr=trk.spr;for(let i=0;i<n;i++){spr.push([]);trk.bar.push(null);}
  const add=(i,t,off,v,kind,colR)=>{i=((i%n)+n)%n;const p=pts[i],nn=N[i],x=p[0]+nn[0]*off,z=p[2]+nn[1]*off;if(Math.abs(off)>W/2+1&&nearTrack(trk,x,z,W/2+1.5,i))return false;
    spr[i].push({t,off,v:v||0,k:kind||'s'});if(colR)addCollider(trk,x,z,colR,t,i);return true;};
  const sharp=i=>Math.abs(trk.K[((i%n)+n)%n])>1/40;

  let alley=0;
  for(let i=0;i<n;i++){
    const tr=trk.terrAt(i),town=townAt(i)||(trk.rc.track==='monaco');
    if(cfg.oval){if(i%5===0){add(i,'stand',-(W/2+10),0,'s',0);}if(i%7===3)add(i,'fence',W/2+2,0);if(i%9===0&&rnd()<0.6)add(i,rnd()<0.5?'elm':'oak',W/2+14+rnd()*10,0,'s',0.6);continue;}
    if(tr==='beach'){if(i%6===0)add(i,'sea',W/2+22,0);if(i%9===0)add(i,'dune',-(W/2+12+rnd()*8));if(i%11===0&&rnd()<cfg.crowd)add(i,'crowd',-(W/2+4),Math.floor(rnd()*4),'p');continue;}
    if(town){
      if(i%4===0){[-1,1].forEach(sd=>{const t=set.town[Math.floor(rnd()*set.town.length)];if(add(i,t,sd*(W/2+6.5+rnd()*1.5),Math.floor(rnd()*3),'s',3.5))trk.bar[i]=Object.assign(trk.bar[i]||{},sd>0?{L:W/2+2.5}:{R:W/2+2.5});});}
      if(i%150===34)add(i,'church',-(W/2+9),0,'s',4);
      if(i%6===2)add(i,'lamp',(i%12===2?1:-1)*(W/2+1.8),0,'s',0.25);
      if(rnd()<0.25+cfg.crowd*0.3)add(i,'crowd',(rnd()<0.5?-1:1)*(W/2+2.8),Math.floor(rnd()*4),'p');
      if(i%37===0)add(i,'gend',(rnd()<0.5?-1:1)*(W/2+2.2),0,'p');
      if(i%53===7)add(i,'cart',(rnd()<0.5?-1:1)*(W/2+3.5),0,'s',1.2);

// Историческая команда-победитель: если вы не вмешиваетесь, история чаще идёт своим чередом
function histWinnerTeam(rc,teams){if(!rc.win)return null;const w=rc.win.toLowerCase();return teams.find(t=>t.mq.some(m=>w.includes(m.toLowerCase())))||null;}
function simDriver(t,rc,hist){if(hist&&rc.win)return rc.win.split(' (')[0].split(',')[0];const d=teamDrivers(t,rc.y).sort((a,b)=>b.sk-a.sk)[0];return d?d.n:'';}
function simRace(s,rc){
  if(s.cres[rc.key])return;
  if(raceWarBlocked(rc,s)){s.cres[rc.key]={x:1};return;}
  const teams=fieldTeams(rc,s,0),hw=histWinnerTeam(rc,teams),dnf=dnfTarget(rc.y,rc.t)*0.9;
  const rows=teams.map(t=>({name:t.n,t,perf:Math.pow(t.str,1.6)*teamBoost(t,rc)*(t===hw?1.12:1)*(0.92+Math.random()*0.16),dnf:t!==hw&&Math.random()<dnf*clamp(1.4-0.4*t.str,0.6,1.3)?1:0}));
  rows.sort((a,b)=>(a.dnf-b.dnf)||(b.perf-a.perf));
  const w=rows[0];
  s.cres[rc.key]={w:w?w.name:'',d:w?simDriver(w.t,rc,w.t===hw):'',me:0,c:w?w.t.c:''};
  champRecord(s,rc,rows);
}
function seasonTick(s){
  if(!s.cres)s.cres={};if(!s.season)s.season={};
  RACES.forEach(rc=>{if((rc.y<s.y||(rc.y===s.y&&rc.m<s.m))&&rc.y>=s.y-1&&!s.cres[rc.key])simRace(s,rc);});
  [s.y-1,s.y].forEach(y=>champsOf(y).forEach(id=>champFinish(s,id,y)));
  if(s.m===0){Object.keys(s.cres).forEach(k=>{if(+k.split('-').pop()<s.y-2)delete s.cres[k];});Object.keys(s.season).forEach(k=>{if(s.season[k].y<s.y-2)delete s.season[k];});}
}

function fmtRaceTime(sec){sec=Math.max(0,sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=Math.floor(sec%60);return h?`${h} ч ${String(m).padStart(2,'0')} мин`:m?`${m} мин ${String(x).padStart(2,'0')} с`:`${(Math.round(sec*10)/10).toFixed(1).replace('.',',')} с`;}
let lastRace=null;
function raceResults(rc,res,mode,info){
  const s=G;if(!s)return;info=info||{};
  const k=rc.km*1000/Math.max(1,info.len||rc.km*1000);   // секунды модели → реальное время на полной дистанции
  const team=res.filter(r=>r.you),fin=team.filter(r=>!r.dnf),best=fin.length?Math.min(...fin.map(r=>r.pos)):0;
  const prize=racePrize(rc);let won=0;
  team.forEach(r=>{if(!r.dnf&&r.pos<=3){r.prize=Math.round(prize*[1,0.5,0.25][r.pos-1]/10)*10;won+=r.prize;}});
  s.cash+=won;
  const major=!!rc.major,rk=bn('raceRep');
  if(best===1)s.rep+=(major?9:5)*rk;else if(best&&best<=3)s.rep+=(major?3:1.5)*rk;else if(best)s.rep+=0.5;else s.rep-=major?2:1;
  s.rep=clamp(s.rep,0,100);
  const bestRow=best?team.find(r=>r.pos===best):team[0],md=bestRow&&bestRow.md&&s.models.find(m=>m.id===bestRow.md.id);
  if(best===1&&md)md.raceBoost=mi(s)+(major?9:6);
  s.raceDone[rc.key]=best||-1;
  s.raceLog.push({y:rc.y,key:rc.key,name:rc.name,model:bestRow?bestRow.label:'',place:best,drv:bestRow?bestRow.drv:'',major,team:team.map(r=>r.dnf?0:r.pos)});
  if(s.raceLog.length>300)s.raceLog.shift();
  const w=res[0];
  s.cres[rc.key]={w:w.you?s.company:w.name,d:w.drv||'',me:best||-1,c:w.you?s.country:(w.tc||'')};
  champRecord(s,rc,res.map(r=>({name:r.you?s.company:r.name,dnf:!!r.dnf})));
  // Кубок Гордона Беннетта: трофей уходит стране победителя
  let cupTitle='';
  if(GBC_IDS.includes(rc.id)){if(best===1){cupTitle=`Кубок Гордона Беннетта ${rc.y}`;s.titles.push({y:rc.y,id:'gbc',name:cupTitle,w:0.5});s.titleBoost=mi(s)+12;s.rep=clamp(s.rep+5*rk,0,100);}
    else addLog(`Кубок Гордона Беннетта ${rc.y} увозит команда страны: ${hostName(s.cres[rc.key].c||'fr')}.`,'hist');}
  raceChamps(rc).forEach(id=>champFinish(s,id,rc.y));
  const dnfN=team.filter(r=>r.dnf).length;
  addLog(`«${rc.name}»: ${best?`лучший результат — ${best}-е место (${bestRow.drv||'пилот'}, «${bestRow.label}»)`:'все машины сошли'}${won?`, призовые ${money(won)}`:''}${dnfN&&best?`, сходов: ${dnfN}`:''}.`,best===1?'good':best?'':'bad');
  lastRace={rc,res,k,won,best,mode,cup:cupTitle};

}
function racePaper(rc,res,row,k,cup){

function raceStatus(rc,s){
  const r=s.cres&&s.cres[rc.key],mine=s.raceDone[rc.key];
  if(mine>0)return [`${mine}-е место`,mine===1?'good':mine<=3?'warn':'muted',false];
  if(mine===-1)return ['Сход','bad',false];
  if(r&&r.x)return ['Отменена: война','bad',false];
  if(r)return ['Прошла без вас','muted',false];
  if(raceWarBlocked(rc,s))return ['Отменена: война','bad',false];
  if(!raceEligible(rc,s))return [`Нужны дилеры: ${COUNTRIES[rc.c].name}`,'muted',false];

Object.assign(RACE_ACT,{

const SPR={cache:{}};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c;}
function shade(hex,amt){const n=parseInt((hex||'#333333').slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return `rgb(${r},${g},${b})`;}
function mix(a,b,k){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const f=(x,y)=>Math.round(x+(y-x)*k);return `rgb(${f(A>>16,B>>16)},${f(A>>8&255,B>>8&255)},${f(A&255,B&255)})`;}
function vgrad(c,y0,y1,stops){const g=c.createLinearGradient(0,y0,0,y1);stops.forEach(([k,col])=>g.addColorStop(k,col));return g;}
function hgrad(c,x0,x1,stops){const g=c.createLinearGradient(x0,0,x1,0);stops.forEach(([k,col])=>g.addColorStop(k,col));return g;}
function ell(c,x,y,rx,ry,fill){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,7);c.fillStyle=fill;c.fill();}
function rrect(c,x,y,w,h,r,fill){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();c.fillStyle=fill;c.fill();}
function poly(c,pts,fill){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();c.fillStyle=fill;c.fill();}

function carStyle(md,prep,y){
  const p=parts(md),b=p.b.id;
  if(p.b.truck)return b==='b6'?'van':'truck';
  if(prep===2)return y<1901?'carriage':y<1907?'gp1901':y<1912?'gp1907':y<1925?'gp1912':'gp1925';
  if(y<1901)return 'carriage';
  if(prep===1)return y<1912?'gp1901':'sport';
  return b==='b1'?(y<1912?'runabout':'sport'):b==='b2'?'tonneau':b==='b3'?'tourer':'sedan';
}
function crewKit(y){return y<1906?{coat:'#6b5a44',cap:'cap',hat:'#3a3026'}:y<1915?{coat:'#7a6a55',cap:'helmet',hat:'#5a3f28'}:y<1922?{coat:'#8a8272',cap:'helmet',hat:'#4d3524'}:{coat:'#d8d4c8',cap:'helmet',hat:'#5b4030'};}
// ---------- спрайт машины сзади: frame −2..2 — поворот, phase — развевающийся шарф ----------
function carSprite(spec,frame,phase){
  const key='car|'+spec.key+'|'+frame+'|'+phase;if(SPR.cache[key])return SPR.cache[key];
  const PPM=110,W=2.6*PPM,H=2.3*PPM,cv=mkCanvas(W,H),c=cv.getContext('2d');
  c.translate(W/2,H-0.12*PPM);c.scale(PPM,PPM); // метры, y вверх = отрицательный
  drawCarRear(c,spec,frame,phase);
  const o={img:cv,wM:2.6,hM:2.3,ax:0.5,ay:(H-0.12*PPM)/H};SPR.cache[key]=o;return o;
}

      if(S.wheel==='wire'){c.strokeStyle='#dfe3e8';c.lineWidth=0.012;for(let k=0;k<18;k++){const a=k/18*6.283;c.beginPath();c.moveTo(0,0);c.lineTo(Math.cos(a)*r*0.74,Math.sin(a)*r*0.74);c.stroke();}}

  let crew=[],crewY=0,crewK=0.84,hideTop=null;

    rrect(c,-w/2,-wr*2.3,w,wr*1.4,0.06,bodyG(-wr*2.3,-wr*0.9));c.strokeStyle=shade(B,0.55);c.lineWidth=0.014;c.strokeRect(-w/2+0.07,-wr*2.2,w-0.14,wr*1.2);
    rrect(c,-w/2+0.03,-wr*3.05,w-0.06,wr*0.8,0.1,vgrad(c,-wr*3.05,-wr*2.25,[[0,'#6e4d32'],[1,'#3b2718']]));
    crew=[[-0.25,0],[0.25,1]];crewY=-wr*2.85;}

  if(k>=0)AU.idx=k;else{AU.idx=0;if(!start&&cur&&!cur.synth&&AU.el&&!AU.el.paused){AU.pl.splice(0,0,cur);}else musicPlay(true);}
  musUI();
}
function musCur(){return AU.pl[AU.idx]||null;}
function musicPlay(force){
  const tr=musCur(),want=AU.on.music&&!AU.paused&&(!R||AU.on.race)&&tr;
  if(!want){if(AU.el&&!AU.el.paused)AU.el.pause();AU.synth=null;AU.real=false;musUI();return;}
  if(tr.synth){if(AU.el&&!AU.el.paused)AU.el.pause();AU.real=false;if(force||!AU.synth||AU.synth.title!==tr.title){AU.synth=tr;AU.step=0;}AU.nowPlaying=null;musUI();return;}
  AU.synth=null;AU.real=true;
  if(!AU.el){AU.el=new Audio();AU.el.preload='auto';AU.el.addEventListener('ended',()=>musNext(1));
    AU.el.addEventListener('playing',()=>{AU.errs=0;});
    AU.el.addEventListener('error',()=>{if(!AU.el.getAttribute('src'))return;AU.errs++;if(AU.errs<Math.min(6,AU.pl.length))musNext(1);else{AU.pl=AU.pl.filter(t=>t.synth).concat(musSynth());AU.idx=0;AU.errs=0;musicPlay(true);}});}
  AU.el.volume=R?0.2:0.5;
  if(force||AU.el.getAttribute('src')!==tr.src){AU.el.src=tr.src;AU.nowPlaying=tr;}
  if(AU.el.paused){const pr=AU.el.play();if(pr&&pr.catch)pr.catch(()=>{});}

function musNext(d){if(!AU.pl.length)musBuild(true);const n=AU.pl.length;if(!n)return;AU.idx=((AU.idx+d)%n+n)%n;AU.paused=false;if(!AU.on.music){AU.on.music=true;auApply();}musicPlay(true);}
function musToggle(){if(!AU.on.music){AU.on.music=true;AU.paused=false;auApply();return;}AU.paused=!AU.paused;musicPlay();}
function musMode(){AU.on.mode=AU.on.mode==='all'?'era':'all';try{localStorage.setItem('avt-audio',JSON.stringify(AU.on));}catch(e){}AU.sig='';musBuild(true);toast(AU.on.mode==='all'?'Вся фонотека 1895–1929':'Музыка текущей эпохи');}
function musUI(){const tr=musCur(),on=AU.on.music&&!AU.paused;
  const txt=tr?(tr.synth?tr.title:tr.title.replace(/\s*\(.*?\)/g,' ').replace(/\s+/g,' ').trim().slice(0,60)+(tr.y?' · '+tr.y:'')):'Фонотека загружается…';
  document.querySelectorAll('.plTitle').forEach(e=>{e.textContent=txt;});
  document.querySelectorAll('.plPlay').forEach(e=>{e.textContent=on?'❚❚':'▶';});
  document.querySelectorAll('.plMode').forEach(e=>{e.textContent=AU.on.mode==='all'?'Все':'Эпоха';});
  const sb=document.getElementById('sndBtn');if(sb)sb.style.opacity=AU.on.music?1:0.4;}
function styleFor(){const y=G?G.y:1895;return y<1912?'rag':y<1920?'march':'jazz';}
function auSched(){
  const c=AU.ctx;if(!c)return;
  while(AU.next<c.currentTime+0.15){
    const SY=AU.synth,st=SY?(SY.st==='song'||SY.st==='waltz'?'rag':SY.st):styleFor();if(AU.lastY!==(G&&G.y)){AU.lastY=G&&G.y;if(AU.pl.length)musBuild(false);}
    const S=STY[st],vv=SY?SY.v:0,beat=60/(S.bpm*[1,0.93,1.07][vv]),sub=beat/S.div,stepsBar=S.div*(st==='rag'?2:4);
    const bar=Math.floor(AU.step/stepsBar),pos=AU.step%stepsBar,ch=S.prog[bar%S.prog.length],root=S.key+[0,-3,2][vv]+ch[0],tones=CH[ch[1]];
    let dur=sub;if(S.swing){dur=pos%2===0?beat*S.swing:beat*(1-S.swing);}
    const t=AU.next;
    if(SY&&AU.on.music&&!AU.paused&&(!R||AU.on.race)){
      const rnd=mulberry32(hashStr(st+vv+'-'+(bar%S.prog.length)+'-'+pos+'-'+Math.floor(bar/S.prog.length)%2));
      if(st==='rag'){
        if(pos===0||pos===4)vBass(root-24+(pos===4?7:0),t,beat*0.9,0.28);
        if(pos===2||pos===6)tones.forEach(i=>vPiano(root-12+i,t,beat*0.35,0.07));
        const pat=[1,0,1,1,0,1,0,1];if(pat[pos]&&rnd()<0.9){const deg=tones[Math.floor(rnd()*tones.length)]+(rnd()<0.3?2:0);vPiano(root+12+deg,t,sub*1.3,0.11);}
      }else if(st==='march'){
        if(pos===0||pos===4)vBass(root-24+(pos===4?7:0),t,beat,0.3);
        if(pos===2||pos===6)tones.forEach(i=>vPiano(root-12+i,t,beat*0.4,0.06));
        if(pos===6||pos===7)vNoise(t,0.08,0.05,'bandpass',1800);
        if(pos%2===0||rnd()<0.3){const deg=tones[Math.floor(rnd()*tones.length)];vPiano(root+12+deg,t,sub*(pos%2?1:1.8),0.1);}
      }else{
        if(pos%2===0){const walk=[0,tones[1],tones[2],tones[tones.length-1]][pos/2];vBass(root-24+walk,t,beat*0.9,0.3);}
        if(pos===2||pos===6)tones.slice(1).concat([14]).forEach(i=>vPiano(root-12+i,t,beat*0.3,0.05));
        vNoise(t,pos%2?0.05:0.12,pos%2?0.02:0.04,'highpass',7000);
        if(pos===0)vKick(t,0.1);
        if(rnd()<(pos%2?0.45:0.6)){const bl=[0,3,5,6,7,10][Math.floor(rnd()*6)];vPiano(root+12+bl,t,dur*1.5,0.09);}
      }
    }

  }
}
function auSfx(type,v){
  if(!AU.ctx||!AU.on.sfx||(R&&(R.mode==='sim'||R.ff)))return;const t=AU.ctx.currentTime;
  if(type==='crash'){vNoise(t,0.35,0.5*v,'lowpass',700,AU.fx);const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(35,t+0.2);o.connect(g);g.connect(AU.fx);env(g,t,0.005,0.6*v,0.3);o.start(t);o.stop(t+0.4);}
  if(type==='bump')vNoise(t,0.15,0.3*v,'lowpass',500,AU.fx);
  if(type==='cheer'){const s=AU.ctx.createBufferSource(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();s.buffer=AU.noise;s.loop=true;f.type='bandpass';f.frequency.value=1100;f.Q.value=0.6;s.connect(f);f.connect(g);g.connect(AU.fx);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.8);g.gain.exponentialRampToValueAtTime(0.0001,t+3.5);s.start(t);s.stop(t+3.6);}
  if(type==='paper')vNoise(t,0.25,0.12,'highpass',3000,AU.fx);
}
function auRaceStart(rc){
  if(!AU.ctx)return;auApply();
  if(!AU.on.sfx)return;const c=AU.ctx,t=c.currentTime;
  const o1=c.createOscillator(),o2=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),f=c.createBiquadFilter(),g=c.createGain(),am=c.createGain();
  o1.type='sawtooth';o2.type='square';lfo.type='square';f.type='lowpass';f.frequency.value=500;g.gain.value=0;am.gain.value=1;
  o1.connect(f);o2.connect(f);f.connect(am);am.connect(g);g.connect(AU.fx);lfo.connect(lg);lg.connect(am.gain);lg.gain.value=rc.y<1906?0.5:0.15;
  const sc=c.createBufferSource(),sf=c.createBiquadFilter(),sg=c.createGain();sc.buffer=AU.noise;sc.loop=true;sf.type='bandpass';sf.frequency.value=2400;sf.Q.value=4;sg.gain.value=0;sc.connect(sf);sf.connect(sg);sg.connect(AU.fx);

function auRaceTick(){
  const a=AU.race;if(!a||!R||!(R.me||R.follow))return;const t=AU.ctx.currentTime,me=R.me||R.follow,vol=R.me?1:0.6,p=clamp(me.rpm||0,0,1.1),thr=me.thr||0;auScreech(Math.min(1,Math.max(0,(me.slipR||0)-0.1)*4+(me.spinw>0.3?0.3:0)));
  const base=(a.early?30:42)+p*(a.early?80:150)+(me.overheat>0?-15:0);
  a.o1.frequency.setTargetAtTime(base,t,0.05);a.o2.frequency.setTargetAtTime(base*0.5,t,0.05);a.lfo.frequency.setTargetAtTime(base/(a.early?2:4),t,0.05);
  a.f.frequency.setTargetAtTime(350+p*1200+thr*500,t,0.08);a.g.gain.setTargetAtTime((R.t<0?0.05:(0.05+p*0.08+thr*0.07)*(me.overheat>0?0.4:1)*(me.dnf?0.2:1))*vol,t,0.08);

function auScreech(v){const a=AU.race;if(a)a.sg.gain.setTargetAtTime(v*0.22,AU.ctx.currentTime,0.05);}

/* ================= ACTIONS ================= */
function stopAuto(){if(auto){clearInterval(auto);auto=null;const ab=document.getElementById('autoBtn');if(ab){ab.textContent='▶';ab.classList.remove('on');}}}
function doStep(){if(step()){save();render();afterStep();return true;}return false;}

const ACT={
  tab:d=>{tab=d.t;render();window.scrollTo(0,0);},
  next:()=>doStep(),
  quarter:()=>{let ok=false;for(let i=0;i<3;i++){if(!step())break;ok=true;if(G.pending.length)break;}if(ok){save();render();afterStep();}},
  auto:()=>{if(auto){stopAuto();render();return;}auto=setInterval(()=>{if(!doStep()||G.pending.length)stopAuto();},1300);render();},
  // завод
  capAdd:d=>{const n=+d.n,c=n*capUnitCost(G);if(G.cash<c)return;G.cash-=c;G.plantVal+=c;G.capBuild.push({units:n,left:2});addLog(`Заложен новый цех: +${fmtN(n)} мест, ${money(c)}.`);rerender();},
  capSell:()=>{if(G.cap<=3)return;const n=Math.max(1,Math.round(G.cap*0.2)),v=Math.round(G.plantVal*n/G.cap*0.4);G.cap-=n;G.plantVal-=G.plantVal*n/(G.cap+n);G.cash+=v;addLog(`Часть цехов продана за ${money(v)}.`);rerender();},
  shifts:d=>{G.shifts=+d.v;rerender();},
  staffAuto:d=>{G.staffAuto=d.v==='1';rerender();},
  workers:d=>{const k=Math.max(1,Math.round(G.workers*0.1));G.workers=Math.max(3,G.workers+k*(+d.d));if(+d.d>0){G.cash-=k*8*cpi(G);}rerender();},
  wagePol:d=>{const w=WAGE_POL[d.v];if(w.y&&G.y<w.y-techEarly(G))return;const was=G.wagePol;G.wagePol=d.v;
    if(d.v==='five'&&was!=='five'){addLog('Объявлена зарплата «пять долларов в день» — вдвое выше рынка. У ворот завода очередь из желающих.','good');if(G.y<1914)recordFirst(G,'wage:five','Зарплата «пять долларов в день»',1914,'Ford');G.rep=clamp(G.rep+4,0,100);flushToasts();}rerender();},
  tech:d=>{const k=d.k,c=techCost(G,k);if(!techOpen(G,k)||G.techBuild||G.cash<c)return;G.cash-=c;G.plantVal+=c*0.7;G.techBuild={k,left:3};addLog(`Начато внедрение: ${techNext(G,k).name} (${money(c)}).`);rerender();},

  // модели
  price:d=>{const md=G.models.find(m=>m.id===+d.id),st=Math.max(5,Math.round(md.price*0.05/5)*5);md.price=Math.max(20,md.price+st*(+d.d));rerender();},
  planManual:d=>{const md=G.models.find(m=>m.id===+d.id);md.plan=Math.max(0,Math.round(md.fc||md.lastMade||1));rerender();},
  planAuto:d=>{const md=G.models.find(m=>m.id===+d.id);md.plan='auto';rerender();},
  plan:d=>{const md=G.models.find(m=>m.id===+d.id);md.plan=Math.max(0,(+md.plan||0)+(+d.d));rerender();},
  retire:d=>{const md=G.models.find(m=>m.id===+d.id),rev=Math.round(md.stock*md.price*0.6);G.cash+=rev;addLog(`«${md.name}» снята с производства${md.stock?`, остаток ${fmtN(md.stock)} шт. распродан за ${money(rev)}`:''}.`);md.stock=0;md.backlog=0;md.status='off';rerender();},
  revive:d=>{const md=G.models.find(m=>m.id===+d.id);md.status='prod';md.launched=mi(G);addLog(`«${md.name}» снова в производстве.`);rerender();},
  design:()=>openDesigner(),
  pick:d=>{draft[d.k]=d.v;const top=sb.scrollTop;renderDesigner();sb.scrollTop=top;},
  startdev:()=>{const md={...draft},dc=devCost(md,G);if(G.cash<dc)return;G.cash-=dc;const nm=(draft.name||'').trim()||('Тип '+G.nextId);
    const m={id:G.nextId++,name:nm,e:md.e,c:md.c,b:md.b,t:md.t,w:md.w,paint:md.paint,price:0,plan:'auto',status:'dev',devLeft:devMonths(md),launched:0,stock:0,backlog:0,lastDem:0,lastSold:0,lastMade:0,totalSold:0,made:0,fc:0};

  rdPick:()=>openRD(),
  rdStart:d=>{const [kind,id]=d.k.split(':');const pj=rdProjects(G).find(x=>x.kind===kind&&x.id===id);if(pj){G.rd.proj=pj;G.rd.prog=0;addLog(`КБ начало проект: ${pj.name}.`);}closeSheet();save();render();},
