plugins { id 'com.android.application' }
android {
    namespace 'ru.avtoimperia.game'
    compileSdk 34
    defaultConfig {
        applicationId "ru.avtoimperia.game"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? (100 + System.getenv("GITHUB_RUN_NUMBER").toInteger()) : 5)
        versionName "0.11.1"
    }
    signingConfigs {
        // Постоянный ключ: новые версии ставятся поверх старых без удаления.
        // Для публикации в магазинах замените его на секретный ключ.
        release {
            storeFile file("avtoimperia.keystore")
            storePassword "avtoimperia"
            keyAlias "avtoimperia"
            keyPassword "avtoimperia"
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
