<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<script src="img/manifest.js"></script>
<script src="music/music.js"></script>
</head><body>
<title>Автоимперия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@900&family=UnifrakturMaguntia&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0d2136; --panel:#122d4a; --panel2:#0f2740; --line:#2a5178; --line-soft:#1d3d5e;
  --text:#e6eef7; --muted:#8ea8c3; --brass:#d9ab52; --brass-ink:#1c1406;
  --good:#74d39a; --bad:#ff8474; --warn:#f0c75e;
  --paper:#ece2c8; --ink:#221c14;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Old Standard TT",Georgia,"Times New Roman",serif;
}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;background-color:var(--bg);
  background-image:linear-gradient(rgba(142,168,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(142,168,195,.06) 1px,transparent 1px);
  background-size:24px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 226px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 82%,rgba(13,33,54,0));margin-inline:-16px;padding:12px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.co{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.date{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;display:inline-block}
.date span{color:var(--brass)}
.date.flip{animation:flip .45s ease-out}
@keyframes flip{0%{transform:perspective(300px) rotateX(-80deg);opacity:.2}100%{transform:none;opacity:1}}
.cash{text-align:right}
.cash b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.cash b.neg{color:var(--bad)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;color:var(--muted);cursor:pointer;flex:none;padding:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:10px}
.hr{height:1px;background:var(--line-soft);margin-block:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel2);padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:600}
p{margin:0}
.small{font-size:13px}
.btn{background:transparent;border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:5px 9px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.step button{background:var(--panel2);border:0;width:38px;height:36px;font-size:18px;cursor:pointer}
.step span{min-width:84px;text-align:center;font-family:var(--mono);font-size:15px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.bar{height:8px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line-soft)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .5s ease}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.meta div{font-size:12px;color:var(--muted)}
.meta b{display:block;font-family:var(--mono);font-weight:500;font-size:15px;color:var(--text)}
.spec{font-size:13px;color:var(--muted);margin-top:4px}
.spark{width:100%;height:64px;display:block;margin-top:8px}
.spark .zero{stroke:var(--bad);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke}
.empty-chart{font-size:13px;color:var(--muted);padding:18px 0;text-align:center;border:1px dashed var(--line-soft);border-radius:4px;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=text]{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px;font:inherit;color:var(--text)}
.scene{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a1a2b}
.scene svg{display:block;width:100%;height:auto}
.carbox{background:linear-gradient(180deg,rgba(142,168,195,.05),rgba(142,168,195,.12));border:1px solid var(--line-soft);border-radius:5px;margin-top:10px;overflow:hidden}
.carbox svg{display:block;width:100%;height:auto;max-height:130px}
.car .spin{animation:spin .7s linear infinite;animation-play-state:paused}
.car.anim .spin{animation-play-state:running}
.car.anim .body{animation:bob .35s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-.8px)}}
.carbox.enter svg{animation:enter .7s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{transform:translateX(-60%)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 3.2s linear infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.75}100%{transform:translate(14px,-30px) scale(2);opacity:0}}
.roadcar{animation:drive 9s linear infinite}
.cloud{animation:cloud 42s linear infinite}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(380px)}}
@keyframes drive{from{transform:translateX(-50px)}to{transform:translateX(420px)}}
.roadcar .w{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,26,43,.97);border-top:1px solid var(--line);padding:8px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.bar-nav .in{max-width:560px;margin:0 auto}
.next{display:flex;align-items:stretch;gap:8px}
.next .btn.primary{flex:1;padding:13px;font-size:16px}
.next .btn.q{padding:0 12px;min-width:46px}
.next .btn.q.on{border-color:var(--brass);color:var(--brass)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px}
.tab{background:none;border:0;padding:6px 0;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab.on{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(176px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--panel);border:1px solid var(--brass);border-radius:99px;padding:8px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,12,22,.75);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:13px;cursor:pointer;text-align:left}
.chip small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--brass);background:rgba(217,171,82,.14)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brass)}
.country{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.country .chip{padding:10px}
.pion{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer}
.pion.on{border-color:var(--brass);background:rgba(217,171,82,.12)}
.pion svg{width:64px;height:80px;display:block}
.pion h3{font-size:16px}
.pion .yrs{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pion p{font-size:13px;color:var(--muted);margin-top:4px}
.bon{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bon span{font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--line-soft)}
.bon .p{color:var(--good);border-color:rgba(116,211,154,.4)} .bon .m{color:var(--bad);border-color:rgba(255,132,116,.4)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.log li time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.log li.good p{color:var(--good)} .log li.bad p{color:var(--bad)} .log li.hist p{color:var(--brass)}
.tech{display:grid;grid-template-columns:48px 1fr auto;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.tech.off{color:var(--muted);opacity:.6}
.tech .num{color:var(--muted)}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
table.pl td{padding:4px 0}
table.pl td:last-child,table.pl th:last-child{text-align:right}
table.pl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.pl th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding-bottom:6px}
table.pl th.n{text-align:right}
table.pl tr.tot td{border-top:1px solid var(--line-soft);padding-top:8px;font-weight:600}
.comp{display:grid;grid-template-columns:44px minmax(0,1fr) 64px 64px;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.comp .dot{width:12px;height:12px;border-radius:50%;margin-left:16px}
.comp small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.comp.you{color:var(--brass);font-weight:600}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ach div{border:1px solid var(--line-soft);border-radius:5px;padding:8px 10px;font-size:12px;color:var(--muted)}
.ach div b{display:block;font-size:13px;color:var(--muted)}
.ach div.got{border-color:var(--brass)}
.ach div.got b{color:var(--brass)}
.race-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.race-item:last-child{border-bottom:0}
.race-item .mo{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist{font-family:var(--serif);font-size:15px;line-height:1.5;color:#d9d2c0;border-left:2px solid var(--brass);padding-left:12px;margin-top:10px}

/* photos */
.ph-oval{width:64px;height:80px;border-radius:50%;overflow:hidden;border:3px solid var(--brass);box-sizing:border-box;background:#5a5048}
.ph-oval img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) contrast(1.05)}
.thumb{width:44px;height:32px;border-radius:3px;object-fit:cover;display:block;filter:sepia(.25)}
.photo{position:relative;margin-top:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line-soft)}
.photo img{display:block;width:100%;max-height:220px;object-fit:cover;filter:sepia(.3) contrast(1.05)}
.credit{display:block;font-size:10px;font-family:var(--mono);color:var(--muted);text-decoration:none;padding:3px 6px}
.photo .credit{position:absolute;right:0;bottom:0;background:rgba(0,0,0,.55);color:#ddd}
.p-fig img{display:block;width:100%;max-height:260px;object-fit:cover;filter:grayscale(1) sepia(.4) contrast(1.25)}
.p-fig .credit{color:var(--ink);text-align:right;background:transparent}
/* newspaper */
.paperwrap{position:fixed;inset:0;z-index:15;background:rgba(3,8,14,.82);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto}
.paper{background:var(--paper);color:var(--ink);width:100%;max-width:520px;max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 18px 16px;font-family:var(--serif);box-shadow:0 20px 60px rgba(0,0,0,.6);
  background-image:radial-gradient(rgba(120,90,40,.08) 1px,transparent 1.2px),radial-gradient(rgba(60,40,10,.06) 1px,transparent 1.4px),linear-gradient(90deg,rgba(0,0,0,.05),transparent 8%,transparent 92%,rgba(0,0,0,.06));
  background-size:7px 7px,11px 11px,100% 100%}
.paper.spin{animation:paperIn .9s cubic-bezier(.2,.7,.2,1)}
@keyframes paperIn{0%{transform:rotate(-540deg) scale(.05);opacity:0}70%{opacity:1}100%{transform:none}}
.p-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:4px}
.p-mast{font-family:"Playfair Display",var(--serif);font-weight:900;font-size:clamp(28px,8vw,44px);text-align:center;line-height:1.05;margin:8px 0 6px;letter-spacing:.01em}
.p-mast.frak{font-family:"UnifrakturMaguntia",var(--serif);font-weight:400}
.p-rule{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);height:3px;margin-bottom:8px}
.p-kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-weight:700}
.p-head{font-family:"Playfair Display",var(--serif);font-weight:900;font-size:clamp(24px,6.5vw,34px);line-height:1.08;text-align:center;margin:6px 0;text-wrap:balance}
.p-deck{font-style:italic;text-align:center;font-size:15px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.p-fig{margin:10px 0 4px;border:1px solid var(--ink);background:#e4d8b8}
.p-fig svg{display:block;width:100%;height:auto;filter:grayscale(1) sepia(.35) contrast(1.35)}
.p-cap{font-size:11px;font-style:italic;text-align:center;margin-bottom:8px}
.p-cols{columns:2 190px;column-gap:16px;column-rule:1px solid rgba(34,28,20,.4);font-size:14.5px;line-height:1.45;text-align:justify;hyphens:auto}
.p-cols p{margin:0 0 8px}
.p-cols p.lead::first-letter{float:left;font-family:"Playfair Display",var(--serif);font-weight:900;font-size:44px;line-height:.85;padding:4px 6px 0 0}
.p-side{border-top:1px solid var(--ink);margin-top:8px;padding-top:6px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-side b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.p-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.p-btn{font-family:var(--sans);background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.p-btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}

/* race screen */
#raceScreen{position:fixed;inset:0;z-index:20;background:#070f18;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
#raceScreen[hidden]{display:none!important}
.player{display:flex;align-items:center;gap:4px;margin-bottom:6px;min-width:0;font-size:12px;color:var(--muted)}
.plb{flex:none;background:transparent;border:1px solid var(--line,#2a3a4a);color:var(--brass);border-radius:8px;height:28px;min-width:32px;padding:0 7px;font-size:12px;font-family:inherit}
.plTitle{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px;font-style:italic}
.r-hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.r-hud b{display:block;color:var(--text);font-size:16px;font-weight:500}
.r-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.r-bars .bar{margin-top:3px;height:6px}
#rcv{flex:1;width:100%;min-height:0;display:block;touch-action:none;background:#8fb8da}
#rMap{position:absolute;right:8px;top:8px;width:96px;height:96px;pointer-events:none;opacity:.9}
#rReset{position:absolute;left:50%;bottom:14px;transform:translateX(-50%)}
#rTilt.on{border-color:var(--brass);color:var(--brass)}
.r-msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-weight:800;font-size:46px;color:var(--brass);text-shadow:0 3px 12px rgba(0,0,0,.7);pointer-events:none}
.r-ctrl{display:grid;grid-template-columns:1fr 1fr 0.9fr 1.1fr;gap:8px;padding:10px 12px;touch-action:none;user-select:none;-webkit-user-select:none}
.r-wheel{height:84px;border-radius:12px;border:2px solid var(--line);background:rgba(142,168,195,.06);touch-action:none;position:relative;overflow:hidden;cursor:grab}
.r-wheel canvas{width:100%;height:100%;display:block;touch-action:none}
.r-ctrl .lft,.r-ctrl .rgt{font-size:40px}
.r-ctrl button{height:96px;border-radius:12px;border:2px solid var(--line);background:rgba(142,168,195,.08);font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);touch-action:none;cursor:pointer}
.r-ctrl button.down{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.r-ctrl .gas{border-color:var(--brass);color:var(--brass)}
.r-ctrl .brk{border-color:#8a4a44;color:var(--bad)}
.r-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}
.r-top .label{color:var(--brass);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.r-top .btns{flex-wrap:nowrap;flex:none}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
.r-hud b{font-size:15px}
@media (prefers-reduced-motion:reduce){.cloud,.car .spin,.smoke,.roadcar,.roadcar .w,.car.anim .body,.date.flip,.carbox.enter svg,.paper.spin{animation:none!important}}
@media (max-width:380px){.meta{grid-template-columns:repeat(2,1fr)}.date{font-size:28px}.r-ctrl button,.r-wheel{height:72px}}
/* v0.8: главное меню, технологии, дилеры, наследие */
#menuScreen{position:fixed;inset:0;z-index:9;overflow:auto;background:radial-gradient(120% 80% at 50% 0%,#1d3a5c 0%,var(--bg) 60%);padding:env(safe-area-inset-top,0px) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.menu-in{max-width:520px;margin:0 auto;padding-top:14px}
.menu-art{width:100%;height:auto;display:block;border-radius:10px;border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.45)}

// Группы семей: доля семей «богаче» на границах групп
const QB=[1,0.5,0.3,0.15,0.08,0.05,0.03,0.015,0.007,0.003,0.001,0];

function households(c,s){return tabAt(HH[c],yf(s))*1e6;}
function affordK(c,s){return tabAt(AFFORD[c==='us'?'us':'eu'],yf(s));}
// Доходы: логнормальное «тело» и хвост Парето у богатейших 5%
function incomeOf(c,s){const t=yf(s),mean=tabAt(INC[c],t),al=tabAt(PARETO[c],t),sg=INC_SIG;

// Сколько семей может купить машину за P

// Свои особенности стран: налоги на роскошь и пошлины в Германии, дороги в Америке до 1906 года
const APPEAL_C={us:0,fr:-0.2,uk:-0.6,de:-1.5,it:0};
function appeal(c,s){const t=yf(s);return tabAt(APPEAL,t)+APPEAL_C[c]+(c==='us'?-1.5*clamp((1906-t)/6,0,1):0);}
function fleetHist(c,t){const tb=CALIB.fleet&&CALIB.fleet[c];return tb&&Object.keys(tb).length?tabAt(tb,t):FLEET0[c];}
function fleetOf(s,c){return s.fleet&&s.fleet[c]!=null?s.fleet[c]:fleetHist(c,yf(s));}
/* ---------- экономика стран ---------- */
function isWar(y,m,c){

  if(c==='it')return (y===1915&&m>=4)||(y>=1916&&y<=1917)||(y===1918&&m<=10);
  return (y===1914&&m>=7)||(y>=1915&&y<=1917)||(y===1918&&m<=10);

// f — сколько покупателей осталось на рынке: в войну машины реквизируют, бензин по карточкам
function econ(y,m,c){
  let f=1,label='Стабильно',tone='good';const war=isWar(y,m,c);
  if(c==='uk'&&(y<1896||(y===1896&&m<10))){f=0.35;label='Закон о красном флаге';tone='warn';}
  if(war){f=c==='us'?(y===1917?0.85:0.6):y===1914?0.45:0.3;label='Война';tone='bad';}
  if(y===1919||y===1920){label='Послевоенный бум';tone='good';}
  if(y===1921){f=0.85;label='Спад';tone='warn';}
  if(c==='de'&&(y===1922||y===1923)){f=y===1923?0.5:0.85;label='Гиперинфляция';tone='bad';}
  if(y>=1924&&y<=1928){label='Ревущие двадцатые';tone='good';}
  if(y===1929&&m>=9){f=0.55;label='Биржевой крах';tone='bad';}

}
const SEASON=[0.72,0.76,0.95,1.15,1.25,1.2,1.1,1.02,0.97,0.95,0.8,0.92];
function taxRate(y){return y<1914?0.08:y<=1919?0.25:0.15;}
// История продаж — только для подбора силы конкурентов
function segAnnual(c,g,s){const t=yf(s);if(g==='truck')return tabAt(MKT_TRUCK[c],t,true);const sh=tabAt(c==='us'?SEGSH.us:SEGSH.eu,t);return tabAt(MKT[c],t,true)*sh[{people:0,middle:1,lux:2}[g]];}
function prefP(g,c,s){return tabAt(PREF[g],yf(s))*PREF_C[c][g];}
// Типичная цена машины такого класса и качества — ориентир для игрока
const ALPHA_P={people:5,middle:3.5,lux:1.8,truck:4},ALPHA_Q={people:2.5,middle:2.5,lux:3.5,truck:1.8};

/* ---------- конкуренты ---------- */
function compVol(cp,s){const t=yf(s);if(t<cp.since||(cp.until&&t>=cp.until))return 0;return tabAt(cp.v,t,true);}
function compAlive(cp,s){return compVol(cp,s)>0;}
function compModel(cp,s){let m=null;(cp.models||[]).forEach(x=>{if(x[0]<=s.y)m=x;});return m;}
function compName(cp,s){if(cp.n==='Daimler'&&s.y>=1926)return 'Mercedes-Benz';if(cp.n==='Maxwell / Chrysler')return s.y>=1925?'Chrysler':'Maxwell';if(cp.n==='Nash'&&s.y<1917)return 'Rambler (Jeffery)';return cp.n;}
function compsOf(c,s){return (COMPS[c]||[]).filter(cp=>cp.pk!==s.pioneer);}
// Доля исторической марки игрока-первопроходца в классе: её место на рынке свободно
function ghostShare(c,g,s){const cp=(COMPS[c]||[]).find(x=>x.pk===s.pioneer);if(!cp||!(cp.mix&&cp.mix[g]))return 0;const S=segAnnual(c,g,s);return S>0?Math.min(0.97,compVol(cp,s)*cp.mix[g]/S):0;}
// Сила конкурентов класса: подобрана по истории (CALIB), плюс сложность игры
function kappa(c,g,s){const tb=CALIB.k&&CALIB.k[c]&&CALIB.k[c][g];let k=tb&&Object.keys(tb).length?tabAt(tb,yf(s)):-6;
  k+=Math.log(DIF().comp||1);const gs=ghostShare(c,g,s);if(gs>0)k+=Math.log(Math.max(0.03,1-gs));return k;}
function pwOf(s,c,g){return (s.pw&&s.pw[c]&&s.pw[c][g])||1;}
// Ответ конкурентов на ваш успех: новые модели, дилеры и реклама делают их машины привлекательнее
function rivalBoost(s,c,g){return (s.rv&&s.rv[c]&&s.rv[c][g])||0;}

function brandsN(c,g,s){const S=segAnnual(c,g,s)*(1-ghostShare(c,g,s));if(S<=0)return 1;let sq=0,sum=0;

// Ваша марка — одна из марок своего рынка: те же условия эпохи (дороги, надёжность, мода — поправка класса κ),
// а исходная доля — как у средней новой марки или как у исторической марки основателя, если она была больше.
// Всё остальное решают цена, качество, дилеры, реклама, репутация и гонки.
// Сколько покупателей найдёт новая марка фургонов, пока грузовиков почти нет (в США до 1906 года мешают дороги)
const TRUCK_FLOOR={us:-5.8,fr:-3.6,de:-3.2,uk:-3.5,it:-4.4};

  let b=g==='truck'&&k<-10?-99:k+Math.log(Math.max(ghostShare(c,g,s),1/(brandsN(c,g,s)+1)));
  if(g==='truck')b=Math.max(b,TRUCK_FLOOR[c]); // смелые фирмы найдутся всегда: лавки, пивоварни, почта

// Продажи конкурентов по маркам: доля марки в классе — как в истории
function compSplit(c,g,s,sales){const S=segAnnual(c,g,s),out=[];if(S<=0||sales<=0)return out;let sum=0;

/* ---------- игрок: дилеры, реклама, репутация ---------- */
// Какую часть покупателей страны видят ваши машины: первые дилеры открываются в больших городах
function reachOf(s,c){const d=dealerCount(s,c);return d?Math.pow(Math.min(1,d/dealerNeed(c,s)),0.7):0;}
function adRef(s,c){c=c||s.country;const y=(s.mkY&&s.mkY[c])||1000;return 100*cpi(s)*Math.pow(1+y/1000,0.75);}
function adEffect(s,c){const a=(s.ad||0)*(c===s.country?1:0.35)*bn('adEff');return 0.55*(1-Math.exp(-a/adRef(s,c)));}
function novelty(md,s){const age=(mi(s)-md.launched)/12;let u=age<1?0.15:0;u-=Math.min(0.3,0.03*Math.max(0,age-6));if(s.y>=1923)u-=Math.min(0.3,0.05*Math.max(0,age-3));return u;}
function raceEffect(md,s){return ((md.raceBoost||0)>mi(s)?0.25:0)+((s.titleBoost||0)>mi(s)?0.3:0);}
// Всё, кроме цены и качества: мощность, шины, репутация, реклама, новизна, гонки, чужая страна
// Слишком слабый мотор отпугивает (в Европе с налогом на лошадиные силы маленький мотор народной машины — норма)

function offerPrice(md,c,s,price){const home=c===s.country;return (price??md.price)*(home?1:1+tariffAt(c,s))+(home?0:shipCost(s));}
/* ---------- рынок страны ---------- */
// Чем большую часть бюджета съедает машина, тем меньше хочется её брать; дороже бюджета — почти никто

// models — ваши модели в продаже в этой стране; ov — {id, price}: «а если поставить другую цену»; kap — сила конкурентов вместо таблицы (для подбора)

// Грузовики: покупает бизнес — фирмы выбирают между лошадью и мотором; фургон сравнивают с грузовиком по цене за тонну груза

  L.forEach(x=>{const d=pool*R.rho*A/dr*Math.exp(x.v-m)/zs;R.by[x.md.id]+=d;z.you+=d;});

function marketsOf(s){return Object.keys(COUNTRIES).filter(c=>c===s.country||dealerCount(s,c)>0);}
// Спрос на все модели во всех странах на текущий месяц
function demandAll(s,ov){
  const act=s.models.filter(m=>m.status==='prod');const res={by:{},mk:{}};act.forEach(m=>res.by[m.id]={});
  Object.keys(COUNTRIES).forEach(c=>{const open=c===s.country||dealerCount(s,c)>0,R=mkCountry(c,s,open?act:[],ov);res.mk[c]=R;if(open)act.forEach(m=>res.by[m.id][c]=R.by[m.id]||0);});
  return res;
}
// Спрос на модель при другой цене (подсказка игроку)
function demandAt(md,s,price){const r=demandAll(s,{id:md.id,price});return Object.values(r.by[md.id]||{}).reduce((a,b)=>a+b,0)*(techLv(s,'credit')?1.15:1);}
// Прогноз для новой модели: сколько возьмут дома рядом с вашими нынешними моделями
function forecastDemand(md,s){const o={...md,id:-1},R=mkCountry(s.country,s,[...s.models.filter(m=>m.status==='prod'),o]);return (R.by[-1]||0)*(techLv(s,'credit')?1.15:1);}

/* ================= CALIB: сила конкурентов по истории (генерируется test/calib.js) ================= */

/* ================= RACE CALENDAR, DRIVERS ================= */
function driverFee(d,s){return Math.round(600*cpi(s)*(1+T(s)*0.08)*(0.4+d.sk*d.sk*1.8)*bn('drvFee')/50)*50;}

function driverPayroll(s){return (s.drivers||[]).reduce((a,id)=>{const d=DRIVERS.find(x=>x.id===id);return a+(d?driverSalary(d,s):0);},0);}
function availDrivers(s){const ex=PIONEERS[s.pioneer].drv;return DRIVERS.filter(d=>d.from<=s.y&&d.to>=s.y&&!(s.drivers||[]).includes(d.id)&&d.id!==ex);}
function raceEligible(r,s){return r.c==='intl'||!COUNTRIES[r.c]||r.c===s.country||dealerCount(s,r.c)>0;}
function raceWarBlocked(r,s){const c=COUNTRIES[r.c]?r.c:'fr';return r.c==='intl'?isWar(s.y,s.m,s.country)&&s.country!=='us':isWar(r.y,r.m,c);}

// Подготовка к гонке: серийная машина, облегчённая (без тента, крыльев и задних сидений), заводской гоночный кузов
const PREP=[{id:0,name:'Серийная',desc:'как в продаже',cost:0},{id:1,name:'Облегчённая',desc:'без тента, крыльев и фонарей',cost:0.2},{id:2,name:'Заводской гоночный кузов',desc:'узкий кузов, форсированный мотор',cost:0.55}];
function mechanicEra(y){return y<1925;}
function racingCd(y){return y<1906?0.85:y<1914?0.75:y<1922?0.65:0.55;}
// Вес, мощность, тормоза, сцепление и надёжность — без расчёта разгона (быстро, для рынка)
function carBase(md,prep,y){
  const p=parts(md),U=id=>upgOf(md,id);prep=prep||0;y=y||(G?G.y:1895);
  let bodyKg=p.b.kg*(1-0.03*U(p.b.id)),cd=p.b.cd,cg=p.b.cg,hpK=1,relK=1;
  if(p.t.id==='t2')bodyKg+=40;else if(p.t.id==='t1')bodyKg+=15;
  // гоночный кузов легче серийного, но класс остаётся: четырёхместная база тяжелее двухместной; грузовику гоночный кузов не поставить
  if(prep===2&&p.b.truck)prep=1;
  if(prep===1){bodyKg*=p.b.truck?0.9:0.72;cd*=0.88;hpK=1.05;relK=0.98;cg-=0.03;}
  if(prep===2){bodyKg=50+0.4*p.b.kg+(y<1905?40:0);cd=Math.min(cd,racingCd(y)*(0.9+0.12*Math.min(5,p.b.seats||2)/5));cg=0.6+0.04*(Math.min(5,p.b.seats||2)-2)/3;hpK=1.25;relK=0.93;}
  const hp=engineHp(p.e,md)*hpK,crew=75+(mechanicEra(y)?70:0);
  const m=p.e.kg+p.g.kg+p.k.kg+p.c.kg*(1-0.04*U(p.c.id))+bodyKg+p.w.kg+crew+40;
  // передача: КПД коробки (прямая передача и кардан теряют меньше, чем ремни и цепи)
  const eff=p.g.eff*(1+0.01*U(p.g.id)),P=hp*745.7*0.82*eff/0.9,kd=0.5*1.2*cd,crr=p.w.solid?0.03:0.016;
  const grip=(p.w.grip||1)*(1+0.06*U(p.w.id)),brk=p.k.brk*(1+0.05*U(p.k.id));
  // надёжность: мотор, коробка, запас прочности рамы, проколы
  const load=p.e.hp/Math.max(1,chassisMax(p.c,md)),durK=1.02-0.06*clamp(load-0.5,0,0.5);
  const rel=clamp(p.e.rel*(1+0.02*U(p.e.id))*p.g.relK*(1+0.01*U(p.g.id))*durK*(1-0.03*(p.w.punct||0))/0.99*relK*(overpower(md)?0.75:1),0.3,0.99);
  return {hp,kg:Math.round(m),P,kd,crr,cd,cg,brk,grip,rel,wb:p.c.wb+(p.e.hp>40?0.3:0),wire:!!p.w.wire,mech:mechanicEra(y),hpKg:hp/m*1000};
}
function carStats(md,prep,y){
  y=y||(G?G.y:1895);const st=carBase(md,prep,y),{P,kd,crr}=st,m=st.kg,p=parts(md),g=9.81;
  let v=20;for(let i=0;i<30;i++){const f=kd*v*v*v+crr*m*g*v-P,df=3*kd*v*v+crr*m*g;v=Math.max(3,v-f/df);}
  let t=0,vv=0.5,t30=999;const muT=0.75*(p.w.grip||1);while(vv<16.7&&t<120){const a=Math.min(muT*g*0.56,(P/Math.max(vv,3.5)-kd*vv*vv-crr*m*g)/m);if(a<=0.02){t=999;break;}vv+=a*0.05;t+=0.05;if(vv>=8.33&&t30===999)t30=t;}
  st.vmax=v;st.acc=t;st.acc30=t30;return st;
}

// Лучшая цена модели для прибыли (считается раз в месяц на каждую цену)
const BP_CACHE=new Map();
function bestPriceFor(md,s){const key=md.id+'|'+mi(s)+'|'+md.price+'|'+PART_KEYS.map(k=>md[k]).join('');if(BP_CACHE.has(key))return BP_CACHE.get(key);
  // не дешевле себестоимости с запасом: иначе каждая проданная машина — убыток
  // если машин и дилеров не хватает на всех покупателей, выгоднее поднять цену, чем держать очередь
  const lim=(md.lostS||0)+(md.lostD||0)>0.5?Math.max(1,(md.lastSold||0)*1.15):Infinity;
  // прибыль по странам: за границей из выручки вычитаем доставку
  const uc=unitCost(md,s),ship=shipCost(s),ck=techLv(s,'credit')?1.15:1,prof=p=>{const by=demandAll(s,{id:md.id,price:p}).by[md.id]||{};let q=0,v=0;for(const c in by){const d=by[c]*ck;q+=d;v+=d*(p*(1-DEALER_MARGIN)-(c===s.country?0:ship)-uc);}return q>lim?v*lim/q:v;};
  const exp=(md.soldBy&&md.lastSold)?1-(md.soldBy[s.country]||0)/md.lastSold:0,floor=Math.round((uc+exp*ship)/(1-DEALER_MARGIN)*1.06/10)*10,p0=prof(md.price);let best={price:md.price,v:p0};
  for(const k of [0.8,0.9,1.1,1.2,1.35,1.6]){const p=Math.max(20,floor,Math.round(md.price*k/10)*10),v=prof(p);if(v>best.v)best={price:p,v};}
  if(md.price<floor&&best.price<floor)best={price:floor,v:prof(floor)};
  const r={price:best.price,gain:best.price===md.price?0:(best.v-p0)/Math.max(Math.abs(p0),1),v:best.v};if(BP_CACHE.size>200)BP_CACHE.clear();BP_CACHE.set(key,r);return r;}
function helperOn(s){return !!(s.helper&&s.helper.on);}
function homeDemand(s){return s.models.filter(m=>m.status==='prod').reduce((a,m)=>a+(m.fc||0),0);}
// Лучший проект для КБ: детали самой продаваемой модели, потом прототипы
function suggestProject(s){const P=rdProjects(s);if(!P.length)return null;const top=s.models.filter(m=>m.status==='prod').sort((a,b)=>(b.lastSold||0)-(a.lastSold||0))[0];
  const w={e:5,g:3,c:3,w:2,k:2,b:3};
  const mine=P.filter(p=>p.kind==='upg'&&top&&top[p.ck]===p.id).sort((a,b)=>(w[b.ck]||1)/b.need-(w[a.ck]||1)/a.need);
  return mine[0]||P.filter(p=>p.kind==='upg'&&p.mine)[0]||P.find(p=>p.kind==='early')||P[0];}
let TIPS=[];
function adviceList(s){

  if(s.over)return T;

  if(s.cash<0){const room=maxLoan(s)-s.loan,n=Math.max(0,Math.min(room,Math.ceil((-s.cash+3000*cpi(s))/1000)*1000));
    add(s.cash<-lim*0.5?100:90,'💰',`Касса в минусе на ${money(-s.cash)}${s.cash<-lim*0.5?`: при долге больше ${money(lim)} завод закроют`:''}. Возьмите кредит и сократите лишние расходы.`,n>0?`Кредит ${money(n)}`:null,n>0?()=>{G.loan+=n;G.cash+=n;addLog(`Взят кредит ${money(n)}.`);}:null,'plant');}
  if(!act.length&&!dev.length)add(95,'🛠','Сейчас нечего продавать. Придумайте машину: в конструкторе есть кнопка «Подобрать детали повыгоднее».','Конструктор',()=>openDesigner(),'models');

function helperMonth(s){if(!helperOn(s)||s.over)return;const msg=[],act=s.models.filter(m=>m.status==='prod'),L=s.last,home=s.country;
  // кредит, если касса в минусе
  if(s.cash<0){const n=Math.max(0,Math.min(maxLoan(s)-s.loan,Math.ceil((-s.cash+3000*cpi(s))/1000)*1000));if(n>0){s.loan+=n;s.cash+=n;msg.push('взял кредит '+money(n));}}
  // цены — раз в квартал
  if(s.m%3===0)act.forEach(md=>{if(!(md.lastSold||md.lastDem))return;const bp=bestPriceFor(md,s);if(bp.gain>0.05&&bp.price!==md.price){md.price=bp.price;msg.push(`цена «${md.name}» ${money(bp.price)}`);}});
  const room=()=>s.cash-4000*cpi(s);
  // цеха
  // цеха: только если покупателей не хватает второй месяц подряд и в стране нет войны и кризиса
  if(L&&act.length&&!(s.capBuild||[]).length){const util=L.made/Math.max(1,capEff(s)),lost=act.reduce((a,m)=>a+(m.lostS||0),0),ok=util>0.9&&lost>Math.max(1,L.sold*0.05);s.helper.capN=ok?(s.helper.capN||0)+1:0;
    if(ok&&s.helper.capN>=2&&econ(s.y,s.m,home).f>=0.9){const n=Math.max(2,Math.round(s.cap*0.3)),c=n*capUnitCost(s);if(room()>c*1.5){s.cash-=c;s.plantVal+=c;s.capBuild.push({units:n,left:2});msg.push('заложил цех');s.helper.capN=0;}}}
  // склад
  if(L&&(L.dumpN>0||whStock(s)>whCap(s)*0.85)&&!(s.whBuild||[]).length){const n=Math.max(5,Math.round(whCap(s)*0.6)),c=n*whUnitCost(s);if(room()>c){s.cash-=c;s.plantVal+=c;s.whBuild=s.whBuild||[];s.whBuild.push({units:n,left:1});msg.push('расширил склад');}}

  let add=0;if(mk&&(mk.lostDlr||0)>0.5)add=Math.ceil(mk.lostDlr/dealerTP(s));else if(act.length&&have<need*0.7)add=Math.max(1,Math.round((need*0.7-have)*0.25));
  add=Math.min(add,Math.floor(room()/dc/2));if(add>0){s.cash-=add*dc;s.dealers[home]=have+add;msg.push(`+${add} дилер${add===1?'':'а'}`);}
  // экспорт — раз в полгода

    else if(d&&d<dealerNeed(c,s)*0.5&&pot>d*dealerTP(s)*0.5&&room()>dc*4){const n=Math.max(1,Math.round(d*0.3));s.cash-=n*dc;s.dealers[c]=d+n;}});}
  // КБ: проекты и рост
  while(rdActive(s).length<rdSlots(s)){const pj=suggestProject(s);if(!pj)break;s.rd.projs.push({...pj,prog:0});msg.push('КБ: '+pj.name);}

  if(!s.techBuild){const k=TECH_ORDER.find(k=>techOpen(s,k)&&room()>techCost(s,k)*2.5);if(k){const c=techCost(s,k);s.cash-=c;s.plantVal+=c*0.7;s.techBuild={k,left:3};msg.push('внедряет: '+techNext(s,k).name);}}
  // реклама — около 4% выручки

const IMG={};let imgTried=false;
function allTitles(){const t=new Set();Object.values(PIONEERS).forEach(p=>p.wiki&&t.add(p.wiki));Object.values(COMPS).flat().forEach(c=>c.models.forEach(m=>m[2]&&t.add(m[2])));
  HIST.forEach(h=>h.img&&t.add(h.img));RACES.forEach(r=>r.img&&t.add(r.img));Object.values(RIVAL_CAR).flat().forEach(x=>t.add(x[1]));(typeof HIST_PHOTOS!=='undefined'?HIST_PHOTOS:[]).forEach(x=>t.add(x));t.add('Mercedes-Benz');return [...t];}
async function loadImages(){
  if(imgTried)return;imgTried=true;
  try{const c=JSON.parse(localStorage.getItem('avt-img')||'null');if(c&&c.v===2&&Date.now()-c.t<7*864e5){Object.assign(IMG,c.map);return;}}catch(e){}
  try{
    const titles=allTitles(),map={};
    for(let i=0;i<titles.length;i+=40){
      const chunk=titles.slice(i,i+40);
      const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=480&titles='+encodeURIComponent(chunk.join('|'));
      const j=await fetch(url).then(r=>r.json());const q=j.query||{};const alias={};
      (q.normalized||[]).forEach(n=>alias[n.to]=(alias[n.to]||[]).concat(n.from));
      (q.redirects||[]).forEach(n=>{alias[n.to]=(alias[n.to]||[]).concat(n.from,...(alias[n.from]||[]));});
      Object.values(q.pages||{}).forEach(pg=>{
        if(!pg.thumbnail||!pg.pageimage)return;
        if(!/\/wikipedia\/commons\//.test(pg.thumbnail.source))return;
        if(/logo|map|layout|circuit|coat_of_arms|flag|emblem|\.svg$/i.test(pg.pageimage))return;
        const v={src:pg.thumbnail.source,file:pg.pageimage};map[pg.title]=v;(alias[pg.title]||[]).forEach(a=>map[a]=v);
      });
    }
    Object.assign(IMG,map);
    try{localStorage.setItem('avt-img',JSON.stringify({v:2,t:Date.now(),map}));}catch(e){}
    if(G)render();
  }catch(e){}
}

function spark(data,color='var(--brass)'){
  const w=320,h=64;if(data.length<2)return '<div class="empty-chart">График появится через пару месяцев</div>';
  const min=Math.min(0,...data),max=Math.max(1,...data),span=max-min||1,x=i=>i*(w/(data.length-1)),y=v=>h-3-(v-min)/span*(h-6);
  const pts=data.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');
  const zero=min<0?`<line class="zero" x1="0" x2="${w}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/>`:'';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${y(min)} ${pts} ${w},${y(min)}" fill="${color}" fill-opacity=".14"/>${zero}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function qbar(r,label){const [l,tone]=qLabel(r);return `<div class="row small" style="margin-top:10px"><span class="muted">${esc(label||'Против соперников класса')}</span><span class="${tone}">${l} · <span class="num">${Math.round(r*100)}%</span></span></div><div class="bar qb" style="margin-top:6px"><i style="width:${Math.min(100,r/1.5*100)}%;background:var(--${tone})"></i><b></b></div>`;}
const pct=(x,d=0)=>(x*100).toFixed(d).replace('.',',')+'%';
function techEffects(lv){const e=[];if(lv.hrs)e.push(`−${Math.round((1-lv.hrs)*100)}% часов на машину`);if(lv.cap)e.push(`+${Math.round((lv.cap-1)*100)}% мощности`);if(lv.mat)e.push(`деталь дешевле на ${Math.round((1-lv.mat)*100)}%`);if(lv.def)e.push(`брак ${pct(lv.def,1)}`);if(lv.dem)e.push(`спрос +${Math.round(lv.dem*100)}%`);return e.join(' · ');}
function unitCost(md,s){s=s||G;return matCost(md,s)+hoursPerCar(md,s)/hoursPerWorker(s)*wageNow(s);}
function vPlant(){
  const s=G,L=s.last,cap=capEff(s),act=s.models.filter(m=>m.status==='prod');

  const building=(s.capBuild||[]).reduce((a,b)=>a+b.units,0),cu=capUnitCost(s);
  const addQ=Math.max(2,Math.round(s.cap*0.25)),addH=Math.max(4,s.cap),ml=maxLoan(s),step=Math.max(1000,Math.round(ml/10/1000)*1000);

    <tr><td>Детали и материалы</td><td class="n">−${money(L.mat)}</td></tr><tr><td>Зарплата</td><td class="n">−${money(L.wage)}</td></tr><tr><td>Содержание завода</td><td class="n">−${money(L.ovh)}</td></tr>

    ${L.sto>1?`<tr><td>Склад</td><td class="n">−${money(L.sto)}</td></tr>`:''}${L.war>1?`<tr><td>Гарантийный ремонт</td><td class="n">−${money(L.war)}</td></tr>`:''}${L.fin?`<tr><td>Кредит покупателям</td><td class="n">−${money(L.fin)}</td></tr>`:''}${L.tool?`<tr><td>Оснастка новых моделей</td><td class="n">−${money(L.tool)}</td></tr>`:''}${L.hire>1?`<tr><td>Найм и обучение</td><td class="n">−${money(L.hire)}</td></tr>`:''}${L.fine?`<tr><td>Неустойка по заказам</td><td class="n">−${money(L.fine)}</td></tr>`:''}
    ${L.tax?`<tr><td>Налог на прибыль</td><td class="n">−${money(L.tax)}</td></tr>`:''}${L.int?`<tr><td>Проценты по кредиту</td><td class="n">−${money(L.int)}</td></tr>`:''}<tr class="tot"><td>Итог за ${L.label}</td><td class="n ${L.profit>=0?'good':'bad'}">${money(L.profit)}</td></tr></table>`
    :'<p class="small muted">Отчёт появится после первого месяца. Нажмите «Следующий месяц» внизу.</p>';
  const techs=TECH_ORDER.map(k=>{const d=TECH[k],l=techLv(s,k),nx=techNext(s,k),open=techOpen(s,k),cost=techCost(s,k),bld=s.techBuild&&s.techBuild.k===k;
    const cur=l?d.lv[l-1].name:'нет';let status='';
    if(bld)status=`<span class="pill warn">Внедряется · ${s.techBuild.left} мес.</span>`;
    else if(!nx)status='<span class="pill good">Всё внедрено</span>';
    else if(open)status=`<button class="btn sm ${s.cash>=cost&&!s.techBuild?'primary':''}" data-act="tech" data-k="${k}" ${s.cash<cost||s.techBuild?'disabled':''}>${money(cost)}</button>`;
    else{const needT=nx.need?Object.keys(nx.need).filter(r=>techLv(s,r)<nx.need[r]).map(r=>TECH[r].name):[];status=`<span class="pill muted">${needT.length?'Нужно: '+needT.join(', '):'С '+(nx.y-techEarly(s))+' г.'}</span>`;}
    return `<div class="tech-row"><div class="row"><div><h3>${d.name}${d.max>1?` <span class="muted small num">${l}/${d.max}</span>`:''}</h3><p class="small muted">${l?'Сейчас: '+cur:d.desc}</p></div>${status}</div>
      ${nx?`<p class="small" style="margin-top:4px">${bld?'Внедряем':'Дальше'}: <b>${nx.name}</b> — ${techEffects(nx)}${nx.hist?` <span class="muted">· в истории: ${nx.hist[1]}, ${nx.hist[0]}</span>`:''}</p>`:''}</div>`;}).join('');
  const P=PIONEERS[s.pioneer],wp=s.wagePol||'market';
  const staffHTML=`    <div class="chips" style="margin-top:8px"><button class="chip ${s.staffAuto?'on':''}" data-act="staffAuto" data-v="1">Нанимать по плану выпуска<small>отдел кадров сам держит нужный штат</small></button><button class="chip ${s.staffAuto?'':'on'}" data-act="staffAuto" data-v="0">Вручную<small>шаг — 10% штата</small></button></div>
    <div class="label" style="margin-top:12px">Зарплата</div><div class="chips">${Object.entries(WAGE_POL).map(([k,w])=>`<button class="chip ${wp===k?'on':''}" data-act="wagePol" data-v="${k}" ${w.y&&s.y<w.y-techEarly(s)?'disabled':''}>${w.name}<small>×${String(w.k).replace('.',',')} ставки · выработка ${w.prod>=1?'+':'−'}${Math.round(Math.abs(w.prod-1)*100)}% · текучесть ${w.turn}${w.y&&s.y<w.y-techEarly(s)?' · с '+(w.y-techEarly(s))+' г.':''}</small></button>`).join('')}</div>`;
  return `<div class="scene">${factorySVG(s)}</div>
  ${advisorCard(s)}
  <div class="kpis"><div class="kpi"><span class="label">Прибыль</span><b class="${L&&L.profit<0?'bad':''}">${L?money(L.profit):'—'}</b></div><div class="kpi"><span class="label">Продано</span><b>${L?fmtN(L.sold)+' шт.':'—'}</b></div><div class="kpi"><span class="label">Репутация</span><b>${Math.round(s.rep)}<span class="muted small">/100</span></b></div></div>
  ${s.pioneer!=='custom'?`<section class="card" style="display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center"><div style="width:64px">${portraitHTML(s.pioneer)}</div><div><h3>${P.name}</h3><div class="bon">${P.plus.map(x=>`<span class="p">${x}</span>`).join('')}${P.minus.map(x=>`<span class="m">${x}</span>`).join('')}</div></div></section>`:''}
  <section class="card"><div class="row"><span class="label">Касса по месяцам</span><span class="small muted num">${money(s.cash)}</span></div>${spark(s.hist.cash)}</section>
  <section class="card"><h2>Мощности</h2>
    <div class="row" style="margin-top:8px"><div><h3><span class="num">${fmtN(Math.round(cap))}</span> машин в месяц</h3><p class="small muted">${s.shifts>1?'Две смены':'Одна смена'} · простая машина в пересчёте${building?` · строится ещё ${fmtN(Math.round(building*techMul(s,'cap')*(s.shifts>1?1.85:1)))}`:''}</p></div><span class="num ${util>0.95?'warn':''}">${Math.round(util*100)}%</span></div>

    <p class="small muted" style="margin-top:6px">Цех строится 2 месяца. Место под одну машину в месяц стоит ${money(cu)}; содержание — около 1% стоимости завода в месяц.</p>
    <div class="label" style="margin-top:12px">Смены</div><div class="chips"><button class="chip ${s.shifts>1?'':'on'}" data-act="shifts" data-v="1">Одна<small>обычная ставка</small></button><button class="chip ${s.shifts>1?'on':''}" data-act="shifts" data-v="2">Две<small>мощность ×1,85, зарплата +8%, содержание +10%</small></button></div></section>
  <section class="card"><h2>Рабочие</h2>
    <div class="row" style="margin-top:8px"><div><h3><span class="num">${fmtN(s.workers)}</span> рабочих</h3><p class="small muted">${money(wageNow(s))} в месяц на человека · ${Math.round(hpw)} ч в месяц</p></div>${s.staffAuto?'<span class="pill good">Штат по плану</span>':`<div class="step"><button data-act="workers" data-d="-1" aria-label="Сократить">−</button><span>${fmtN(s.workers)}</span><button data-act="workers" data-d="1" aria-label="Нанять">+</button></div>`}</div>
    <div class="row small" style="margin-top:8px"><span class="muted">На одну машину уходит</span><span class="num">${fmtN(Math.round(avgH))} человеко-часов</span></div>

  </section>
  ${whCard(s)}
  <section class="card"><h2>Технологии завода</h2><p class="small muted" style="margin-top:2px">Внедряется одна технология за раз, 3 месяца. Сильное КБ открывает их раньше истории — это «первенства» в зачёт наследия.</p>
    ${fold('tech',s.techBuild?`Внедряется: ${esc(techNext(s,s.techBuild.k).name)} · ${s.techBuild.left} мес.`:'Все технологии',`<div>${techs}</div>`,false,`внедрено ${TECH_ORDER.reduce((a,k)=>a+techLv(s,k),0)} из ${TECH_ORDER.reduce((a,k)=>a+TECH[k].max,0)} · можно начать: ${TECH_ORDER.filter(k=>techOpen(s,k)).length}`)}</section>
  <section class="card"><h2>Финансы</h2>${L?`<div class="row small" style="margin-top:8px"><span class="muted">Итог за ${L.label}</span><b class="num ${L.profit>=0?'good':'bad'}">${money(L.profit)}</b></div>`:''}${fold('pl','Доходы и расходы по статьям',pl,false)}<div class="hr"></div>
    <div class="row"><div><h3>Кредит: <span class="num">${money(s.loan)}</span></h3><p class="small muted">0,5% в месяц · лимит ${money(ml)}</p></div><div class="btns"><button class="btn" data-act="loan" data-n="${step}" ${s.loan+step>ml?'disabled':''}>+${fmtN(step)}</button><button class="btn" data-act="repay" data-n="${step}" ${s.loan<1||s.cash<Math.min(step,s.loan)?'disabled':''}>Погасить</button></div></div>
    <div class="row small" style="margin-top:8px"><span class="muted">Стоимость компании</span><span class="num">${money(companyValue(s))}</span></div></section>`;
}
function whCard(s){const st=whStock(s),cap=whCap(s),f=st/Math.max(1,cap),uc=whUnitCost(s),a=Math.max(5,Math.round(cap*0.5)),b=Math.max(10,cap),bld=(s.whBuild||[]).reduce((x,y)=>x+y.units,0),L=s.last;
  return `<section class="card"><h2>Склад</h2><div class="row" style="margin-top:8px"><div><h3><span class="num">${fmtN(st)}</span> из ${fmtN(cap)} мест</h3><p class="small muted">Место под одну машину — ${money(uc)}${bld?` · строится ещё ${fmtN(bld)}`:''}</p></div><span class="num ${f>0.9?'warn':''}">${Math.round(f*100)}%</span></div>
    <div class="bar" style="margin-top:6px"><i style="width:${Math.min(100,f*100)}%;background:var(--${f>0.9?'warn':'brass'})"></i></div>
    ${L&&L.dumpN?`<p class="small bad" style="margin-top:6px">Не поместились ${fmtN(L.dumpN)} машин — ушли перекупщикам за полцены.</p>`:''}
    <div class="btns" style="margin-top:10px"><button class="btn" data-act="whAdd" data-n="${a}" ${s.cash<a*uc?'disabled':''}>+${fmtN(a)} мест · ${money(a*uc)}</button><button class="btn" data-act="whAdd" data-n="${b}" ${s.cash<b*uc?'disabled':''}>Удвоить · ${money(b*uc)}</button></div>
    <p class="small muted" style="margin-top:6px">Склад строится месяц. Запас машин спасает, когда спрос выше прогноза, а всё, что не влезло, забирают перекупщики за полцены.</p></section>`;}
// Сколько завод выпустит в этом месяце при плане «авто»
function autoPlan(md){return Math.max(0,Math.round((md.fc||0)*1.04+(md.backlog||0)-((md.stock||0)-0.35*(md.fc||0))));}
const fmtD=x=>x>0&&x<10?(Math.round(x*10)/10).toString().replace('.',','):fmtN(x);
function planStep(md,sm){const auto=md.plan==='auto'||md.plan===undefined,n=auto?autoPlan(md):+md.plan,st=Math.max(1,Math.round(Math.max(n,md.fc||1)*0.1));
  return `<div class="step${sm?' sm':''}"><button data-act="plan" data-id="${md.id}" data-d="${-st}" aria-label="Выпускать меньше">−</button><span>${fmtN(n)}</span><button data-act="plan" data-id="${md.id}" data-d="${st}" aria-label="Выпускать больше">+</button></div>`;}
function stockWarn(md){return md.status==='prod'&&md.stock>Math.max(3,(md.fc||0)*3);}
// Сворачиваемые разделы: длинные списки открываются, когда нужны
const UIF={};
function isOpen(k,def){return UIF[k]===undefined?!!def:UIF[k];}
function fold(k,title,inner,def,sub){const o=isOpen(k,def);return `<button class="fold-h" data-act="fold" data-k="${k}"><span>${title}${sub?`<small>${sub}</small>`:''}</span><i>${o?'▴':'▾'}</i></button>${o?`<div class="fold-b">${inner}</div>`:''}`;}
// Почему продали меньше, чем хотели купить
function lostLine(md){if(md.status!=='prod'||md.lastWant===undefined)return '';const w=md.lastWant||0,sold=md.lastSold||0;if(w<0.5)return '<p class="small muted" style="margin-top:6px">В прошлом месяце покупателей не нашлось: проверьте цену, дилеров и сравнение с соперником.</p>';
  if(w-sold<0.6)return `<p class="small good" style="margin-top:6px">Продано всё, что хотели купить${sold?` — ${fmtN(sold)} шт.`:'.'}</p>`;
  const L=[];if((md.lostS||0)>=0.5)L.push(`не хватило машин — ${fmtD(md.lostS)}${(md.queued||0)>=1?` (${fmtN(md.queued)} ждут в очереди)`:''}`);if((md.lostD||0)>=0.5)L.push(`дилеры не успели — ${fmtD(md.lostD)}`);
  return `<p class="small warn" style="margin-top:6px">Хотели купить ≈ ${fmtD(w)}, продано ${fmtN(sold)}${L.length?': '+L.join(', '):''}. ${(md.lostS||0)>=(md.lostD||0)?'Выпускайте больше или расширьте склад.':'Откройте дилеров на вкладке «Рынок».'}</p>`;}
function planCard(s){const act=s.models.filter(m=>m.status==='prod');if(!act.length)return '';
  const rows=act.map(md=>{const auto=md.plan==='auto'||md.plan===undefined,w=stockWarn(md);
    return `<div class="plan-row"><div class="row ctl"><div><h3>${esc(md.name)} <span class="pill ${auto?'good':'warn'}">${auto?'авто':'вручную'}</span></h3>
      <p class="small muted">выпуск ${fmtN(md.lastMade||0)} · продано ${fmtN(md.lastSold||0)}${md.ordSold?` · по заказам ${fmtN(md.ordSold)}`:''} · склад <b class="${w?'warn':''}">${fmtN(md.stock)}</b>${md.backlog>1?` · очередь ${fmtN(md.backlog)}`:''}</p></div>${auto&&!isOpen('plan'+md.id)?`<button class="btn sm" data-act="fold" data-k="plan${md.id}">Вручную ▾</button>`:planStep(md,1)}</div>

  return `<section class="card"><div class="row"><h2>Выпуск</h2><span class="label">машин в месяц</span></div>${rows}
    <div class="row small" style="margin-top:8px"><span class="muted">Склад: ${fmtN(whStock(s))} из ${fmtN(whCap(s))} мест</span><span class="num ${wf>0.9?'warn':''}">${Math.round(wf*100)}%</span></div><div class="bar" style="margin-top:4px"><i style="width:${Math.min(100,wf*100)}%;background:var(--${wf>0.9?'warn':'brass'})"></i></div>
    <p class="small muted" style="margin-top:8px">«Авто» — завод делает столько, сколько берут покупатели, и не больше, чем поместится на складе. Склад расширяется на вкладке «Завод».</p></section>`;}
function ordersCard(s){const L=s.orders||[];if(!L.length)return '';
  return `<section class="card"><div class="row"><h2>Заказы</h2><span class="pill good">${L.length}</span></div>${L.map(o=>{const md=s.models.find(m=>m.id===o.md),done=o.n-o.left,left=o.due-mi(s);
    return `<div class="plan-row"><div class="row"><div><h3>${esc(o.who)}</h3><p class="small muted">«${esc(md?md.name:'?')}» · ${money(o.price)} за машину · осталось ${left} мес.</p></div><span class="num">${fmtN(done)}/${fmtN(o.n)}</span></div><div class="bar" style="margin-top:6px"><i style="width:${done/o.n*100}%;background:var(--good)"></i></div></div>`;}).join('')}
    <p class="small muted" style="margin-top:8px">Машины для заказов завод делает сверх плана и отдаёт в первую очередь. Не успеете к сроку — неустойка и удар по репутации.</p></section>`;}
function rdCardHTML(s){const rd=s.rd,L=rdActive(s),pts=rdPoints(s),slots=rdSlots(s),free=slots-L.length;

/* ================= RACE SETUP: team of up to 3 cars, drivers, preparation, mode ================= */
const RACE_ACT={};
let RS=null;   // заявка на гонку: {key, entries:[{drv,car,prep,tyre,gear}], open, mode, more}
const MAX_ENTRIES=3;
function raceCarsFor(s){return s.models.filter(m=>m.status==='prod');}
function raceRank(md,rc){const st=carStats(md,2,rc.y);return st.vmax*(0.55+0.45*st.rel)/(1+st.acc/60);}
function prepAllowed(p,s,rc,md){return p<2||((s.rdept||0)>=1&&!(md&&isTruck(md)));}
function defaultEntry(s,rc,taken){
  const cars=raceCarsFor(s).sort((a,b)=>raceRank(b,rc)-raceRank(a,rc)),free=['me',...(s.drivers||[])].filter(d=>!taken.includes(d)),cfg=trackCfg(rc);
  // свободных своих пилотов нет — предложить лучшего свободного гонщика на одну гонку
  if(!free.length){const d=availDrivers(s).filter(x=>!taken.includes(x.id)).sort((a,b)=>b.sk-a.sk)[0];if(d)free.push(d.id);}
  return {drv:free[0]||null,car:cars[0]?cars[0].id:null,prep:(s.rdept||0)>=1&&!['rally','endurance'].includes(rc.t)?2:1,tyre:rc.km>600&&!cfg.pits?'hard':'soft',gear:['oval','sprint'].includes(rc.t)?1:rc.t==='hill'?-1:0};
}
function drvObj(id){return id&&id!=='me'?DRIVERS.find(d=>d.id===id):null;}
function entryCost(rc,e,s){const d=drvObj(e.drv),hire=d&&!(s.drivers||[]).includes(d.id)?driverRaceFee(d,s):0,fee=raceFee(rc),prep=prepCost(rc,e.prep,s);return {fee,prep,hire,total:fee+prep+hire};}
function setupTotal(rc,s){return RS.entries.reduce((a,e)=>{const c=entryCost(rc,e,s);a.fee+=c.fee;a.prep+=c.prep;a.hire+=c.hire;a.total+=c.total;return a;},{fee:0,prep:0,hire:0,total:0});}
// Оценка шанса доехать до финиша: та же модель отказов, что и в гонке

// Глава гоночной команды: оценка заявки — шины против дистанции, передачи под трассу, подготовка, надёжность, машина и пилот
function raceAdvice(rc,e,md,st,s){
  const cfg=trackCfg(rc),tips=[],rec={tyre:e.tyre,gear:e.gear,prep:e.prep},km=rc.km;
  const lifeS=tyreLife(md,rc,Object.assign({},e,{tyre:'soft'})),lifeH=tyreLife(md,rc,Object.assign({},e,{tyre:'hard'}));
  if(lifeS>=km*1.25){rec.tyre='soft';tips.push(`Дистанция ${fmtN(km)} км, мягкие шины проживут ≈${fmtN(lifeS)} км — берите мягкие: в поворотах держат цепче.`);}
  else if(lifeH>=km){rec.tyre='hard';tips.push(`Мягкие сотрутся к ≈${fmtN(lifeS)} км из ${fmtN(km)}. Жёсткие доедут без смены колёс (≈${fmtN(lifeH)} км).`);}
  else{rec.tyre=cfg.pits?'soft':'hard';const n=Math.max(1,Math.ceil(km/(rec.tyre==='soft'?lifeS:lifeH))-1);tips.push(cfg.pits?`Шины не выдержат всю гонку, колёса поменяют в боксах — мягкие дадут скорость на каждом отрезке.`:`Шины не выдержат всю гонку: ждите ${n>1?n+' смены':'смену'} колёс на обочине. Жёсткие живут дольше (≈${fmtN(lifeH)} км против ${fmtN(lifeS)}).`);}
  const g=['oval','sprint'].includes(rc.t)||cfg.banked?1:rc.t==='hill'||cfg.curvy>=0.9?-1:0;rec.gear=g;
  if(e.gear!==g)tips.push(g===1?'Передачи: здесь длинные прямые — длинные передачи дадут максимальную скорость.':g===-1?'Передачи: крутые повороты и подъёмы — короткие передачи помогут разгоняться из каждого поворота.':'Передачи: трасса смешанная — средние передачи.');
  const long=['endurance','rally'].includes(rc.t)||km>=1000,ok2=prepAllowed(2,s,rc,md);
  if(long&&e.prep===2){rec.prep=1;tips.push('Гонка долгая: форсированный мотор чаще ломается. Облегчённая подготовка надёжнее, а скорость почти та же.');}
  else if(!long&&ok2&&e.prep<2){rec.prep=2;const v2=carStats(md,2,rc.y).vmax;tips.push(`Гоночный кузов и форсированный мотор: ${Math.round(v2*3.6)} км/ч вместо ${Math.round(st.vmax*3.6)} за ${money(prepCost(rc,2,s))}.`);}
  else if(e.prep===0){rec.prep=1;const v1=carStats(md,1,rc.y).vmax;tips.push(`Снимите тент и крылья (облегчённая): ${Math.round(v1*3.6)} км/ч вместо ${Math.round(st.vmax*3.6)}.`);}
  const fc=finishChance(carStats(md,rec.prep,rc.y),rc,s);if(fc<0.55)tips.push(`Шанс доехать ≈${Math.round(fc*100)}%. В гонке отдавайте приказ «Беречь» или ставьте мотор понадёжнее.`);
  const best=raceCarsFor(s).filter(m=>m.id!==md.id).map(m=>({m,r:raceRank(m,rc)})).sort((a,b)=>b.r-a.r)[0];
  if(best&&best.r>raceRank(md,rc)*1.06)tips.push(`Машина: «${best.m.name}» для этой гонки лучше — ${Math.round(carStats(best.m,rec.prep,rc.y).vmax*3.6)} км/ч.`);
  const pilot=e.drv==='me'?(PIONEERS[s.pioneer].drv&&DRIVERS.find(d=>d.id===PIONEERS[s.pioneer].drv)||{sk:0.72}):drvObj(e.drv),cand=availDrivers(s).concat((s.drivers||[]).map(id=>DRIVERS.find(x=>x.id===id)).filter(Boolean)).sort((a,b)=>b.sk-a.sk)[0];
  if(pilot&&cand&&cand.sk-pilot.sk>=0.08&&e.drv!==cand.id)tips.push(`Пилот: ${cand.n} опытнее (мастерство ${Math.round(cand.sk*100)})${(s.drivers||[]).includes(cand.id)?' и уже в команде':` — на гонку ${money(driverRaceFee(cand,s))}`}.`);
  if(cfg.night)tips.push('Ночью часть трассы в темноте — не рискуйте на обгонах в поворотах.');
  return {tips,rec,same:rec.tyre===e.tyre&&rec.gear===e.gear&&rec.prep===e.prep};
}

function trackCfg(rc){

  if(rc.t==='endurance')Object.assign(c,{closed:true,laps:3,len:1400,curvy:0.45,pits:true,night:rc.id==='lemans'||rc.id==='spa24',town:false});
  if(rc.t==='hill')Object.assign(c,{len:1400,curvy:1,hilly:0.2,uphill:true,terr:'mount',town:false,crowd:0.2,width:7});
  if(rc.t==='rally')Object.assign(c,{len:2600,curvy:0.55,hilly:0.6,stages:['snow','mud','dirt'],crowd:0.06});
  if(rc.t==='oval')Object.assign(c,{closed:true,laps:3,len:1250,oval:true,pits:true,town:false,crowd:0.6,width:14,terr:rc.y<1920?'concrete':'asphalt'});

  if(rc.track==='brooklands'){c.terr='concrete';c.banked=true;}
  if(rc.track==='monza')Object.assign(c,{curvy:0.35,len:1800});
  if(rc.track==='nurb')Object.assign(c,{curvy:0.95,hilly:0.9,len:1900,host:'de'});
  if(rc.track==='monaco')Object.assign(c,{curvy:1,hilly:0.25,town:true,crowd:0.7,len:1100,width:8,terr:'asphalt',host:'mc'});

function buildTrack(rc,vref){

  if(cfg.closed){
    const fine=[];const M=3000;
    if(cfg.oval){const Rr=cfg.len*0.11,Ls=(cfg.len-2*Math.PI*Rr)/2;
      for(let i=0;i<M;i++){const u=i/M*cfg.len;let x,z;
        if(u<Ls){x=Rr;z=-Ls/2+u;}else if(u<Ls+Math.PI*Rr){const a=(u-Ls)/Rr;x=Rr*Math.cos(a);z=Ls/2+Rr*Math.sin(a);}

        let y=0;Hy.forEach(([k,ph],j)=>y+=Math.sin(k*th+ph)*cfg.hilly*(9-j*2.5));fine.push([Math.cos(th)*r,y,Math.sin(th)*r]);}}

function nearTrack(trk,x,z,rad,skip){const cx=Math.floor(x/30),cz=Math.floor(z/30);for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const L=trk.cgrid[(cx+a)+','+(cz+b)];if(!L)continue;for(const i of L){if(skip!==undefined&&Math.abs(i-skip)<8)continue;const p=trk.pts[i];if((p[0]-x)**2+(p[2]-z)**2<rad*rad)return true;}}return false;}

function placeScenery(trk,rnd){
  const {n,W,cfg,pts,N}=trk,set=SCEN_SETS[cfg.host],spr=trk.spr;for(let i=0;i<n;i++){spr.push([]);trk.bar.push(null);}
  const add=(i,t,off,v,kind,colR)=>{i=((i%n)+n)%n;const p=pts[i],nn=N[i],x=p[0]+nn[0]*off,z=p[2]+nn[1]*off;if(Math.abs(off)>W/2+1&&nearTrack(trk,x,z,W/2+1.5,i))return false;

      if(i%37===0)add(i,'gend',(rnd()<0.5?-1:1)*(W/2+2.2),0,'p');

function aiControl(c,trk,dt){

  const look=6+v*0.75,ai=Math.round(look/step);let ti=c.idx+ai;if(closed)ti%=n;else ti=Math.min(n-1,ti);

// Движение в потоке: обгон медленной машины впереди, съезд к обочине для ремонта
function aiTraffic(T){
  const W2=T.W/2-1.3;
  R.cars.forEach(c=>{if(c.player||c.dnf||c.fin!==null)return;
    if(c.stopT>0||c.punct||(c.pitT>0)){c.laneT=c.pitT>0?undefined:-W2;return;}

    R.cars.forEach(o=>{if(o===c||o.parked||(o.dnf&&Math.abs(o.lat)>T.W/2))return;const gap=o.prog-c.prog;if(gap<=0||gap>8+c.vx*0.9)return;const dl=o.lat-c.lat;if(Math.abs(dl)<2.3&&gap<best){best=gap;blk=o;}});
    if(blk&&blk.vx<c.vx+1){const L=blk.lat+2.9,Rr=blk.lat-2.9,okL=L<=W2,okR=Rr>=-W2;
      c.laneT=okL&&(!okR||Math.abs(L-c.lat)<=Math.abs(Rr-c.lat))?L:okR?Rr:c.lat;
      if(blk.vx>2&&best<5+c.vx*0.25&&Math.abs(blk.lat-c.lat)<1.9&&c.vx>blk.vx){c.follow=blk;}else c.follow=null;}

const rKeys={left:false,right:false,gas:false,brake:false};

const RW={mode:'keys',drag:null,target:0};
function playerControl(c,dt){

  const back=(1.6+1.4*Math.min(1,v/20))*dt;

// Рисуем руль эпохи: деревянный обод и латунные спицы в ранние годы, чёрный обод с тремя спицами — позже
function drawWheelUI(){
  const cv=document.getElementById('rWheelC');if(!cv||!R||R.mode!=='drive')return;const W=cv.clientWidth,H=cv.clientHeight;if(!W||!H)return;
  const dpr=Math.min(2,window.devicePixelRatio||1);if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);}
  const F0=R.me||R.follow,sig=(F0?Math.round(F0.steer*200):0)+'|'+RW.mode+'|'+rKeys.left+rKeys.right+'|'+W+'x'+H+'|'+(RW.used?1:0)+'|'+R.rc.y;if(cv.dataset.sig===sig)return;cv.dataset.sig=sig;
  const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const F=F0,st=F?F.steer:0,y=R.rc.y,r=Math.min(H*0.46,W*0.29),wood=y<1920,brass=y<1916?'#c9a24a':'#b9bec5';
  // стрелки по краям: в режиме кнопок — это кнопки, в режиме колеса — подсказка
  const kmode=RW.mode==='keys';g.font=`800 ${Math.round(H*0.3)}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';
  [['left',-1,'◀'],['right',1,'▶']].forEach(([k,sd,ch])=>{g.fillStyle=rKeys[k]&&kmode?'rgba(233,196,106,.95)':kmode?'rgba(233,236,240,.55)':'rgba(233,236,240,.16)';g.fillText(ch,W/2+sd*(r+(W/2-r)/2),H/2);});
  g.save();g.translate(W/2,H/2);g.rotate(st*2.3);
  g.lineWidth=r*0.2;g.strokeStyle=wood?'#7a4e2a':'#1a1a1d';g.beginPath();g.arc(0,0,r*0.86,0,7);g.stroke();
  g.lineWidth=r*0.07;g.strokeStyle=wood?'rgba(255,214,160,.4)':'rgba(255,255,255,.22)';g.beginPath();g.arc(0,0,r*0.9,-2.7,-0.5);g.stroke();
  if(wood){g.lineWidth=r*0.015;g.strokeStyle='rgba(40,20,8,.5)';for(let i=0;i<12;i++){const a=i/12*6.283;g.beginPath();g.moveTo(Math.cos(a)*r*0.77,Math.sin(a)*r*0.77);g.lineTo(Math.cos(a)*r*0.95,Math.sin(a)*r*0.95);g.stroke();}}
  const spokes=y<1915?[0.785,2.356,3.927,5.498]:[0,Math.PI/2,Math.PI];g.lineCap='round';
  spokes.forEach(a=>{g.lineWidth=r*0.11;g.strokeStyle=shade(brass,-0.35);g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8);g.stroke();g.lineWidth=r*0.06;g.strokeStyle=brass;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8);g.stroke();});
  g.fillStyle=shade(brass,-0.25);g.beginPath();g.arc(0,0,r*0.2,0,7);g.fill();g.fillStyle=brass;g.beginPath();g.arc(-r*0.04,-r*0.04,r*0.13,0,7);g.fill();
  // метка «верх» — видно, насколько повёрнут руль
  g.fillStyle='#e9c46a';g.beginPath();g.arc(0,-r*0.86,r*0.09,0,7);g.fill();
  g.restore();
  if(RW.mode==='tilt'){g.font=`600 ${Math.round(H*0.14)}px system-ui,sans-serif`;g.fillStyle='rgba(233,236,240,.6)';g.fillText('наклон',W/2,H-H*0.1);}
}

};
const champKey=(id,y)=>id+'-'+y;
function champRaces(id,y){const C=CHAMPS[id];return C.years(y)?RACES.filter(r=>r.y===y&&C.has(r)):[];}
function champsOf(y){return Object.keys(CHAMPS).filter(id=>champRaces(id,y).length>0);}
function raceChamps(rc){return Object.keys(CHAMPS).filter(id=>CHAMPS[id].years(rc.y)&&CHAMPS[id].has(rc));}
function champValue(id,rc,place,dnf){
  if(id==='aiacr')return dnf?5:place<=3?place:4;
  if(dnf)return 0;
  if(id==='aaa')return place>10?0:Math.round(2*rc.km/1.609*[1,.8,.7,.6,.5,.4,.3,.2,.1,.05][place-1]/10)*10;
  return place>6?0:[8,6,4,3,2,1][place-1]*(rc.major?1:0.5);
}
// order — машины в порядке финиша (сошедшие в конце): {name, dnf}. Марка получает очки за лучшую машину.
function champRecord(s,rc,order){
  raceChamps(rc).forEach(id=>{
    const k=champKey(id,rc.y),ch=s.season[k]=s.season[k]||{id,y:rc.y,rows:{},races:[],done:false};
    if(ch.races.includes(rc.key))return;ch.races.push(rc.key);
    const seen=new Set();let pos=0;
    order.forEach(o=>{pos++;if(!o.name||o.name==='Частная машина'||seen.has(o.name))return;seen.add(o.name);
      (ch.rows[o.name]=ch.rows[o.name]||{r:{}}).r[rc.key]=champValue(id,rc,pos,!!o.dnf);});
  });
}
function champTotal(id,ch,row){
  if(id==='aiacr')return ch.races.map(k=>row.r[k]!==undefined?row.r[k]:6).sort((a,b)=>a-b).slice(0,3).reduce((a,b)=>a+b,0);
  const v=Object.values(row.r);if(id==='gp')v.sort((a,b)=>b-a).splice(5);
  return v.reduce((a,b)=>a+b,0);
}
function champEligible(id,ch,row){if(id!=='aiacr')return true;const it=ch.races.find(k=>k.startsWith('itgp-'));return (!it||row.r[it]!==undefined)&&Object.keys(row.r).length>=Math.min(3,ch.races.length);}
function champTable(s,id,y){
  const ch=s.season[champKey(id,y)];if(!ch)return [];
  const rows=Object.keys(ch.rows).map(n=>{const row=ch.rows[n],v=Object.values(row.r);return {n,pts:champTotal(id,ch,row),el:champEligible(id,ch,row),starts:v.length,wins:ch.races.filter(k=>id==='aiacr'?row.r[k]===1:row.r[k]===champValue(id,RACES.find(r=>r.key===k),1,false)&&row.r[k]>0).length,you:n===s.company};});
  const inv=id==='aiacr';
  rows.sort((a,b)=>(b.el-a.el)||(inv?a.pts-b.pts:b.pts-a.pts)||(b.wins-a.wins)||(b.starts-a.starts));
  return rows;
}
function fmtPts(id,v){return id==='aiacr'?String(v):Number.isInteger(v)?String(v):v.toFixed(1).replace('.',',');}
function champFinish(s,id,y){
  const k=champKey(id,y),ch=s.season[k];if(!ch||ch.done)return;
  if(!champRaces(id,y).every(r=>s.cres[r.key]))return;
  ch.done=true;const C=CHAMPS[id],tb=champTable(s,id,y),win=tb.find(r=>r.el&&(id==='aiacr'||r.pts>0));
  ch.win=win?win.n:'';const me=tb.findIndex(r=>r.you);
  if(win&&win.you){
    s.titles.push({y,id,name:C.title(y),w:C.w});s.titleBoost=mi(s)+12;s.rep=clamp(s.rep+(C.off?8:5)*bn('raceRep'),0,100);
    const second=tb.find(r=>!r.you&&r.el);
    pushEvent({kicker:'Спорт',title:id==='aiacr'?`«${s.company}» — чемпион мира!`:id==='aaa'?`«${s.company}» — чемпион Америки!`:`«${s.company}» — марка сезона!`,
      deck:`${C.name(y)} ${y}: ${fmtPts(id,win.pts)} ${id==='aiacr'?'штрафных очков':'очков'}`,
      text:`${C.name(y)} ${y} года завершён, и первое место в зачёте марок принадлежит «${s.company}». ${second?`Ближайший соперник — ${second.n} (${fmtPts(id,second.pts)}).`:''}\n${id==='aiacr'?'Титул чемпиона мира — главная награда для автомобильного завода. Покупатели по всему миру знают теперь вашу марку.':'Газеты называют вашу марку лучшей в сезоне. Покупатели охотнее выбирают машины победителя.'}\nСпрос на все модели компании вырос на год вперёд.`},true);
    addLog(`🏆 ${C.title(y)}!`,'good');pendingToasts.push('🏆 '+C.title(y));
  }else if(me>=0)addLog(`${C.name(y)} ${y} завершён. Чемпион — ${ch.win||'не определён'}, «${s.company}» — ${me+1}-е место.`,'hist');
  else if(ch.win)addLog(`${C.name(y)} ${y}: чемпионом стала марка ${ch.win}.`,'hist');
}
// Историческая команда-победитель: если вы не вмешиваетесь, история чаще идёт своим чередом
function histWinnerTeam(rc,teams){if(!rc.win)return null;const w=rc.win.toLowerCase();return teams.find(t=>t.mq.some(m=>w.includes(m.toLowerCase())))||null;}
function simDriver(t,rc,hist){if(hist&&rc.win)return rc.win.split(' (')[0].split(',')[0];const d=teamDrivers(t,rc.y).sort((a,b)=>b.sk-a.sk)[0];return d?d.n:'';}
function simRace(s,rc){
  if(s.cres[rc.key])return;
  if(raceWarBlocked(rc,s)){s.cres[rc.key]={x:1};return;}
  const teams=fieldTeams(rc,s,0),hw=histWinnerTeam(rc,teams),dnf=dnfTarget(rc.y,rc.t)*0.9;
  const rows=teams.map(t=>({name:t.n,t,perf:Math.pow(t.str,1.6)*teamBoost(t,rc)*(t===hw?1.12:1)*(0.92+Math.random()*0.16),dnf:t!==hw&&Math.random()<dnf*clamp(1.4-0.4*t.str,0.6,1.3)?1:0}));
  rows.sort((a,b)=>(a.dnf-b.dnf)||(b.perf-a.perf));
  const w=rows[0];
  s.cres[rc.key]={w:w?w.name:'',d:w?simDriver(w.t,rc,w.t===hw):'',me:0,c:w?w.t.c:''};
  champRecord(s,rc,rows);
}
function seasonTick(s){
  if(!s.cres)s.cres={};if(!s.season)s.season={};
  RACES.forEach(rc=>{if((rc.y<s.y||(rc.y===s.y&&rc.m<s.m))&&rc.y>=s.y-1&&!s.cres[rc.key])simRace(s,rc);});
  [s.y-1,s.y].forEach(y=>champsOf(y).forEach(id=>champFinish(s,id,y)));
  if(s.m===0){Object.keys(s.cres).forEach(k=>{if(+k.split('-').pop()<s.y-2)delete s.cres[k];});Object.keys(s.season).forEach(k=>{if(s.season[k].y<s.y-2)delete s.season[k];});}
}
/* ---------- итоги гонки игрока ---------- */
function fmtRaceTime(sec){sec=Math.max(0,sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=Math.floor(sec%60);return h?`${h} ч ${String(m).padStart(2,'0')} мин`:m?`${m} мин ${String(x).padStart(2,'0')} с`:`${(Math.round(sec*10)/10).toFixed(1).replace('.',',')} с`;}
let lastRace=null;
function raceResults(rc,res,mode,info){
  const s=G;if(!s)return;info=info||{};
  const k=rc.km*1000/Math.max(1,info.len||rc.km*1000);   // секунды модели → реальное время на полной дистанции
  const team=res.filter(r=>r.you),fin=team.filter(r=>!r.dnf),best=fin.length?Math.min(...fin.map(r=>r.pos)):0;
  const prize=racePrize(rc);let won=0;
  team.forEach(r=>{if(!r.dnf&&r.pos<=3){r.prize=Math.round(prize*[1,0.5,0.25][r.pos-1]/10)*10;won+=r.prize;}});
  s.cash+=won;
  const major=!!rc.major,rk=bn('raceRep');
  if(best===1)s.rep+=(major?9:5)*rk;else if(best&&best<=3)s.rep+=(major?3:1.5)*rk;else if(best)s.rep+=0.5;else s.rep-=major?2:1;
  s.rep=clamp(s.rep,0,100);
  const bestRow=best?team.find(r=>r.pos===best):team[0],md=bestRow&&bestRow.md&&s.models.find(m=>m.id===bestRow.md.id);
  if(best===1&&md)md.raceBoost=mi(s)+(major?9:6);
  s.raceDone[rc.key]=best||-1;
  s.raceLog.push({y:rc.y,key:rc.key,name:rc.name,model:bestRow?bestRow.label:'',place:best,drv:bestRow?bestRow.drv:'',major,team:team.map(r=>r.dnf?0:r.pos)});
  if(s.raceLog.length>300)s.raceLog.shift();
  const w=res[0];

// Деревья и мелочь рисуются «живописно»: шары листвы с подсветкой как у сферы, мазки листьев, тени под кроной.
// Дома, трибуны и боксы — настоящие 3D-модели (см. 46-models.js), снятые в три четверти со стороны дороги.
const SUNL=(()=>{const v=[-0.55,-0.62,0.56],l=Math.hypot(...v);return v.map(x=>x/l);})(); // на свет: x вправо, y вниз, z к зрителю
const SCEN_PPM=34;
// Шар листвы: мягкая подложка и сотни мазков-листьев; освещение — от бока шара и от положения в кроне (CR — центр и размер кроны)
let CR=null;
function leafBall(c,rnd,x,y,r,base,dens,ry,rough){
  ry=ry||r;const g=c.createRadialGradient(x-r*0.3,y-ry*0.35,r*0.1,x,y,Math.max(r,ry));
  g.addColorStop(0,shade(base,0.1));g.addColorStop(0.65,base);g.addColorStop(1,shade(base,-0.22));
  c.fillStyle=g;c.beginPath();c.ellipse(x,y,r*0.86,ry*0.86,0,0,7);c.fill();
  const n=Math.round(r*ry*(dens||55)*1.25),sz=rough||1;
  for(let i=0;i<n;i++){const a=rnd()*6.283,d=Math.pow(rnd(),0.42)*1.1,dx=Math.cos(a)*d,dy=Math.sin(a)*d,nz=Math.sqrt(Math.max(0,1-Math.min(1,d*d)));
    let lit=dx*SUNL[0]+dy*SUNL[1]+nz*SUNL[2];if(CR){const X=(x+dx*r-CR[0])/CR[2],Y=(y+dy*ry-CR[1])/CR[3];lit=lit*0.55+(-X*0.55-Y*0.62)*0.6;}
    const s=(0.05+rnd()*0.08)*sz;c.fillStyle=shade(base,clamp(lit*0.34-0.04+(rnd()-0.5)*0.16,-0.5,0.45));c.beginPath();c.ellipse(x+dx*r,y+dy*ry,s*1.35,s,rnd()*3,0,7);c.fill();}
}
// Крона из многих шаров: сначала тёмная глубина всей кроны, затем шары снизу вверх — верхние бросают тень на нижние
function crown(c,rnd,cl,base,dens,rough){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;cl.forEach(q=>{const ry=q[3]||q[2];x0=Math.min(x0,q[0]-q[2]);x1=Math.max(x1,q[0]+q[2]);y0=Math.min(y0,q[1]-ry);y1=Math.max(y1,q[1]+ry);});

function trunk(c,rnd,x0,y0,x1,y1,w0,w1,col,bend,marks){

}

    const m={id:G.nextId++,name:nm,e:md.e,g:md.g,c:md.c,k:md.k,b:md.b,t:md.t,w:md.w,paint:md.paint,price:0,plan:'auto',status:'dev',devLeft:devMonths(md),launched:0,stock:0,backlog:0,lastDem:0,lastSold:0,lastMade:0,totalSold:0,made:0,fc:0};
    m.price=Math.round(refPrice(m,G)/10)*10;G.models.push(m);
    addLog(`Начата разработка «${nm}» (${money(dc)}, ${devMonths(md)} мес.).`);closeSheet();tab='models';checkAch();save();render();},
  rdPick:()=>openRD(),
  rdStart:d=>{const [kind,id]=d.k.split(':');const pj=rdProjects(G).find(x=>x.kind===kind&&x.id===id);if(pj&&rdActive(G).length<rdSlots(G)){G.rd.projs.push({...pj,prog:0});addLog(`КБ начало проект: ${pj.name}.`);}closeSheet();save();render();},
  rdStop:d=>{const pj=G.rd.projs[+d.k];if(!pj)return;if(!confirmOnce('rdStop'+(+d.k),'Нажмите ещё раз: сделанное по проекту пропадёт'))return;G.rd.projs.splice(+d.k,1);addLog(`КБ остановило проект: ${pj.name}.`);rerender();},
  rdUp:()=>{const c=rdUpCost(G);if(G.rd.lvl<RD_MAX&&G.cash>=c){G.cash-=c;G.rd.lvl++;addLog(`Конструкторское бюро выросло: «${RD_LV[G.rd.lvl]}», ${G.rd.lvl}-й уровень.`,'good');checkAch();rerender();flushToasts();}},
  fold:d=>{UIF[d.k]=!isOpen(d.k,d.def==='1');if(!sheet.hidden&&draft===null&&sb.querySelector('[data-k="'+d.k+'"]')){const top=sb.scrollTop;openRD();sb.scrollTop=top;return;}rerender();},
  // рынок
  dealers:d=>{const need=Math.round(dealerNeed(d.c,G)),have=dealerCount(G,d.c),mk=G.last&&G.last.mk[d.c],lost=mk&&mk.lostDlr||0,tpNeed=mk&&lost>0.5?Math.ceil(((mk.sold||0)+lost)/dealerTP(G)):0,target=Math.max(need,tpNeed);let n=Math.min(+d.n,target-have);if(n<1)return;const c=n*dealerCost(G);if(n<1||G.cash<c)return;G.cash-=c;const was=dealerCount(G,d.c);G.dealers[d.c]=was+n;if(!was&&d.c!==G.country)addLog(`Открыты первые дилеры: ${COUNTRIES[d.c].name}.`,'good');checkAch();rerender();flushToasts();},
  dealersCut:d=>{const was=dealerCount(G,d.c),n=Math.max(1,Math.round(was*0.2));G.dealers[d.c]=Math.max(d.c===G.country?1:0,was-n);rerender();},
  // окна
  close:()=>closeSheet(),
  choose:d=>{closeSheet();closePaper();resolve(d.k);},
  paperClose:()=>{closePaper();render();},
  paperChoose:()=>{closePaper();},
  reopenPaper:d=>{const p=G.papers[+d.k];if(p)showPaper({...p,deck:p.deck+' · '+p.d,choices:[['Закрыть','close']],act:'paperClose',kicker:p.kicker||'Из архива'},false);},
  menu:()=>{stopAuto();openMenuSheet();},
  help:()=>openHelp(),
  settings:()=>openSettings(),
  legacyInfo:()=>openLegacyInfo(),
  fame:()=>openFame(),
  about:()=>openAbout(),
  saveOpen:()=>openSlots('save'),
  loadOpen:()=>openSlots('load'),
  saveSlot:d=>{if(saveTo(d.k)){toast('Сохранено: слот '+d.k);closeSheet();}else toast('Не удалось сохранить');},
  loadSlot:d=>{if(loadSlot(d.k)){closeSheet();hideMainMenu();tab='plant';shownCash=null;lastDate='';save();render();AU.lastY=null;if(AU.pl&&AU.pl.length)musBuild(true);toast('Загружено: '+(d.k==='auto'?'автосохранение':'слот '+d.k));}},
  toMenu:()=>{if(G)save();closeSheet();closePaper();showMainMenu();},
  continue:()=>{if(loadSlot('auto')){hideMainMenu();tab='plant';shownCash=null;lastDate='';render();if(G.over&&G.final)openFinal();}},
  newgame:()=>{draft=null;stopAuto();openNewGame();},
  pion:d=>{const top=sb.scrollTop,f=document.getElementById('fname');if(f)draft.first=f.value;draft.pioneer=d.v;draft.diff=draft.diff||'normal';draft.country=PIONEERS[d.v].c;draft.company=PIONEERS[d.v].co;const keep=draft;openNewGame();draft=keep;sb.scrollTop=top;},
  country:d=>{const top=sb.scrollTop;draft.country=d.v;draft.company=document.getElementById('cname').value;draft.first=document.getElementById('fname').value;openNewGame();sb.scrollTop=top;},
  diff:d=>{const top=sb.scrollTop;draft.diff=d.v;draft.company=document.getElementById('cname').value;draft.first=document.getElementById('fname').value;openNewGame();sb.scrollTop=top;},
  startgame:()=>{const f=document.getElementById('fname');if(f)draft.first=f.value;newGame(draft.pioneer,draft.country,(draft.company||'').trim(),draft.diff,(draft.first||'').trim());introPapers(G);closeSheet();closePaper();hideMainMenu();tab='plant';shownCash=null;lastDate='';save();render();AU.lastY=null;},
  // звук и управление
  snd:()=>{auInit();AU.on.music=!AU.on.music;AU.paused=false;auApply();musUI();toast(AU.on.music?'Музыка включена':'Музыка выключена');},
  plPrev:()=>{auInit();musNext(-1);},plNext:()=>{auInit();musNext(1);},plPlay:()=>{auInit();musToggle();},plMode:()=>{auInit();musMode();},
  audio:d=>{AU.on[d.k]=!AU.on[d.k];auApply();openSettings();},
  ctlTilt:d=>{AU.on.steer=d.v;AU.on.tilt=d.v==='tilt';auApply();openSettings();}
};
if(typeof RACE_ACT!=='undefined')Object.assign(ACT,RACE_ACT);
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b);});
// Кнопка «Назад» на Android: закрываем окна по очереди
window.androidBack=function(){
  if(R){finishRace(true);return true;}
  if(!PW.hidden){const b=PW.querySelector('.p-btn');if(b)b.click();else closePaper();return true;}
  if(!sheet.hidden){if((G&&G.pending.length)||(draft&&draft.ng&&G&&G.over)||(draft&&draft.lock))return true;closeSheet();return true;}
  if(!MS.hidden)return false;
  if(tab!=='plant'){tab='plant';render();window.scrollTo(0,0);return true;}
  ACT.toMenu();return true;
};

/* ================= BOOT ================= */
if(window.IMG_MANIFEST){Object.assign(IMG,window.IMG_MANIFEST);imgTried=true;}
if(window.MUSIC_MANIFEST){AU.tracks=window.MUSIC_MANIFEST;}
loadImages();
showMainMenu();
</script>
