<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Автоимперия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@900&family=UnifrakturMaguntia&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#0d2136; --panel:#122d4a; --panel2:#0f2740; --line:#2a5178; --line-soft:#1d3d5e;
  --text:#e6eef7; --muted:#8ea8c3; --brass:#d9ab52; --brass-ink:#1c1406;
  --good:#74d39a; --bad:#ff8474; --warn:#f0c75e;
  --paper:#ece2c8; --ink:#221c14;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Old Standard TT",Georgia,"Times New Roman",serif;
}
html,body{height:100%}
body{margin:0;color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;background-color:var(--bg);
  background-image:linear-gradient(rgba(142,168,195,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(142,168,195,.06) 1px,transparent 1px);
  background-size:24px 24px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 190px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--bg) 82%,rgba(13,33,54,0));margin-inline:-16px;padding:12px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.co{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.date{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.01em;display:inline-block}
.date span{color:var(--brass)}
.date.flip{animation:flip .45s ease-out}
@keyframes flip{0%{transform:perspective(300px) rotateX(-80deg);opacity:.2}100%{transform:none;opacity:1}}
.cash{text-align:right}
.cash b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.cash b.neg{color:var(--bad)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:50%;width:30px;height:30px;color:var(--muted);cursor:pointer;flex:none;padding:0}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row+.row{margin-top:10px}
.hr{height:1px;background:var(--line-soft);margin-block:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kpi{background:var(--panel2);padding:10px 12px}
.kpi b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-size:17px;margin:0;font-weight:600}
p{margin:0}
.small{font-size:13px}
.btn{background:transparent;border:1px solid var(--line);border-radius:5px;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:600}
.btn.block{width:100%;padding:12px}
.btn.sm{padding:5px 9px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.step button{background:var(--panel2);border:0;width:38px;height:36px;font-size:18px;cursor:pointer}
.step span{min-width:84px;text-align:center;font-family:var(--mono);font-size:15px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.bar{height:8px;background:var(--panel2);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line-soft)}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .5s ease}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.meta div{font-size:12px;color:var(--muted)}
.meta b{display:block;font-family:var(--mono);font-weight:500;font-size:15px;color:var(--text)}
.spec{font-size:13px;color:var(--muted);margin-top:4px}
.spark{width:100%;height:64px;display:block;margin-top:8px}
.spark .zero{stroke:var(--bad);stroke-dasharray:3 3;stroke-width:1;vector-effect:non-scaling-stroke}
.empty-chart{font-size:13px;color:var(--muted);padding:18px 0;text-align:center;border:1px dashed var(--line-soft);border-radius:4px;margin-top:8px}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=text]{width:100%;box-sizing:border-box;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px;font:inherit;color:var(--text)}
.scene{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0a1a2b}
.scene svg{display:block;width:100%;height:auto}
.carbox{background:linear-gradient(180deg,rgba(142,168,195,.05),rgba(142,168,195,.12));border:1px solid var(--line-soft);border-radius:5px;margin-top:10px;overflow:hidden}
.carbox svg{display:block;width:100%;height:auto;max-height:130px}
.car .spin{animation:spin .7s linear infinite;animation-play-state:paused}
.car.anim .spin{animation-play-state:running}
.car.anim .body{animation:bob .35s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{to{transform:translateY(-.8px)}}
.carbox.enter svg{animation:enter .7s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{transform:translateX(-60%)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 3.2s linear infinite}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:.75}100%{transform:translate(14px,-30px) scale(2);opacity:0}}
.roadcar{animation:drive 9s linear infinite}
@keyframes drive{from{transform:translateX(-50px)}to{transform:translateX(420px)}}
.roadcar .w{transform-box:fill-box;transform-origin:center;animation:spin .5s linear infinite}
.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(10,26,43,.97);border-top:1px solid var(--line);padding:10px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.bar-nav .in{max-width:560px;margin:0 auto}
.next{display:flex;align-items:stretch;gap:8px}
.next .btn.primary{flex:1;padding:13px;font-size:16px}
.next .btn.q{padding:0 12px;min-width:46px}
.next .btn.q.on{border-color:var(--brass);color:var(--brass)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);margin-top:8px}
.tab{background:none;border:0;padding:6px 0;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab.on{color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:7;background:var(--panel);border:1px solid var(--brass);border-radius:99px;padding:8px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.4);white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{animation:toast 2.2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(4,12,22,.75);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 10px;font-size:13px;cursor:pointer;text-align:left}
.chip small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on{border-color:var(--brass);background:rgba(217,171,82,.14)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{border-color:var(--brass);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--brass)}
.country{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.country .chip{padding:10px}
.pion{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;text-align:left;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;cursor:pointer}
.pion.on{border-color:var(--brass);background:rgba(217,171,82,.12)}
.pion svg{width:64px;height:80px;display:block}
.pion h3{font-size:16px}
.pion .yrs{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pion p{font-size:13px;color:var(--muted);margin-top:4px}
.bon{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bon span{font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:4px;border:1px solid var(--line-soft)}
.bon .p{color:var(--good);border-color:rgba(116,211,154,.4)} .bon .m{color:var(--bad);border-color:rgba(255,132,116,.4)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.log li time{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.log li.good p{color:var(--good)} .log li.bad p{color:var(--bad)} .log li.hist p{color:var(--brass)}
.tech{display:grid;grid-template-columns:48px 1fr auto;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line-soft)}
.tech.off{color:var(--muted);opacity:.6}
.tech .num{color:var(--muted)}
table.pl{width:100%;border-collapse:collapse;font-size:14px}
table.pl td{padding:4px 0}
table.pl td:last-child,table.pl th:last-child{text-align:right}
table.pl td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.pl th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;text-align:left;padding-bottom:6px}
table.pl th.n{text-align:right}
table.pl tr.tot td{border-top:1px solid var(--line-soft);padding-top:8px;font-weight:600}
.comp{display:grid;grid-template-columns:44px 1fr 80px 40px;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.comp .dot{width:12px;height:12px;border-radius:50%;margin-left:16px}
.comp small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.comp.you{color:var(--brass);font-weight:600}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.ach div{border:1px solid var(--line-soft);border-radius:5px;padding:8px 10px;font-size:12px;color:var(--muted)}
.ach div b{display:block;font-size:13px;color:var(--muted)}
.ach div.got{border-color:var(--brass)}
.ach div.got b{color:var(--brass)}
.race-item{padding:10px 0;border-bottom:1px solid var(--line-soft)}
.race-item:last-child{border-bottom:0}
.race-item .mo{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist{font-family:var(--serif);font-size:15px;line-height:1.5;color:#d9d2c0;border-left:2px solid var(--brass);padding-left:12px;margin-top:10px}

/* photos */
.ph-oval{width:64px;height:80px;border-radius:50%;overflow:hidden;border:3px solid var(--brass);box-sizing:border-box;background:#5a5048}
.ph-oval img{width:100%;height:100%;object-fit:cover;filter:sepia(.35) contrast(1.05)}
.thumb{width:44px;height:32px;border-radius:3px;object-fit:cover;display:block;filter:sepia(.25)}
.photo{position:relative;margin-top:10px;border-radius:5px;overflow:hidden;border:1px solid var(--line-soft)}
.photo img{display:block;width:100%;max-height:220px;object-fit:cover;filter:sepia(.3) contrast(1.05)}
.credit{display:block;font-size:10px;font-family:var(--mono);color:var(--muted);text-decoration:none;padding:3px 6px}
.photo .credit{position:absolute;right:0;bottom:0;background:rgba(0,0,0,.55);color:#ddd}
.p-fig img{display:block;width:100%;max-height:260px;object-fit:cover;filter:grayscale(1) sepia(.4) contrast(1.25)}
.p-fig .credit{color:var(--ink);text-align:right;background:transparent}
/* newspaper */
.paperwrap{position:fixed;inset:0;z-index:15;background:rgba(3,8,14,.82);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;overflow:auto}
.paper{background:var(--paper);color:var(--ink);width:100%;max-width:520px;max-height:100%;overflow:auto;box-sizing:border-box;padding:18px 18px 16px;font-family:var(--serif);box-shadow:0 20px 60px rgba(0,0,0,.6);
  background-image:radial-gradient(rgba(120,90,40,.08) 1px,transparent 1.2px),radial-gradient(rgba(60,40,10,.06) 1px,transparent 1.4px),linear-gradient(90deg,rgba(0,0,0,.05),transparent 8%,transparent 92%,rgba(0,0,0,.06));
  background-size:7px 7px,11px 11px,100% 100%}
.paper.spin{animation:paperIn .9s cubic-bezier(.2,.7,.2,1)}
@keyframes paperIn{0%{transform:rotate(-540deg) scale(.05);opacity:0}70%{opacity:1}100%{transform:none}}
.p-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:4px}
.p-mast{font-family:"Playfair Display",var(--serif);font-weight:900;font-size:clamp(28px,8vw,44px);text-align:center;line-height:1.05;margin:8px 0 6px;letter-spacing:.01em}
.p-mast.frak{font-family:"UnifrakturMaguntia",var(--serif);font-weight:400}
.p-rule{border-top:3px double var(--ink);border-bottom:1px solid var(--ink);height:3px;margin-bottom:8px}
.p-kick{font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-weight:700}
.p-head{font-family:"Playfair Display",var(--serif);font-weight:900;font-size:clamp(24px,6.5vw,34px);line-height:1.08;text-align:center;margin:6px 0;text-wrap:balance}
.p-deck{font-style:italic;text-align:center;font-size:15px;border-bottom:1px solid var(--ink);padding-bottom:8px}
.p-fig{margin:10px 0 4px;border:1px solid var(--ink);background:#e4d8b8}
.p-fig svg{display:block;width:100%;height:auto;filter:grayscale(1) sepia(.35) contrast(1.35)}
.p-cap{font-size:11px;font-style:italic;text-align:center;margin-bottom:8px}
.p-cols{columns:2 190px;column-gap:16px;column-rule:1px solid rgba(34,28,20,.4);font-size:14.5px;line-height:1.45;text-align:justify;hyphens:auto}
.p-cols p{margin:0 0 8px}
.p-cols p.lead::first-letter{float:left;font-family:"Playfair Display",var(--serif);font-weight:900;font-size:44px;line-height:.85;padding:4px 6px 0 0}
.p-side{border-top:1px solid var(--ink);margin-top:8px;padding-top:6px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p-side b{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.p-btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.p-btn{font-family:var(--sans);background:var(--ink);color:var(--paper);border:0;border-radius:4px;padding:12px;font-size:15px;font-weight:600;cursor:pointer}
.p-btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ink)}

/* race screen */
#raceScreen{position:fixed;inset:0;z-index:20;background:#070f18;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#raceScreen[hidden]{display:none!important}
.r-hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.r-hud b{display:block;color:var(--text);font-size:16px;font-weight:500}
.r-bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 8px;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em}
.r-bars .bar{margin-top:3px;height:6px}
#rcv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
.r-msg{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-weight:800;font-size:46px;color:var(--brass);text-shadow:0 3px 12px rgba(0,0,0,.7);pointer-events:none}
.r-ctrl{display:grid;grid-template-columns:1fr 1fr 12px 1fr 1.3fr;gap:8px;padding:10px 12px;touch-action:none;user-select:none;-webkit-user-select:none}
.r-ctrl button{height:84px;border-radius:12px;border:2px solid var(--line);background:rgba(142,168,195,.08);font-family:var(--display);font-weight:800;font-size:22px;color:var(--text);touch-action:none;cursor:pointer}
.r-ctrl button.down{background:var(--brass);border-color:var(--brass);color:var(--brass-ink)}
.r-ctrl .gas{border-color:var(--brass);color:var(--brass)}
.r-ctrl .brk{border-color:#8a4a44;color:var(--bad)}
.r-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 0}
.r-top .label{color:var(--brass)}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.car .spin,.smoke,.roadcar,.roadcar .w,.car.anim .body,.date.flip,.carbox.enter svg,.paper.spin{animation:none!important}}
@media (max-width:380px){.meta{grid-template-columns:repeat(2,1fr)}.date{font-size:28px}.r-ctrl button{height:72px}}
</style>

<div class="wrap">
  <header class="top">
    <div><div class="co" id="co"></div><div class="date" id="date"></div></div>
    <div class="row" style="align-items:flex-end">
      <div class="cash"><span class="label">Касса</span><b id="cash"></b></div>
      <button class="iconbtn" data-act="help" aria-label="Меню и правила">?</button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>
<div class="toast" id="toast" hidden></div>
<nav class="bar-nav">
  <div class="in">
    <div class="next">
      <button class="btn primary" id="nextBtn" data-act="next">Следующий месяц</button>
      <button class="btn q" id="qBtn" data-act="quarter" aria-label="Три месяца подряд">×3</button>
      <button class="btn q" id="autoBtn" data-act="auto" aria-label="Автоигра">▶</button>
    </div>
    <div class="tabs">
      <button class="tab" data-act="tab" data-t="plant"><svg viewBox="0 0 24 24"><path d="M3 21V10l6 4V10l6 4V6h6v15z"/></svg>Завод</button>
      <button class="tab" data-act="tab" data-t="models"><svg viewBox="0 0 24 24"><path d="M3 15h18v3H3zM5 15l2-5h9l3 5"/><circle cx="7" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></svg>Модели</button>
      <button class="tab" data-act="tab" data-t="market"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 17V11M11 17V7M16 17v-4M20 17V9"/></svg>Рынок</button>
      <button class="tab" data-act="tab" data-t="race"><svg viewBox="0 0 24 24"><path d="M5 21V4M5 4h13l-2 4 2 4H5"/></svg>Гонки</button>
      <button class="tab" data-act="tab" data-t="log"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5zM8 9h8M8 13h8M8 17h5"/></svg>Хроника</button>
    </div>
  </div>
</nav>

/* ================= MODEL ================= */
let G=null,tab='plant',draft=null,auto=null;
const T=s=>(s.y-1895)+s.m/12;
const mi=s=>(s.y-1895)*12+s.m;
const dstr=s=>MONTHS[s.m]+' '+s.y;
const unlocked=(arr,s)=>arr.filter(x=>x.y<=s.y);
const isTruck=md=>!!byId(BODIES,md.b).truck;
const segOf=md=>isTruck(md)?'truck':md.t==='t0'?'people':md.t==='t1'?'middle':'lux';
function PB(){return (G&&PIONEERS[G.pioneer]||PIONEERS.custom).b;}
function bn(k,d=1){const b=PB();return b[k]!==undefined?b[k]:d;}
function segBonus(g){const b=PB();return b.seg&&b.seg[g]||1;}
function priceIndex(s){const t=T(s);return t<13?1-0.012*t:Math.max(0.42,0.844-0.03*(t-13));}
function bestQ(arr,y,f){const a=arr.filter(x=>x.y<=y&&(!f||f(x)));return a.length?Math.max(...a.map(x=>x.q)):0;}
function eraBest(s,truck){let b=bestQ(BODIES,s.y,x=>!!x.truck===!!truck);if(!b)b=bestQ(BODIES,s.y,x=>!x.truck);return bestQ(ENGINES,s.y)+bestQ(CHASSIS,s.y)+b+12;}
const parts=md=>({e:byId(ENGINES,md.e),c:byId(CHASSIS,md.c),b:byId(BODIES,md.b),t:byId(TRIMS,md.t)});
function overpower(md){const p=parts(md);return p.e.hp>p.c.max*bn('chassisTol');}
function modelQ(md){const p=parts(md);const q=p.e.q+p.c.q+p.b.q+p.t.q;return (overpower(md)?q*0.6:q)*bn('quality');}
function modelR(md,s){return Math.min(1.15,modelQ(md)/eraBest(s,isTruck(md)));}
function baseCost(md){const p=parts(md);return p.e.c+p.c.c+p.b.c+p.t.c;}
function matCost(md,s){return baseCost(md)*priceIndex(s)*bn('matCost');}
function stdLabor(s){return COUNTRIES[s.country].wage*(1+0.02*T(s))/(mi(s)>=(1915-1895)*12?2.4:0.8);}
function refPrice(md,s){const mk=1.22-0.12*Math.min(1,T(s)/30);return mk*(baseCost(md)*priceIndex(s)+stdLabor(s))*(0.7+0.3*modelR(md,s))*SEG[segOf(md)].prem;}
function isWar(y,m,c){
  if(c==='us')return (y===1917&&m>=3)||(y===1918&&m<=10);
  if(c==='it')return (y===1915&&m>=4)||(y>=1916&&y<=1917)||(y===1918&&m<=10);
  return (y===1914&&m>=7)||(y>=1915&&y<=1917)||(y===1918&&m<=10);
}
function econ(y,m,c){
  let f=1,label='Стабильно',tone='good';const war=isWar(y,m,c);
  if(c==='uk'&&(y<1896||(y===1896&&m<10))){f*=0.45;label='Закон о красном флаге';tone='warn';}
  if(war){label='Война';tone='bad';}
  if(y===1919||y===1920){f*=1.3;label='Послевоенный бум';tone='good';}
  if(y===1921){f*=0.75;label='Спад';tone='warn';}
  if(y===1923&&c==='de'){f*=0.35;label='Гиперинфляция';tone='bad';}
  if(y>=1924&&y<=1928){f*=c==='us'?1.25:1.1;label='Ревущие двадцатые';tone='good';}
  if(y===1929&&m>=9){f*=0.55;label='Биржевой крах';tone='bad';}
  return {f,label,tone,war};
}
function segShares(s){const t=T(s);let truck=s.y<1900?0:0.05+Math.min(0.10,t*0.004);const people=0.40+(t>13?Math.min(0.15,(t-13)*0.015):0),lux=0.20-(t>13?Math.min(0.1,(t-13)*0.01):0);return {people,middle:1-people-lux-truck,lux,truck};}
function marketSize(s,c){return 40*Math.exp(0.13*T(s))*COUNTRIES[c].market*econ(s.y,s.m,c).f;}
function segSize(s,c,g){const e=econ(s.y,s.m,c);let z=marketSize(s,c)*segShares(s)[g];if(e.war)z*=g==='truck'?1.3:(c==='us'?0.5:0.2);return z;}
function totalSize(s,c){return SEGK.reduce((a,g)=>a+segSize(s,c,g),0);}
function adRef(s){return 300*(1+T(s)*0.15);}
function appeal(md,s,c){
  const g=segOf(md),S=SEG[g],r=modelR(md,s),pr=Math.pow(refPrice(md,s)/md.price,S.el);
  const adF=1+0.8*(1-Math.exp(-s.ad*bn('adEff')/adRef(s))),repF=0.6+s.rep/100*0.8;
  const age=mi(s)-md.launched,nov=age<12?1.2:(age>96?0.8:1),rb=(md.raceBoost||0)>mi(s)?1.25:1;
  return Math.pow(0.2+r,S.qe)*pr*adF*repF*nov*rb*segBonus(g)*(c===s.country?1:0.8);
}
function massOn(cp,s,c){return cp.mass&&mi(s)>=(c==='us'?(1908-1895)*12+9:(1910-1895)*12);}
function compR(cp,s,g){const y=s.y-cp.lag,truck=g==='truck';const b=bestQ(BODIES,y,x=>!!x.truck===truck);if(!b)return 0;const q=bestQ(ENGINES,y)+bestQ(CHASSIS,y)+b+(g==='middle'?6:g==='lux'?12:0);return Math.min(1.05,q/eraBest(s,truck));}
function compA(cp,s,g,c){if(!cp.alive||!cp.segs.includes(g))return 0;const r=compR(cp,s,g);if(!r)return 0;const m=massOn(cp,s,c)&&g==='people';const S=SEG[g];const n=s.comps[c].filter(x=>x.alive&&x.segs.includes(g)).length;return Math.pow(0.2+r,S.qe)*Math.pow(1/(cp.pm*(m?0.75:1)),S.el)*cp.str*(m?2.5:1)*0.9*Math.min(1,2.2/Math.max(1,n));}
function compModel(cp,s){let m=null;(cp.models||[]).forEach(x=>{if(x[0]<=s.y)m=x;});return m;}
function lastOf(arr,y,f){const a=arr.filter(x=>x.y<=y&&(!f||f(x)));return a[a.length-1];}
function compCar(cp,s,g){const y=s.y-cp.lag,truck=g==='truck';return {e:lastOf(ENGINES,y).id,c:lastOf(CHASSIS,y).id,b:(lastOf(BODIES,y,x=>!!x.truck===truck)||BODIES[0]).id,t:g==='lux'?'t2':g==='middle'?'t1':'t0',paint:cp.color};}
function lineCost(s){return Math.round(6000*(1+0.03*T(s))*bn('lineCost')/100)*100;}
function branchCost(s){return Math.round(15000*(1+0.03*T(s))/100)*100;}
function perLine(s){return (s.conveyor?30:8)*bn('lineCap');}
function perWorker(s){return (s.conveyor?2.4:0.8)*bn('workerEff');}
function capParts(s){const byLines=Math.floor(s.lines*perLine(s)),byWorkers=Math.floor(s.workers*perWorker(s));return {byLines,byWorkers,cap:Math.min(byLines,byWorkers)};}
function idealWorkers(s){return Math.ceil(s.lines*perLine(s)/perWorker(s));}
function maxLoan(s){return 20000+s.lines*6000;}
function devCost(md){return Math.round((2000+modelQ(md)*70)*bn('devCost')/100)*100;}
function devMonths(md){return Math.max(1,Math.round((2+Math.ceil(modelQ(md)/30))*bn('devTime')));}
function convMonth(){return (1913-1895)*12+9-bn('convEarly',0);}
function conveyorOpen(s){return mi(s)>=convMonth();}
function qLabel(r){return r<0.45?['Устарела','bad']:r<0.8?['Средняя','warn']:['Передовая','good'];}
function wageNow(s){return COUNTRIES[s.country].wage*(1+0.02*T(s))*s.wageMul;}
function totalSold(s){return s.models.reduce((a,m)=>a+m.totalSold,0);}
function addLog(text,kind=''){G.log.push({d:dstr(G),text,kind});if(G.log.length>400)G.log.shift();}

function raceEligible(r,s){return r.c==='intl'||r.c===s.country||s.branches.includes(r.c);}
function raceWarBlocked(r,s){return r.c==='intl'?isWar(s.y,s.m,s.country)&&s.country!=='us':isWar(r.y,r.m,r.c);}
function raceOpen(r,s){return r.y===s.y&&(s.m===r.m||s.m===r.m-1);}
function racePrize(r){const mul={road:1.2,circuit:1,endurance:1.3,hill:0.6,rally:1.5,oval:1.1}[r.t]*(r.c==='intl'?1.3:1);return Math.round(3000*(1+(r.y-1895)*0.12)*mul/100)*100;}

function step(){
  const s=G;if(!s||s.over||s.pending.length)return false;
  const t=T(s),markets=[s.country,...s.branches],eHome=econ(s.y,s.m,s.country);
  const r={rev:0,mat:0,wage:0,upk:0,br:0,ad:s.ad,sto:0,int:0,mil:0,milN:0,made:0,sold:0,demand:0,homeSold:0,mk:{}};
  s.models.forEach(md=>{if(md.status==='dev'){md.devLeft--;if(md.devLeft<=0){md.status='prod';md.launched=mi(s);md.fresh=1;addLog(`Модель «${md.name}» пошла в серию.`,'good');}}});
  const act=s.models.filter(md=>md.status==='prod');
  const dem={};act.forEach(md=>dem[md.id]={});
  s.comps[s.country].forEach(cp=>cp.last=0);
  markets.forEach(c=>{
    const M={size:0,sold:0,segs:{}};r.mk[c]=M;
    SEGK.forEach(g=>{
      const z=segSize(s,c,g);M.size+=z;M.segs[g]={size:z,you:0};
      const pm=act.filter(md=>segOf(md)===g),pa=pm.map(md=>appeal(md,s,c)),ca=s.comps[c].map(cp=>compA(cp,s,g,c));
      const tot=pa.reduce((a,b)=>a+b,0)+ca.reduce((a,b)=>a+b,0)+OTHER;
      pm.forEach((md,i)=>{dem[md.id][c]=Math.max(0,Math.round(z*pa[i]/tot*(0.85+Math.random()*0.3)));});
      if(c===s.country)s.comps[c].forEach((cp,i)=>{cp.last+=z*ca[i]/tot;});
    });
  });
  let cap=capParts(s).cap;const strike=s.strikeNext;if(strike){cap=Math.floor(cap/2);s.strikeNext=false;}
  let milCap=0;if(eHome.war&&s.military&&act.length){milCap=Math.floor(cap*0.4);cap-=milCap;}
  const tdem=act.map(md=>Object.values(dem[md.id]).reduce((a,b)=>a+b,0));
  const need=act.map((md,i)=>Math.max(0,Math.ceil(tdem[i]*1.3)+2-md.stock));
  const totNeed=need.reduce((a,b)=>a+b,0),k=totNeed>cap?cap/totNeed:1;
  const shock=s.supplyNext;s.supplyNext=1;
  act.forEach((md,i)=>{
    const made=Math.floor(need[i]*k);md.stock+=made;md.lastMade=made;r.made+=made;r.mat+=made*matCost(md,s)*shock;
    const f=tdem[i]>0?Math.min(1,md.stock/tdem[i]):0;let sold=0;const g=segOf(md);
    for(const c in dem[md.id]){const so=Math.floor(dem[md.id][c]*f);sold+=so;r.mk[c].sold+=so;r.mk[c].segs[g].you+=so;if(c===s.country)r.homeSold+=so;}
    md.stock-=sold;md.lastDem=tdem[i];md.lastSold=sold;md.totalSold+=sold;r.sold+=sold;r.demand+=tdem[i];r.rev+=sold*md.price;
  });
  if(milCap>0){const trucks=act.filter(isTruck),pool=trucks.length?trucks:act;const cheap=pool.reduce((a,b)=>matCost(a,s)<matCost(b,s)?a:b),mc=matCost(cheap,s);r.mat+=milCap*mc*shock;r.mil=milCap*mc*(trucks.length?1.6:1.35);r.milN=milCap;r.made+=milCap;}
  r.wage=s.workers*wageNow(s);r.upk=s.lines*120*(s.conveyor?2:1)*(1+0.02*t);r.br=s.branches.length*400*(1+0.02*t);
  r.sto=s.models.reduce((a,md)=>a+md.stock,0)*4;r.int=s.loan*0.01;
  r.profit=r.rev+r.mil-r.mat-r.wage-r.upk-r.br-r.ad-r.sto-r.int;
  s.cash+=r.profit;
  if(r.sold>0){let wr=0,op=0;act.forEach(md=>{wr+=modelR(md,s)*md.lastSold;if(overpower(md)&&md.lastSold>0)op=1;});wr/=r.sold;s.rep+=(wr-0.55)*4-op*2;}else s.rep-=0.3;
  s.rep=clamp(s.rep,0,100);
  const hs=r.mk[s.country].size;r.size=hs;r.share=hs>0?r.homeSold/hs:0;r.label=dstr(s);s.last=r;
  const H=s.hist;H.cash.push(s.cash);H.sales.push(r.sold);H.market.push(Math.round(hs));H.profit.push(r.profit);
  for(const k2 in H)if(H[k2].length>420)H[k2].shift();
  if(strike)addLog('Забастовка: выпуск упал вдвое.','bad');
  s.m++;

  else checkEvents();
  return true;
}

const IMG={};let imgTried=false;
function allTitles(){const t=new Set();Object.values(PIONEERS).forEach(p=>p.wiki&&t.add(p.wiki));Object.values(COMPS).flat().forEach(c=>c.models.forEach(m=>m[2]&&t.add(m[2])));

async function loadImages(){
  if(imgTried)return;imgTried=true;
  try{const c=JSON.parse(localStorage.getItem('avt-img')||'null');if(c&&c.v===1&&Date.now()-c.t<7*864e5){Object.assign(IMG,c.map);return;}}catch(e){}
  try{
    const titles=allTitles(),map={};
    for(let i=0;i<titles.length;i+=40){
      const chunk=titles.slice(i,i+40);
      const url='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail|name&pithumbsize=480&titles='+encodeURIComponent(chunk.join('|'));
      const j=await fetch(url).then(r=>r.json());const q=j.query||{};const alias={};
      (q.normalized||[]).forEach(n=>alias[n.to]=(alias[n.to]||[]).concat(n.from));
      (q.redirects||[]).forEach(n=>{alias[n.to]=(alias[n.to]||[]).concat(n.from,...(alias[n.from]||[]));});
      Object.values(q.pages||{}).forEach(pg=>{
        if(!pg.thumbnail||!pg.pageimage)return;
        if(!/\/wikipedia\/commons\//.test(pg.thumbnail.source))return;
        if(/logo|map|layout|circuit|coat_of_arms|flag|emblem|\.svg$/i.test(pg.pageimage))return;
        const v={src:pg.thumbnail.source,file:pg.pageimage};map[pg.title]=v;(alias[pg.title]||[]).forEach(a=>map[a]=v);
      });
    }
    Object.assign(IMG,map);
    try{localStorage.setItem('avt-img',JSON.stringify({v:1,t:Date.now(),map}));}catch(e){}
    if(G)render();
  }catch(e){}
}

  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${y(min)} ${pts} ${w},${y(min)}" fill="${color}" fill-opacity=".14"/>${zero}<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;

  if(raceWarBlocked(rc,s))return ['Отменена: война','bad',false];

/* ================= RACE ENGINE (pseudo-3D) ================= */
const SEGL=200,ROADW=2000,CAMH=1000,CAMD=1/Math.tan(50*Math.PI/180),DRAW=150,TOPV=SEGL*60,PLZ=CAMH*CAMD;
const TERR={
  dirt:{road:'#b39a6b',road2:'#a88f60',g:'#6f8f4a',g2:'#678747',edge:'#8d774f',edge2:'#8d774f',line:null,sky:['#8fbbe0','#dfeaf2'],hill:'#8aa66d'},
  asphalt:{road:'#5b5e63',road2:'#56595e',g:'#5f8a45',g2:'#588240',edge:'#c23b33',edge2:'#eeeeee',line:'#e8e8e8',sky:['#6aa6d6','#d6e9f5'],hill:'#7f9f68'},
  brick:{road:'#9a4c35',road2:'#904631',g:'#5f8a45',g2:'#588240',edge:'#eeeeee',edge2:'#333333',line:null,sky:['#6aa6d6','#d6e9f5'],hill:'#7f9f68'},
  concrete:{road:'#a7a59e',road2:'#9f9d96',g:'#5f8a45',g2:'#588240',edge:'#7a7872',edge2:'#7a7872',line:null,sky:['#9fb8cc','#e3e9ee'],hill:'#8ea07a'},
  snow:{road:'#d5dae0',road2:'#ccd2d9',g:'#f1f4f7',g2:'#e7ebf0',edge:'#aab2bc',edge2:'#aab2bc',line:null,sky:['#9aa8b6','#e5e9ee'],hill:'#dfe5ec'},
  mud:{road:'#6b5033',road2:'#62492e',g:'#556b3a',g2:'#4e6436',edge:'#4a3a26',edge2:'#4a3a26',line:null,sky:['#7e8a92','#c6ccd0'],hill:'#6c7d57'},
  sand:{road:'#d8b979',road2:'#cfb070',g:'#e3c78b',g2:'#dcc083',edge:'#c29d5c',edge2:'#c29d5c',line:null,sky:['#7fb3dc','#f1e3c2'],hill:'#d7b77c'},
  mount:{road:'#9c8a6c',road2:'#948264',g:'#8a8f5a',g2:'#838853',edge:'#6f6450',edge2:'#6f6450',line:null,sky:['#5f9bd0','#f0e2c4'],hill:'#a7996f'}
};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const easeIn=(a,b,p)=>a+(b-a)*p*p,easeIO=(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5);
function trackCfg(rc){
  const early=rc.y<1910;
  let c={laps:1,len:3000,curvy:0.35,hilly:0.3,straight:0.45,crowd:0.25,terr:early?'dirt':'asphalt',pits:false,dusty:early,night:false,uphill:false,oval:false,town:true};
  if(rc.t==='circuit')Object.assign(c,{laps:3,len:1000,curvy:0.5,hilly:0.3,straight:0.35,pits:true,town:false});
  if(rc.t==='endurance')Object.assign(c,{laps:4,len:900,curvy:0.35,straight:0.55,pits:true,night:true,town:false,dusty:false});
  if(rc.t==='hill')Object.assign(c,{len:1800,curvy:1,hilly:0.2,straight:0.1,uphill:true,terr:'mount',town:false,crowd:0.15});
  if(rc.t==='rally')Object.assign(c,{len:3000,curvy:0.45,hilly:0.5,straight:0.35,stages:['snow','mud','sand'],crowd:0.05,town:true});
  if(rc.t==='oval')Object.assign(c,{laps:4,len:700,oval:true,pits:true,town:false,dusty:false,crowd:0.5,terr:rc.y<1920?'concrete':'asphalt'});
  if(rc.track==='indy')c.terr='brick';
  if(rc.track==='monza')Object.assign(c,{curvy:0.25,straight:0.6});
  if(rc.track==='nurb')Object.assign(c,{curvy:0.85,hilly:0.9,straight:0.15});
  if(rc.track==='monaco')Object.assign(c,{curvy:1,hilly:0.2,straight:0.1,town:true,crowd:0.6,len:800});
  if(rc.track==='lemans')Object.assign(c,{straight:0.7,curvy:0.3});
  if(rc.track==='targa')Object.assign(c,{curvy:0.9,hilly:0.8,terr:'mount',straight:0.15});
  if(rc.crowd)c.crowd=0.7;
  if(rc.terr){c.terr=rc.terr;if(c.stages)c.stages=[rc.terr,'mud',rc.terr];}
  return c;
}
function buildTrack(rc){
  const cfg=trackCfg(rc),rnd=mulberry32(hashStr(rc.key)),S=[];
  const terrAt=p=>cfg.stages?cfg.stages[Math.min(2,Math.floor(p*3))]:cfg.terr;
  const lastY=()=>S.length?S[S.length-1].p2.w.y:0;
  const add=(curve,y)=>{const n=S.length;S.push({i:n,p1:{w:{y:lastY(),z:n*SEGL},c:{},s:{}},p2:{w:{y,z:(n+1)*SEGL},c:{},s:{}},curve,terr:terrAt(n/cfg.len),sp:[],clip:0});};
  const road=(e,h,l,curve,dy)=>{const sy=lastY(),ey=sy+dy*SEGL,t=e+h+l;let k=0;for(let n=0;n<e;n++,k++)add(easeIn(0,curve,n/e),easeIO(sy,ey,k/t));for(let n=0;n<h;n++,k++)add(curve,easeIO(sy,ey,k/t));for(let n=0;n<l;n++,k++)add(easeIO(curve,0,n/l),easeIO(sy,ey,k/t));};
  road(10,50,10,0,0);
  if(cfg.oval){const q=Math.round(cfg.len/4);for(let k=0;k<2;k++){road(10,q-40,10,0,0);road(20,q-60,20,3.4,0);}}
  else{
    while(S.length<cfg.len-140){
      const L=[20,35,50,75][Math.floor(rnd()*4)],straight=rnd()<cfg.straight;
      const curve=straight?0:(rnd()<0.5?-1:1)*(1.5+rnd()*4.5*cfg.curvy);
      let dy=(rnd()*2-1)*cfg.hilly*50;if(cfg.uphill)dy=Math.abs(dy)*0.4+22;
      road(Math.round(L*0.3),L,Math.round(L*0.3),curve,dy);
    }
    if(cfg.laps>1)road(30,40,30,0,-lastY()/SEGL);else road(30,90,30,0,cfg.uphill?10:0);
  }
  const N=S.length,finishSeg=cfg.laps>1?2:N-60;
  const sp=(i,type,off,solid)=>{if(S[i])S[i].sp.push({type,off,solid});};
  for(let i=0;i<N;i++){
    const tr=S[i].terr,p=i/N,town=cfg.town&&((Math.floor(i/700)%2===1&&i%700<90)||rc.track==='monaco');
    if(town&&i%6===0){sp(i,'house',-(1.9+rnd()*0.4),true);sp(i,'house',1.9+rnd()*0.4,true);}
    else if(i%7===0){const side=rnd()<0.5?-1:1,t=tr==='sand'?'rock':tr==='snow'||tr==='mount'?'pine':'tree';sp(i,t,side*(1.5+rnd()*1.6),true);if(rnd()<0.5)sp(i,t,-side*(1.6+rnd()*1.8),true);}

const rKeys={left:false,right:false,gas:false,brake:false};

  const me={player:true,name:s.company,label:md.name,car:md,dist:0,x:0,v:0,vmax,accel:vmax/4.5*(1-gear*0.22),heat:0,tyre:0,fuel:100,broken:0,punct:false,fin:null,

function rMsg(t,dur=1.6){R.msg=t;R.msgT=dur;}
function raceLoop(now){

  if(R.t>0){R.time+=dt;updateRace(dt);}
  drawRace();

function segAt(dist){const T=R.trk;return T.S[Math.floor(((dist%T.len)+T.len)%T.len/SEGL)%T.N];}
function updateRace(dt){
  const me=R.me,T=R.trk,cfg=T.cfg;

  if(R.pitT>0){R.pitT-=dt;me.v=Math.max(0,me.v-me.vmax*2*dt);if(R.pitT<=0){me.tyre=0;me.punct=false;me.fuel=100;me.heat=0;rMsg('ГОТОВО!',1);}}

    if(me.v>vcap)me.v=Math.max(vcap,me.v-TOPV*0.8*dt);

      pSeg.sp.forEach(o=>{if(o.solid&&Math.abs(o.off-me.x)<0.45&&me.v>TOPV*0.08){me.v=TOPV*0.05;me.x=me.x*0.7;rMsg('УДАР!',0.8);}});}
    me.tyre+=dt*me.wear*(pct*pct*Math.abs(pSeg.curve)*0.9+pct*0.25)*(cfg.laps>1?1:0.8);

  me.dist+=me.v*dt;

  c.restore();
}
function drawCar(c,x,y,w,color,night,broken,player,steer=0){
  const h=w*0.5;c.save();
  if(steer)c.translate(0,0);
  c.fillStyle='rgba(0,0,0,.3)';c.beginPath();c.ellipse(x,y,w*0.55,h*0.12,0,0,7);c.fill();
  c.fillStyle='#16171b';c.fillRect(x-w*0.5,y-h*0.5,w*0.2,h*0.5);c.fillRect(x+w*0.3,y-h*0.5,w*0.2,h*0.5);
  c.fillStyle=color||'#333';c.beginPath();c.moveTo(x-w*0.34,y-h*0.2);c.lineTo(x+w*0.34,y-h*0.2);c.lineTo(x+w*0.28,y-h*0.72);c.lineTo(x-w*0.28,y-h*0.72);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.12)';c.fillRect(x-w*0.28,y-h*0.7,w*0.56,h*0.08);
  c.fillStyle='#3a2a1e';c.fillRect(x-w*0.2,y-h*0.98,w*0.4,h*0.28);
  c.fillStyle='#e0b894';c.beginPath();c.arc(x,y-h*1.08,w*0.11,0,7);c.fill();
  c.fillStyle='#2b2118';c.beginPath();c.arc(x,y-h*1.12,w*0.11,Math.PI,0);c.fill();
  c.fillStyle=night?'#ff3b2f':'#8a2a22';c.fillRect(x-w*0.3,y-h*0.36,w*0.06,h*0.08);c.fillRect(x+w*0.24,y-h*0.36,w*0.06,h*0.08);
  if(broken){c.fillStyle='rgba(90,90,90,.55)';for(let i=0;i<3;i++){c.beginPath();c.arc(x+(i-1)*w*0.15,y-h*(1.4+i*0.25),w*(0.14+i*0.05),0,7);c.fill();}}
  c.restore();
}
function finishRace(quit){
  const s=G;if(!R||R.done)return;R.done=true;cancelAnimationFrame(rRaf);
  const me=R.me,T=R.trk;
  R.all.forEach(o=>{if(o.fin===null)o.fin=quit&&o.player?1e9:R.time+Math.max(0,T.raceLen-o.dist)/Math.max(o.vmax*0.85,1);});
  const order=R.all.slice().sort((a,b)=>a.fin-b.fin),place=order.indexOf(me)+1,rc=R.rc;
  const win=place<=3?Math.round(racePrize(rc)*[1,0.5,0.25][place-1]):0,rep=place<=3?Math.round([12,6,3][place-1]*bn('raceRep')):0;
  s.cash+=win;s.rep=clamp(s.rep+rep,0,100);s.raceDone[rc.key]=place;
  s.raceLog.push({y:s.y,name:rc.name,model:me.label,place});
  if(place===1)me.car.raceBoost=mi(s)+6;
  addLog(`${rc.name}: «${me.label}» — ${quit?'сход с дистанции':place+'-е место'}${win?`, приз ${money(win)}`:''}.`,place===1?'good':'');
  checkAch();save();
  document.getElementById('raceScreen').hidden=true;
  const table=order.map((o,i)=>`${i+1}. ${o.name}${o.player?' («'+o.label+'»)':''}`).join(' · ');
  const head=quit?`«${me.label}» сошла с дистанции`:place===1?`Триумф «${me.label}»!`:`«${me.label}» — ${place}-е место`;
  const deck=`${rc.name}, ${MONTHS_N[rc.m]} ${rc.y}`;
  const body=`${quit?'Команда «'+s.company+'» не дошла до финиша.':place===1?'Машина компании «'+s.company+'» первой пересекла финишную черту под рёв толпы. Приз — '+money(win)+'.':'Машина компании «'+s.company+'» финишировала '+place+'-й'+(win?'. Приз — '+money(win)+'.':'.')}\nИтоговый протокол: ${table}.\n${rc.hist}${rc.win?'\nВ реальной истории этой гонки победил '+rc.win+'.':''}`;
  R=null;
  showPaper({title:head,deck,text:body,car:me.car,img:rc.img,imgCap:rc.name+' — историческое фото',kicker:'Спортивный выпуск',caption:`«${me.label}» на трассе`,choices:[['Дальше','close']],act:'paperClose'});
  pendingToasts.forEach(toast);pendingToasts=[];render();
}
document.getElementById('rQuit').addEventListener('click',()=>finishRace(true));
const rCtrl=document.getElementById('rCtrl');
rCtrl.querySelectorAll('button').forEach(b=>{const k=b.dataset.k;
  const on=e=>{e.preventDefault();rKeys[k]=true;b.classList.add('down');if(b.setPointerCapture&&e.pointerId!==undefined)try{b.setPointerCapture(e.pointerId);}catch(_){}};
  const off=()=>{rKeys[k]=false;b.classList.remove('down');};
  b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,off));b.addEventListener('contextmenu',e=>e.preventDefault());});
const KMAP={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',Space:'gas'};
document.addEventListener('keydown',e=>{if(R&&KMAP[e.code]){e.preventDefault();rKeys[KMAP[e.code]]=true;}});
document.addEventListener('keyup',e=>{if(R&&KMAP[e.code]){rKeys[KMAP[e.code]]=false;}});

/* ================= ACTIONS ================= */
function stopAuto(){if(auto){clearInterval(auto);auto=null;const ab=document.getElementById('autoBtn');if(ab){ab.textContent='▶';ab.classList.remove('on');}}}
function doStep(){if(step()){save();render();afterStep();return true;}return false;}
const ACT={
  tab:d=>{tab=d.t;render();window.scrollTo(0,0);},
  next:()=>doStep(),
  quarter:()=>{let ok=false;for(let i=0;i<3;i++){if(!step())break;ok=true;if(G.pending.length)break;}if(ok){save();render();afterStep();}},
  auto:()=>{if(auto){stopAuto();render();return;}auto=setInterval(()=>{if(!doStep()||G.pending.length)stopAuto();},1300);render();},
  line:()=>{const c=lineCost(G);if(G.cash>=c){G.cash-=c;G.lines++;addLog(`Построена линия №${G.lines} за ${money(c)}.`);checkAch();save();render();pendingToasts.forEach(toast);pendingToasts=[];}},
  sellline:()=>{if(G.lines>1){const v=Math.round(lineCost(G)*0.4);G.lines--;G.cash+=v;addLog(`Линия продана за ${money(v)}.`);save();render();}},
  workers:d=>{G.workers=Math.max(0,G.workers+ +d.d);save();render();},
  balance:()=>{G.workers=idealWorkers(G);save();render();},
  conveyor:()=>{if(G.cash>=30000&&!G.conveyor){G.cash-=30000;G.conveyor=true;addLog('Завод переведён на конвейерную сборку.','good');checkAch();save();render();pendingToasts.forEach(toast);pendingToasts=[];}},
  loan:()=>{if(G.loan+10000<=maxLoan(G)){G.loan+=10000;G.cash+=10000;save();render();}},
  repay:()=>{if(G.loan>=10000&&G.cash>=10000){G.loan-=10000;G.cash-=10000;save();render();}},
  price:d=>{const md=G.models.find(m=>m.id===+d.id),st=Math.max(10,Math.round(md.price*0.05/10)*10);md.price=Math.max(50,md.price+st*(+d.d));save();render();},
  retire:d=>{const md=G.models.find(m=>m.id===+d.id),rev=md.stock*md.price*0.6;G.cash+=rev;addLog(`«${md.name}» снята с производства${md.stock?`, остаток ${md.stock} шт. распродан за ${money(rev)}`:''}.`);md.stock=0;md.status='off';save();render();},
  revive:d=>{const md=G.models.find(m=>m.id===+d.id);md.status='prod';addLog(`«${md.name}» снова в производстве.`);save();render();},
  branch:d=>{const c=branchCost(G);if(G.cash>=c&&!G.branches.includes(d.c)){G.cash-=c;G.branches.push(d.c);addLog(`Открыт филиал: ${COUNTRIES[d.c].name}.`,'good');checkAch();save();render();pendingToasts.forEach(toast);pendingToasts=[];}},
  design:()=>openDesigner(),
  pick:d=>{draft[d.k]=d.v;const top=sb.scrollTop;renderDesigner();sb.scrollTop=top;},
  startdev:()=>{const md={...draft},dc=devCost(md);if(G.cash<dc)return;G.cash-=dc;const nm=(draft.name||'').trim()||('Тип '+G.nextId);
    G.models.push({id:G.nextId++,name:nm,e:md.e,c:md.c,b:md.b,t:md.t,paint:md.paint,price:Math.round(refPrice(md,G)*1.05/50)*50,status:'dev',devLeft:devMonths(md),launched:0,stock:0,lastDem:0,lastSold:0,lastMade:0,totalSold:0});
    addLog(`Начата разработка «${nm}» (${money(dc)}, ${devMonths(md)} мес.).`);closeSheet();tab='models';checkAch();save();render();},
  close:()=>closeSheet(),
  choose:d=>{closeSheet();closePaper();resolve(d.k);},
  paperClose:()=>{closePaper();render();},
  paperChoose:()=>{closePaper();},
  reopenPaper:d=>{const p=G.papers[+d.k];if(p)showPaper({...p,deck:p.deck+' · '+p.d,choices:[['Закрыть','close']],act:'paperClose',kicker:p.kicker||'Из архива'},false);},
  help:()=>openHelp(),
  newgame:()=>{draft=null;stopAuto();openNewGame();},
  pion:d=>{const top=sb.scrollTop;draft.pioneer=d.v;draft.country=PIONEERS[d.v].c;draft.company=PIONEERS[d.v].co;const keep=draft;openNewGame();draft=keep;sb.scrollTop=top;},
  country:d=>{const top=sb.scrollTop;draft.country=d.v;draft.company=document.getElementById('cname').value;openNewGame();sb.scrollTop=top;},
  startgame:()=>{newGame(draft.pioneer,draft.country,(draft.company||'').trim());closeSheet();closePaper();tab='plant';shownCash=null;save();render();},
  raceSetup:d=>{draft=null;openRaceSetup(d.k);},
  rset:d=>{const v=d.k==='tyre'?d.v:+d.v;draft[d.k]=v;const top=sb.scrollTop;openRaceSetup(draft.race);sb.scrollTop=top;},
  raceGo:()=>startRace()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset,b);});

  if(R){finishRace(true);return true;}

};
